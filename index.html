          '<p class="modal-subtitle">Cole o texto completo (enunciado + alternativas + resposta) e o sistema identifica tudo. Será salva em "' + escapeHtml(displayName(currentQuiz.id, currentQuiz.name)) + '".</p>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="form-group">' +
            '<label class="form-label">Texto da questão</label>' +
            '<textarea class="form-textarea large" id="paste-area" oninput="pasteInput = this.value; lastParseResult = null" placeholder="Cole aqui o texto completo...">' + escapeHtml(pasteInput) + '</textarea>' +
            '<div class="form-hint">Formato esperado:</div>' +
            '<div class="example-box">' + escapeHtml(exampleText) + '</div>' +
            '<div class="form-hint" style="margin-top:8px">Aceita letras maiúsculas ou minúsculas (A–J), separador ")" ou ".", e caixinhas "( )" ou "[ ]" antes da letra. Aceita "Resposta:" ou "Gabarito:". Múltipla seleção: "Gabarito: a, c, e". A linha "Comentário:" vira a explicação automaticamente.</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Bloco/tema (opcional)</label>' +
            '<input type="text" class="form-input" placeholder="Ex: Bens e Serviços" value="' + escapeHtml(pasteBlock) + '" oninput="pasteBlock = this.value">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Explicação da resposta (opcional)</label>' +
            '<textarea class="form-textarea" placeholder="Comentário que aparece após responder..." oninput="pasteExplanation = this.value">' + escapeHtml(pasteExplanation) + '</textarea>' +
          '</div>' +
          resultHtml +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="modal-btn" onclick="closeModal()">Cancelar</button>' +
          '<button class="modal-btn" onclick="analyzeQuestion()">Analisar</button>' +
          '<button class="modal-btn primary" onclick="saveNewQuestion()">Salvar questão</button>' +
        '</div></div></div>'
  );
}
function analyzeQuestion() {
  const textarea = document.getElementById('paste-area');
  if (textarea) pasteInput = textarea.value;
  try { lastParseResult = { ok: true, data: parseQuestionText(pasteInput) }; }
  catch (e) { lastParseResult = { ok: false, error: e.message }; }
  renderAddQuestionModal();
}
function saveNewQuestion() {
  const textarea = document.getElementById('paste-area');
  if (textarea) pasteInput = textarea.value;
  try {
    const parsed = parseQuestionText(pasteInput);
    const newQ = {
      id: 'custom_' + Date.now(),
      block: pasteBlock.trim() || 'Personalizada',
      type: parsed.type, statement: parsed.statement,
      options: parsed.options, correct: parsed.correct,
      explanation: pasteExplanation.trim() || parsed.explanation || 'Questão personalizada — adicionada pelo usuário.'
    };
    if (parsed.hint) newQ.hint = parsed.hint;
    const customs = loadCustomQuestions();
    customs.push(newQ);
    saveCustomQuestions(customs);
    QUESTIONS.push(newQ);
    const newQIdx = QUESTIONS.length - 1;
    if (currentView === 'quiz') {
      order.push(newQIdx);
    }
    closeModal();
    updateActiveCounter();
    if (currentView === 'quiz') {
      render();
      alert('✓ Questão adicionada! Ela aparecerá ao final do quiz atual (' + order.length + 'ª questão).');
    } else {
      alert('✓ Questão adicionada com sucesso! Total de questões ativas: ' + (QUESTIONS.length - excludedIds.size));
    }
  } catch (e) {
    lastParseResult = { ok: false, error: e.message };
    renderAddQuestionModal();
  }
}


// ===== QUIZ: motor =====
function init(specificIndices) {
  const activeIndices = getActiveIndices();
  if (activeIndices.length === 0) {
    document.getElementById('root').innerHTML = buildHeaderHtml() +
      '<div class="end-screen">' +
        '<div class="end-msg">Todas as questões deste quiz foram excluídas. Restaure alguma para continuar.</div>' +
        '<div class="end-buttons">' +
          '<button class="end-btn" onclick="openExcludedManager()">Ver questões excluídas</button>' +
          '<button class="end-btn secondary" onclick="backToBrowser()">← Voltar</button>' +
        '</div></div>';
    updateActiveCounter();
    return;
  }
  if (specificIndices && specificIndices.length > 0) {
    const filtered = specificIndices.filter(i => !excludedIds.has(QUESTIONS[i].id));
    order = moveInfoFirst(shuffle(filtered)); mode = 'wrongOnly';
  } else {
    order = moveInfoFirst(shuffle(activeIndices)); mode = 'full';
  }
  idx = 0; answers = {}; pendingMulti = []; pendingClassify = {}; pendingSyntax = {}; activeSyntaxGroup = null; pendingMatch = {}; pendingColumns = {}; pendingCodeLines = {};
  saveSession();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function initOrdered() {
  order = moveInfoFirst(getActiveIndices()); mode = 'full';
  idx = 0; answers = {}; pendingMulti = []; pendingClassify = {}; pendingSyntax = {}; activeSyntaxGroup = null; pendingMatch = {}; pendingColumns = {}; pendingCodeLines = {};
  saveSession();
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildHeaderHtml() {
  const name = displayName(currentQuiz.id, currentQuiz.name);
  return '<div class="header">' +
    '<div class="header-text">' +
      '<button class="back-link" onclick="backToBrowser()">← Voltar</button>' +
      '<h1 class="title">' + escapeHtml(name) + '</h1>' +
      (currentQuiz.subtitle ? '<p class="subtitle">' + escapeHtml(currentQuiz.subtitle) + '</p>' : '') +
    '</div>' +
    '<div class="header-actions">' +
      '<button class="header-btn" onclick="openExcludedManager()" title="Ver questões excluídas">📁 Excluídas</button>' +
      '<button class="header-btn" onclick="openBulkImportModal()" title="Importar várias questões de uma vez">📥 Importar em lote</button>' +
      '<button class="header-btn" onclick="confirmClearCustom()" title="Remover todas as questões importadas deste quiz" style="color:var(--danger-text)">🗑️ Limpar importadas</button>' +
      '<button class="header-btn primary" onclick="openAddQuestionModal()" title="Adicionar nova questão">+ Nova questão</button>' +
      '<div class="active-counter" id="active-counter"></div>' +
    '</div>' +
  '</div>';
}

function render() {
  const root = document.getElementById('root');
  const headerHtml = buildHeaderHtml();
  if (idx >= order.length) {
    clearSession();
    let correctCount = 0; const wrongs = [];
    let total = 0;
    for (const qIdx of order) {
      if (QUESTIONS[qIdx].type === 'info') continue; // cartão de leitura não entra no placar
      total++;
      if (isQuestionCorrect(qIdx)) correctCount++;
      else if (answers[qIdx] !== undefined) wrongs.push(qIdx);
    }
    const pct = total === 0 ? 0 : Math.round((correctCount / total) * 100);
    let msg;
    if (total === 0) msg = "Não há questões ativas. Restaure alguma para continuar.";
    else if (pct >= 90) msg = "Domínio excelente do conteúdo!";
    else if (pct >= 75) msg = "Bom resultado. Revise os erros para fixar os detalhes.";
    else if (pct >= 60) msg = "Caminho promissor. Foque nos pontos que errou.";
    else if (pct >= 40) msg = "Releia o conteúdo com atenção antes de refazer.";
    else msg = "Hora de uma revisão completa. Estude bloco por bloco antes de tentar novamente.";
    const wrongsJson = JSON.stringify(wrongs);
    const excludedCount = excludedIds.size;
    root.innerHTML = headerHtml +
      '<div class="end-screen">' +
        '<div class="end-label">Resultado</div>' +
        '<div class="end-score">' + correctCount + ' / ' + total + '</div>' +
        '<div class="end-pct">' + pct + '% de acertos</div>' +
        '<div class="end-msg">' + msg + '</div>' +
        '<div class="end-buttons">' +
          '<button class="end-btn" onclick="init()">Refazer (ordem embaralhada)</button>' +
          '<button class="end-btn secondary" onclick="initOrdered()">Refazer na ordem dos blocos</button>' +
          '<button class="end-btn secondary" onclick=\'init(' + wrongsJson + ')\' ' + (wrongs.length === 0 ? 'disabled' : '') + '>' +
            'Refazer só os erros (' + wrongs.length + ')</button>' +
          '<button class="end-btn warn" onclick="openExcludedManager()">Questões excluídas (' + excludedCount + ')</button>' +
          '<button class="end-btn secondary" onclick="backToBrowser()">← Voltar ao menu</button>' +
        '</div></div>';
    updateActiveCounter();
    return;
  }
  const qIdx = order[idx];
  const q = QUESTIONS[qIdx];
  const userAnswer = answers[qIdx];
  const hasAnswered = userAnswer !== undefined;
  let correctCount = 0;
  for (const orderedIdx of order) if (isQuestionCorrect(orderedIdx)) correctCount++;
  const modeLabel = mode === 'wrongOnly' ? ' (revisão de erros)' : '';
  const correctCountText = q.type === 'multi' ? (Array.isArray(q.correct) ? q.correct.length : 0) + ' corretas' : '1 correta';
  const tag = q.type === 'syntax' ? 'Análise sintática — ' + q.options.length + ' termos' : (q.type === 'classify' ? 'Classificação — ' + q.options.length + ' alternativas' : (q.type === 'match' ? 'Arrastar e soltar — ' + q.options.length + ' itens' : (q.type === 'columns' ? 'Colunas — ' + q.dragItems.length + ' itens' : (q.type === 'code_lines' ? 'Montar código — ' + q.lines.length + ' linhas' : (q.type === 'multi' ? 'Múltipla seleção — ' + correctCountText : 'Resposta única')))));
  const blockTag = q.block ? '<span class="block-tag">' + escapeHtml(q.block) + '</span>' : '';
  const customTag = isCustomQuestion(q) ? '<span class="custom-tag">Personalizada</span>' : '';
  let optionsHtml = '';
  if (q.type === 'match') {
    if (!Array.isArray(q.dragItems) || q.dragItems.length === 0) {
      optionsHtml += '<div style="padding:14px;background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;color:var(--danger-text);font-size:13px;">' +
        '⚠️ Esta questão está com dados corrompidos (falta o campo <code>dragItems</code>). Exclua-a pelo botão "Excluir questão" acima e reimporte no formato correto.' +
        '</div>';
    } else if (!hasAnswered) {
      const pool = matchPoolItems(q);
      optionsHtml += '<div class="match-wrap">';
      optionsHtml += '<div class="match-pool">' +
        '<div class="match-col-label">Arraste</div>';
      for (const it of pool) {
        optionsHtml += '<div class="match-chip" onpointerdown="matchDragStart(event,\'' + it.id + '\', null)">' + renderDragItemContent(it) + '</div>';
      }
      if (pool.length === 0) optionsHtml += '<div class="match-empty-pool">Tudo posicionado ✓</div>';
      optionsHtml += '</div>';
      optionsHtml += '<div class="match-slots">';
      for (const opt of q.options) {
        const assignedId = pendingMatch[opt.id];
        const assignedItem = assignedId ? q.dragItems.find(function(d) { return d.id === assignedId; }) : null;
        optionsHtml += '<div class="match-slot-row">' +
          '<div class="match-slot' + (assignedItem ? ' filled' : '') + '" data-slot-id="' + opt.id + '"' +
            (assignedItem ? ' onpointerdown="matchDragStart(event,\'' + assignedItem.id + '\',\'' + opt.id + '\')" ondblclick="unassignMatch(\'' + opt.id + '\')"' : '') + '>' +
            (assignedItem ? renderDragItemContent(assignedItem) : 'Arraste aqui') +
          '</div>' +
          '<div class="match-def">' + renderDragItemContent(opt) + '</div>' +
        '</div>';
      }
      optionsHtml += '</div></div>';
    } else {
      optionsHtml += '<div class="match-wrap match-wrap-result">';
      for (const opt of q.options) {
        const userItemId = userAnswer[opt.id];
        const correctItemId = q.correct[opt.id];
        const isRight = userItemId === correctItemId;
        const userItem = q.dragItems.find(function(d) { return d.id === userItemId; });
        const correctItem = q.dragItems.find(function(d) { return d.id === correctItemId; });
        const wrongNote = !isRight ? ' <span style="color:var(--danger-text);font-size:12px">você: ' + escapeHtml(userItem ? userItem.label : '—') + '</span>' : '';
        optionsHtml += '<div class="match-slot-row">' +
          '<div class="match-slot filled ' + (isRight ? 'ms-ok' : 'ms-err') + '">' +
            (isRight ? '✓ ' : '✗ ') + renderDragItemContent(correctItem) +
          '</div>' +
          '<div class="match-def">' + renderDragItemContent(opt) + wrongNote + '</div>' +
        '</div>';
      }
      optionsHtml += '</div>';
    }
  } else if (q.type === 'columns') {
    if (!Array.isArray(q.columns) || q.columns.length === 0 || !Array.isArray(q.dragItems) || q.dragItems.length === 0) {
      optionsHtml += '<div style="padding:14px;background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;color:var(--danger-text);font-size:13px;">' +
        '⚠️ Esta questão está com dados corrompidos (falta o campo <code>columns</code> ou <code>dragItems</code>). Exclua-a pelo botão "Excluir questão" acima e reimporte no formato correto.' +
        '</div>';
    } else if (!hasAnswered) {
      const pool = columnsPoolItems(q);
      optionsHtml += '<div class="cols-wrap">';
      if (q.tableLayout) {
        const tl = q.tableLayout;
        optionsHtml += '<div class="grid-table-scroll"><table class="grid-table"><thead><tr><th>' + escapeHtml(tl.rowHeader || '') + '</th>';
        for (const col of tl.cols) optionsHtml += '<th>' + renderDragItemContent(col) + '</th>';
        optionsHtml += '</tr></thead><tbody>';
        for (const row of tl.rows) {
          optionsHtml += '<tr><td class="grid-row-header">' + renderDragItemContent(row) + '</td>';
          for (const col of tl.cols) {
            const cellColId = row.id + '::' + col.id;
            optionsHtml += '<td class="col-box grid-cell" data-col-id="' + cellColId + '">';
            const itemsHere = Object.keys(pendingColumns).filter(function(iid) { return pendingColumns[iid] === cellColId; });
            for (const iid of itemsHere) {
              const it = q.dragItems.find(function(d) { return d.id === iid; });
              if (it) {
                optionsHtml += '<div class="col-chip" onpointerdown="colDragStart(event,\'' + it.id + '\',\'' + cellColId + '\')">' + renderDragItemContent(it) + '</div>';
              }
            }
            optionsHtml += '</td>';
          }
          optionsHtml += '</tr>';
        }
        optionsHtml += '</tbody></table></div>';
      } else {
        optionsHtml += '<div class="cols-board">';
        for (const col of q.columns) {
          optionsHtml += '<div class="col-box" data-col-id="' + col.id + '">' +
            '<div class="col-header">' + renderDragItemContent(col) + '</div>' +
            '<div class="col-body">';
          const itemsHere = Object.keys(pendingColumns).filter(function(iid) { return pendingColumns[iid] === col.id; });
          for (const iid of itemsHere) {
            const it = q.dragItems.find(function(d) { return d.id === iid; });
            if (it) {
              optionsHtml += '<div class="col-chip" onpointerdown="colDragStart(event,\'' + it.id + '\',\'' + col.id + '\')">' + renderDragItemContent(it) + '</div>';
            }
          }
          optionsHtml += '</div></div>';
        }
        optionsHtml += '</div>';
      }
      optionsHtml += '<div class="cols-pool"><div class="cols-pool-label">Arraste para as colunas</div>';
      for (const it of pool) {
        optionsHtml += '<div class="col-chip" onpointerdown="colDragStart(event,\'' + it.id + '\', null)">' + renderDragItemContent(it) + '</div>';
      }
      if (pool.length === 0) optionsHtml += '<div class="cols-empty-pool">Tudo posicionado ✓</div>';
      optionsHtml += '</div></div>';
    } else {
      // Monta os "baldes" esperados por coluna (rótulo -> quantidade),
      // e consome uma cópia mutável conforme os itens realmente
      // colocados vão sendo conferidos — isso trata itens com o mesmo
      // texto (ex.: "OFDM" em 3 colunas) como intercambiáveis entre si.
      const labelOf = {};
      for (const di of q.dragItems) labelOf[di.id] = di.label;
      const expectedBuckets = {};
      for (const di of q.dragItems) {
        const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
        if (exp !== null) {
          expectedBuckets[exp] = expectedBuckets[exp] || {};
          expectedBuckets[exp][labelOf[di.id]] = (expectedBuckets[exp][labelOf[di.id]] || 0) + 1;
        }
      }
      const remaining = {};
      for (const col in expectedBuckets) remaining[col] = Object.assign({}, expectedBuckets[col]);
      const itemStatus = {};
      for (const di of q.dragItems) {
        const actualCol = userAnswer[di.id] || null;
        if (actualCol === null) continue;
        const label = labelOf[di.id];
        if (remaining[actualCol] && remaining[actualCol][label] > 0) {
          itemStatus[di.id] = 'ok';
          remaining[actualCol][label]--;
        } else {
          itemStatus[di.id] = 'err';
        }
      }

      optionsHtml += '<div class="cols-wrap">';
      if (q.tableLayout) {
        const tl = q.tableLayout;
        optionsHtml += '<div class="grid-table-scroll"><table class="grid-table"><thead><tr><th>' + escapeHtml(tl.rowHeader || '') + '</th>';
        for (const col of tl.cols) optionsHtml += '<th>' + renderDragItemContent(col) + '</th>';
        optionsHtml += '</tr></thead><tbody>';
        for (const row of tl.rows) {
          optionsHtml += '<tr><td class="grid-row-header">' + renderDragItemContent(row) + '</td>';
          for (const col of tl.cols) {
            const cellColId = row.id + '::' + col.id;
            optionsHtml += '<td class="col-box grid-cell">';
            for (const di of q.dragItems) {
              const actualCol = userAnswer[di.id] || null;
              if (actualCol !== cellColId) continue;
              const isRight = itemStatus[di.id] === 'ok';
              optionsHtml += '<div class="col-chip ' + (isRight ? 'ms-ok' : 'ms-err') + '">' +
                '<span style="display:block;text-align:center;font-weight:700;">' + (isRight ? '✓' : '✗') + '</span>' +
                renderDragItemContent(di) + '</div>';
            }
            const missingHere = remaining[cellColId] || {};
            const missingEntries = Object.entries(missingHere).filter(function(e) { return e[1] > 0; });
            if (missingEntries.length > 0) {
              optionsHtml += '<div style="font-size:10px;color:var(--danger-text);margin-top:4px;">Faltou: ' +
                missingEntries.map(function(e) { return escapeHtml(e[0]) + (e[1] > 1 ? ' (x' + e[1] + ')' : ''); }).join(', ') +
                '</div>';
            }
            optionsHtml += '</td>';
          }
          optionsHtml += '</tr>';
        }
        optionsHtml += '</tbody></table></div>';
      } else {
      optionsHtml += '<div class="cols-board">';
      for (const col of q.columns) {
        optionsHtml += '<div class="col-box"><div class="col-header">' + renderDragItemContent(col) + '</div><div class="col-body">';
        for (const di of q.dragItems) {
          const actualCol = userAnswer[di.id] || null;
          if (actualCol !== col.id) continue;
          const isRight = itemStatus[di.id] === 'ok';
          optionsHtml += '<div class="col-chip ' + (isRight ? 'ms-ok' : 'ms-err') + '">' +
            '<span style="display:block;text-align:center;font-weight:700;">' + (isRight ? '✓' : '✗') + '</span>' +
            renderDragItemContent(di) + '</div>';
        }
        const missingHere = remaining[col.id] || {};
        const missingEntries = Object.entries(missingHere).filter(function(e) { return e[1] > 0; });
        if (missingEntries.length > 0) {
          optionsHtml += '<div style="font-size:11px;color:var(--danger-text);margin-top:6px;">Faltou: ' +
            missingEntries.map(function(e) { return escapeHtml(e[0]) + (e[1] > 1 ? ' (x' + e[1] + ')' : ''); }).join(', ') +
            '</div>';
        }
        optionsHtml += '</div></div>';
      }
      optionsHtml += '</div>';
      }
      // Itens que não pertencem a nenhuma coluna (distratores)
      const distractorItems = q.dragItems.filter(function(di) {
        const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
        return exp === null;
      });
      if (distractorItems.length > 0) {
        optionsHtml += '<div class="col-box" style="border-style:solid;">' +
          '<div class="col-header">Não pertencem a nenhuma coluna</div><div class="col-body">';
        for (const di of distractorItems) {
          const userColId = userAnswer[di.id] || null;
          const isRight = !userColId;
          const colLabelUser = userColId ? (q.columns.find(function(c) { return c.id === userColId; }) || {}).label : null;
          optionsHtml += '<div class="col-chip ' + (isRight ? 'ms-ok' : 'ms-err') + '">' +
            '<span style="display:block;text-align:center;font-weight:700;">' + (isRight ? '✓' : '✗') + '</span>' +
            renderDragItemContent(di) +
            (isRight ? '' : '<div style="font-size:11px;margin-top:4px;">(você colocou em: ' + escapeHtml(colLabelUser || '—') + ')</div>') +
            '</div>';
        }
        optionsHtml += '</div></div>';
      }
      optionsHtml += '</div>';
    }
  } else if (q.type === 'code_lines') {
    if (!Array.isArray(q.lines) || q.lines.length === 0) {
      optionsHtml += '<div style="padding:14px;background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:8px;color:var(--danger-text);font-size:13px;">' +
        '⚠️ Esta questão está com dados corrompidos (falta o campo <code>lines</code>). Exclua-a pelo botão "Excluir questão" acima e reimporte no formato correto.' +
        '</div>';
    } else if (!hasAnswered) {
      optionsHtml += '<div class="code-lines-wrap">';
      for (let li = 0; li < q.lines.length; li++) {
        const line = q.lines[li];
        const revealed = (li === 0) || !!pendingCodeLines[q.lines[li - 1].id];
        if (!revealed) break;
        const selected = pendingCodeLines[line.id];
        optionsHtml += '<div class="code-line-group">' +
          '<div class="code-line-label">Linha ' + (li + 1) + '</div>' +
          '<div class="code-line-opts">';
        for (const opt of line.options) {
          const isSel = selected === opt.id;
          optionsHtml += '<button class="code-line-opt' + (isSel ? ' selected' : '') + '" ' +
            'onclick="chooseCodeLine(\'' + line.id + '\',\'' + opt.id + '\')">' +
            '<span class="cl-letter">' + opt.id.toUpperCase() + ')</span> ' +
            '<span class="cl-label' + (typeof opt.label === 'string' && opt.label.includes('\n') ? ' code' : '') + '">' + escapeHtml(opt.label) + '</span>' +
            '</button>';
        }
        optionsHtml += '</div></div>';
      }
      optionsHtml += '</div>';
    } else {
      optionsHtml += '<div class="code-lines-wrap">';
      for (let li = 0; li < q.lines.length; li++) {
        const line = q.lines[li];
        const userChoice = userAnswer[line.id];
        const isRight = userChoice === line.correct;
        optionsHtml += '<div class="code-line-group">' +
          '<div class="code-line-label">Linha ' + (li + 1) + ' — ' + (isRight ? '<span class="cl-ok">✓ correta</span>' : '<span class="cl-err">✗ errada</span>') + '</div>' +
          '<div class="code-line-opts">';
        for (const opt of line.options) {
          const isCorrectOpt = opt.id === line.correct;
          const isUserOpt = opt.id === userChoice;
          let cls = 'code-line-opt disabled';
          if (isCorrectOpt) cls += ' cl-correct';
          if (isUserOpt && !isCorrectOpt) cls += ' cl-wrong';
          optionsHtml += '<div class="' + cls + '">' +
            '<span class="cl-letter">' + opt.id.toUpperCase() + ')</span> ' +
            '<span class="cl-label' + (typeof opt.label === 'string' && opt.label.includes('\n') ? ' code' : '') + '">' + escapeHtml(opt.label) + '</span>' +
            (isUserOpt ? '<span class="cl-tag">seu voto</span>' : '') +
            (isCorrectOpt ? '<span class="cl-tag cl-tag-correct">correta</span>' : '') +
            '</div>';
        }
        optionsHtml += '</div></div>';
      }
      optionsHtml += '</div>';
      const codigoCompleto = q.lines.map(function(l) {
        const opt = l.options.find(function(o) { return o.id === l.correct; });
        return opt ? opt.label : '';
      }).join('\n');
      optionsHtml += '<div class="code-lines-final"><div class="code-lines-final-label">Código completo correto:</div>' +
        '<pre class="code-lines-final-body">' + escapeHtml(codigoCompleto) + '</pre></div>';
    }
  } else if (q.type === 'syntax') {
    const clabels = q.classify_labels || { SU:'Sujeito', VB:'Verbo/Pred.', OD:'Obj. direto', OI:'Obj. indireto', PS:'Pred. sujeito', PO:'Pred. objeto', CN:'Comp. nominal', AP:'Ag. passiva', AA:'Adj. adnominal', AV:'Adj. adverbial' };
    const ccolors = q.classify_colors || {};
    const cvs = q.classify_values || Object.keys(clabels);
    if (!hasAnswered) {
      // ── Chips (grupos de tokens) ──
      optionsHtml += '<div class="syntax-chips">';
      for (const opt of q.options) {
        const code = pendingSyntax[opt.id];
        const isActive = activeSyntaxGroup === opt.id;
        let chipStyle = '';
        if (code) {
          const cc = ccolors[code] || {};
          if (cc.bg) chipStyle = 'background:' + cc.bg + ';color:' + cc.color + ';border-color:' + cc.border;
        }
        const chipCls = 'syntax-chip' + (isActive ? ' sy-active' : '') + (code ? ' sy-classified' : '');
        const label = escapeHtml(opt.label) + (code ? ' <small style="opacity:0.75;font-size:12px">(' + escapeHtml(clabels[code]||code) + ')</small>' : '');
        optionsHtml += '<button class="' + chipCls + '" style="' + chipStyle + '" onclick="openSyntaxPalette(\'' + opt.id + '\')">' + label + '</button>';
      }
      optionsHtml += '</div>';
      // ── Paleta (aparece quando um chip está ativo) ──
      if (activeSyntaxGroup) {
        const activeOpt = q.options.find(function(o) { return o.id === activeSyntaxGroup; });
        optionsHtml += '<div class="syntax-palette">' +
          '<div class="syntax-palette-label">Classificar: <strong>' + escapeHtml(activeOpt ? activeOpt.label : '') + '</strong></div>' +
          '<div class="syntax-palette-btns">';
        for (const cv of cvs) {
          const cc = ccolors[cv] || {};
          const style = cc.color ? 'color:' + cc.color + ';background:' + cc.bg + ';border-color:' + cc.border : '';
          const isSel = pendingSyntax[activeSyntaxGroup] === cv;
          optionsHtml += '<button class="syntax-palette-btn' + (isSel ? ' sy-pb-sel' : '') + '" style="' + style + '" onclick="selectSyntax(\'' + activeSyntaxGroup + '\',\'' + cv + '\')">' + escapeHtml(clabels[cv]||cv) + '</button>';
        }
        optionsHtml += '</div></div>';
      }
    } else {
      // ── Resultado ──
      optionsHtml += '<div style="margin-top:4px">';
      for (const opt of q.options) {
        const userChoice = userAnswer[opt.id] || '';
        const correct = q.correct[opt.id];
        const isRight = userChoice === correct;
        const cc = ccolors[correct] || {};
        const badgeStyle = cc.color ? 'color:' + cc.color + ';background:' + cc.bg + ';border-color:' + cc.border : '';
        const wrongNote = !isRight ? ' <span style="color:var(--danger-text);font-size:12px">você: ' + escapeHtml(clabels[userChoice]||userChoice||'—') + '</span>' : '';
        optionsHtml += '<div class="syntax-result-row ' + (isRight ? 'sr-ok' : 'sr-err') + '">' +
          '<span style="font-size:15px;flex-shrink:0">' + (isRight ? '✓' : '✗') + '</span>' +
          '<span class="syntax-badge" style="' + badgeStyle + '">' + escapeHtml(clabels[correct]||correct) + '</span>' +
          '<div style="flex:1"><strong>' + escapeHtml(opt.label) + '</strong>' + wrongNote + '</div>' +
          '</div>';
      }
      optionsHtml += '</div>';
    }
  } else if (q.type === 'classify') {
    // Suporte a valores customizados (ex: Análise Sintática) ou padrão DISP/INEX
    const cvs = q.classify_values || ['DISP', 'INEX'];
    const clabels = q.classify_labels || { DISP: 'DISPENSA', INEX: 'INEXIGIB.' };
    for (const opt of q.options) {
      const userChoice = hasAnswered ? (userAnswer[opt.id] || '') : (pendingClassify[opt.id] || '');
      const correct = q.correct[opt.id];
      const isRight = hasAnswered && userChoice === correct;
      const rowCls = hasAnswered ? (isRight ? ' cr-ok' : ' cr-err') : '';
      const icon = hasAnswered ? (isRight ? '✓ ' : '✗ ') : '';
      const incisoHtml = (hasAnswered && opt.inciso) ? '<span class="cr-inciso">(' + escapeHtml(opt.inciso) + ')</span>' : '';
      let btnsHtml = '';
      for (const cv of cvs) {
        let bCls = 'cr-btn';
        if (!hasAnswered) {
          if (userChoice === cv) bCls += ' cr-sel-i';
        } else {
          if (correct === cv) bCls += ' cr-ans-ok'; else if (userChoice === cv) bCls += ' cr-ans-err';
        }
        const bOnclick = hasAnswered ? '' : 'onclick="toggleClassify(\'' + opt.id + '\', \'' + cv + '\')"';
        btnsHtml += '<button class="' + bCls + '" ' + bOnclick + (hasAnswered ? ' disabled' : '') + '>' + escapeHtml(clabels[cv] || cv) + '</button>';
      }
      optionsHtml += '<div class="classify-row' + rowCls + '">' +
        '<span class="cr-letter">' + icon + opt.id.toUpperCase() + ')</span>' +
        '<span class="cr-text">' + escapeHtml(opt.label) + incisoHtml + '</span>' +
        '<div class="cr-btns">' + btnsHtml + '</div></div>';
    }
  } else if (q.type === 'info') {
    // Cartão de leitura: sem alternativas, sem gabarito. O texto já está no
    // "statement" (renderizado mais abaixo, no bloco .topic) — aqui não há nada a fazer.
  } else {
    for (const opt of q.options) {
      let cls = 'option'; let icon = '';
      if (hasAnswered) {
        const isCorrectOpt = q.type === 'single' ? q.correct === opt.id : q.correct.includes(opt.id);
        const wasSelected = q.type === 'single' ? userAnswer === opt.id : userAnswer.includes(opt.id);
        if (wasSelected && isCorrectOpt) { cls += ' correct'; icon = '✓ '; }
        else if (wasSelected && !isCorrectOpt) { cls += ' incorrect'; icon = '✗ '; }
        else if (!wasSelected && isCorrectOpt) { cls += ' missed'; icon = '◯ '; }
        else { cls += ' dim'; }
      } else if (q.type === 'multi' && pendingMulti.includes(opt.id)) { cls += ' selected'; icon = '☑ '; }
      else if (q.type === 'multi') { icon = '☐ '; }
      const onclick = hasAnswered ? '' : (q.type === 'single' ? 'onclick="answer(\'' + opt.id + '\')"' : 'onclick="togglePending(\'' + opt.id + '\')"');
      const isCode = typeof opt.label === 'string' && opt.label.includes('\n');
      optionsHtml += '<button class="' + cls + '" ' + onclick + (hasAnswered ? ' disabled' : '') + '>' +
        '<span class="opt-letter">' + icon + opt.id.toUpperCase() + ')</span>' +
        '<span class="opt-label' + (isCode ? ' code' : '') + '">' + escapeHtml(opt.label) + '</span></button>';
    }
  }
  let confirmHtml = '';
  if (q.type === 'multi' && !hasAnswered) {
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmMulti()" ' +
      (pendingMulti.length === 0 ? 'disabled' : '') +
      '>Confirmar ' + pendingMulti.length + (pendingMulti.length === 1 ? ' seleção' : ' seleções') + '</button></div>';
  } else if (q.type === 'classify' && !hasAnswered) {
    const classified = q.options.filter(opt => pendingClassify[opt.id]).length;
    const allDone = classified === q.options.length;
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmClassify()" ' +
      (!allDone ? 'disabled' : '') +
      '>' + classified + ' de ' + q.options.length + ' classificadas' + (allDone ? ' — Confirmar' : '') + '</button></div>';
  } else if (q.type === 'syntax' && !hasAnswered) {
    const classified = q.options.filter(function(opt) { return pendingSyntax[opt.id]; }).length;
    const allDone = classified === q.options.length;
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmSyntax()" ' +
      (!allDone ? 'disabled' : '') +
      '>' + classified + ' de ' + q.options.length + ' classificados' + (allDone ? ' — Confirmar' : '') + '</button></div>';
  } else if (q.type === 'match' && !hasAnswered) {
    const placed = q.options.filter(function(opt) { return pendingMatch[opt.id]; }).length;
    const allDone = placed === q.options.length;
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmMatch()" ' +
      (!allDone ? 'disabled' : '') +
      '>' + placed + ' de ' + q.options.length + ' posicionados' + (allDone ? ' — Confirmar' : '') + '</button></div>';
  } else if (q.type === 'columns' && !hasAnswered) {
    const requiredItems = q.dragItems.filter(function(di) {
      const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
      return exp !== null;
    });
    const placedCols = requiredItems.filter(function(di) { return pendingColumns[di.id]; }).length;
    const allDoneCols = placedCols === requiredItems.length;
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmColumns()" ' +
      (!allDoneCols ? 'disabled' : '') +
      '>' + placedCols + ' de ' + requiredItems.length + ' posicionados' + (allDoneCols ? ' — Confirmar' : '') + '</button></div>';
  } else if (q.type === 'code_lines' && !hasAnswered) {
    const totalLinhas = q.lines.length;
    const escolhidas = q.lines.filter(function(l) { return pendingCodeLines[l.id]; }).length;
    const allDoneLinhas = escolhidas === totalLinhas;
    confirmHtml = '<div class="confirm-row"><button class="confirm-btn" onclick="confirmCodeLines()" ' +
      (!allDoneLinhas ? 'disabled' : '') +
      '>' + escolhidas + ' de ' + totalLinhas + ' linhas escolhidas' + (allDoneLinhas ? ' — Confirmar' : '') + '</button></div>';
  }
  let feedbackHtml = '';
  if (hasAnswered) {
    const isCorrect = isQuestionCorrect(qIdx);
    let legendHtml = '';
    if (q.type === 'multi') {
      legendHtml = '<div class="legend">' +
        '<div class="legend-row"><span class="legend-swatch green"></span> Você marcou e era correto</div>' +
        '<div class="legend-row"><span class="legend-swatch red"></span> Você marcou e estava errado</div>' +
        '<div class="legend-row"><span class="legend-swatch yellow"></span> Era correto e você não marcou</div></div>';
    } else if (q.type === 'classify') {
      const hits = q.options.filter(opt => (userAnswer[opt.id] || '') === q.correct[opt.id]).length;
      legendHtml = '<div class="cr-score">' + hits + ' de ' + q.options.length + ' classificações corretas</div>';
    } else if (q.type === 'syntax') {
      const hits = q.options.filter(function(opt) { return (userAnswer[opt.id] || '') === q.correct[opt.id]; }).length;
      legendHtml = '<div class="cr-score">' + hits + ' de ' + q.options.length + ' termos corretos</div>';
    } else if (q.type === 'match') {
      const hits = q.options.filter(function(opt) { return (userAnswer[opt.id] || '') === q.correct[opt.id]; }).length;
      legendHtml = '<div class="cr-score">' + hits + ' de ' + q.options.length + ' associações corretas</div>';
    } else if (q.type === 'columns') {
      const labelOf = {};
      for (const di of q.dragItems) labelOf[di.id] = di.label;
      const expectedBuckets = {};
      for (const di of q.dragItems) {
        const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
        if (exp !== null) {
          expectedBuckets[exp] = expectedBuckets[exp] || {};
          expectedBuckets[exp][labelOf[di.id]] = (expectedBuckets[exp][labelOf[di.id]] || 0) + 1;
        }
      }
      const remainingScore = {};
      for (const col in expectedBuckets) remainingScore[col] = Object.assign({}, expectedBuckets[col]);
      let hits = 0;
      for (const di of q.dragItems) {
        const actualCol = userAnswer[di.id] || null;
        if (actualCol === null) continue;
        const label = labelOf[di.id];
        if (remainingScore[actualCol] && remainingScore[actualCol][label] > 0) {
          hits++;
          remainingScore[actualCol][label]--;
        }
      }
      const requiredTotal = q.dragItems.filter(function(di) {
        const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
        return exp !== null;
      }).length;
      legendHtml = '<div class="cr-score">' + hits + ' de ' + requiredTotal + ' itens na coluna correta</div>';
    } else if (q.type === 'code_lines') {
      const hits = q.lines.filter(function(l) { return (userAnswer[l.id] || '') === l.correct; }).length;
      legendHtml = '<div class="cr-score">' + hits + ' de ' + q.lines.length + ' linhas corretas</div>';
    }
    feedbackHtml = '<div class="feedback"><div class="feedback-header ' + (isCorrect ? 'ok' : 'bad') + '">' +
      (isCorrect ? '✓ Correto' : '✗ Não foi dessa vez') + '</div>' +
      escapeHtml(q.explanation || '').replace(/\n/g, '<br>') + legendHtml + '</div>';
  }
  const hintHtml = q.hint ? '<em>' + escapeHtml(q.hint) + '</em>' : '';
  const confusionHtml = q.confusion_note
    ? '<details class="confusion-note"><summary>💡 O que me confundiu</summary><div class="confusion-note-body">' +
      escapeHtml(q.confusion_note).replace(/\n/g, '<br>') + '</div></details>'
    : '';
  // Suporte a SVG no enunciado: um diagrama vetorial exibido acima do texto,
  // válido em QUALQUER tipo de questão (definido no JSON via "svg": "<svg ...>...</svg>").
  const svgHtml = (typeof q.svg === 'string' && q.svg.trim().startsWith('<svg'))
    ? '<div class="statement-svg">' + q.svg + '</div>'
    : '';
  let mainContentHtml;
  let shortcutsHtml;
  let navHtml;
  if (q.type === 'info') {
    const infoRead = answers[qIdx] === true;
    const infoParts = formatInfoBody(q.statement);
    const infoTipHtml = q.hint ? '<div class="info-card-tip">💡 ' + escapeHtml(q.hint) + '</div>' : '';
    const bodyHtmlScrollable = infoParts.bodyHtml.replace(
      '<div class="info-card-body">',
      '<div class="info-card-body info-card-body-scroll" id="info-scroll-body">'
    );
    const confirmOrBadgeHtml = infoRead
      ? '<div class="info-read-badge">✓ Leitura confirmada</div>'
      : '<div class="info-confirm-row">' +
          '<button id="info-read-btn" class="confirm-btn" disabled onclick="markInfoRead()">✓ Li tudo e entendi</button>' +
        '</div>';
    mainContentHtml =
      '<div class="info-card">' +
        '<div class="info-card-header"><span class="info-card-icon">📖</span><span class="info-card-label">Resumo — sem gabarito</span>' + blockTag + customTag + '</div>' +
        infoParts.titleHtml + svgHtml + bodyHtmlScrollable + infoTipHtml + confirmOrBadgeHtml +
      '</div>';
    shortcutsHtml = '<div class="hint">Atalhos: <span class="kbd">←</span> voltar · <span class="kbd">→</span> avançar · <span class="kbd">Del</span> excluir</div>';
    navHtml = '<div class="nav">' +
      '<button class="nav-btn secondary" onclick="prev()" ' + (idx === 0 ? 'disabled' : '') + '>← Voltar</button>' +
      '<button class="nav-btn" onclick="next()">' + (idx + 1 >= order.length ? 'Ver resultado' : 'Avançar →') + '</button>' +
      '</div>';
  } else {
    mainContentHtml =
      '<span class="prompt-tag">' + tag + '</span>' + blockTag + customTag +
      svgHtml +
      '<div class="topic">' + formatStatementHtml(q.statement) + hintHtml + '</div>' +
      '<div class="options">' + optionsHtml + '</div>' +
      confirmHtml + feedbackHtml;
    shortcutsHtml = '<div class="hint">Atalhos: <span class="kbd">←</span> voltar · <span class="kbd">→</span> avançar · <span class="kbd">A-Z</span> selecionar · <span class="kbd">Enter</span> confirmar múltipla · <span class="kbd">Del</span> excluir</div>';
    navHtml = '<div class="nav">' +
      '<button class="nav-btn secondary" onclick="prev()" ' + (idx === 0 ? 'disabled' : '') + '>← Voltar</button>' +
      '<button class="nav-btn" onclick="next()">' + (idx + 1 >= order.length ? 'Ver resultado' : 'Avançar →') + '</button></div>';
  }
  root.innerHTML = headerHtml +
    '<div class="meta">' +
      '<span>Pergunta ' + (idx + 1) + ' de ' + order.length + modeLabel + '</span>' +
      '<span>Acertos: ' + correctCount + '</span></div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + ((idx / order.length) * 100) + '%"></div></div>' +
    '<div class="top-actions">' + (confusionHtml || '<span></span>') + '<button class="delete-btn" onclick="confirmDelete()" title="Excluir esta questão do quiz">🗑️ Excluir questão</button></div>' +
    mainContentHtml +
    navHtml +
    shortcutsHtml;
  if (q.type === 'info' && answers[qIdx] !== true) {
    setTimeout(initInfoScrollCheck, 0);
  }
  updateActiveCounter();
}

function answer(picked) {
  const qIdx = order[idx];
  if (answers[qIdx] !== undefined) return;
  answers[qIdx] = picked; saveSession(); render();
}
function togglePending(id) {
  const idxOf = pendingMulti.indexOf(id);
  if (idxOf >= 0) pendingMulti.splice(idxOf, 1); else pendingMulti.push(id);
  render();
}
function confirmMulti() {
  if (pendingMulti.length === 0) return;
  answers[order[idx]] = [...pendingMulti];
  pendingMulti = []; saveSession(); render();
}
function toggleClassify(id, type) {
  if (answers[order[idx]] !== undefined) return;
  pendingClassify[id] = (pendingClassify[id] === type) ? null : type;
  render();
}
function confirmClassify() {
  const q = QUESTIONS[order[idx]];
  const allDone = q.options.every(opt => pendingClassify[opt.id]);
  if (!allDone) return;
  answers[order[idx]] = Object.assign({}, pendingClassify);
  pendingClassify = {}; saveSession(); render();
}
function openSyntaxPalette(groupId) {
  if (answers[order[idx]] !== undefined) return;
  activeSyntaxGroup = (activeSyntaxGroup === groupId) ? null : groupId;
  render();
}
function selectSyntax(groupId, code) {
  if (answers[order[idx]] !== undefined) return;
  pendingSyntax[groupId] = code;
  activeSyntaxGroup = null;
  render();
}
function confirmSyntax() {
  const q = QUESTIONS[order[idx]];
  const allDone = q.options.every(function(opt) { return pendingSyntax[opt.id]; });
  if (!allDone) return;
  answers[order[idx]] = Object.assign({}, pendingSyntax);
  pendingSyntax = {}; activeSyntaxGroup = null;
  saveSession(); render();
}
function next() { pendingMulti = []; pendingClassify = {}; pendingSyntax = {}; activeSyntaxGroup = null; pendingMatch = {}; pendingColumns = {}; pendingCodeLines = {}; idx++; saveSession(); render(); }
function prev() { if (idx > 0) { pendingMulti = []; pendingClassify = {}; pendingSyntax = {}; activeSyntaxGroup = null; pendingMatch = {}; pendingColumns = {}; pendingCodeLines = {}; idx--; saveSession(); render(); } }
function markInfoRead() {
  const qIdx = order[idx];
  if (QUESTIONS[qIdx].type !== 'info') return;
  answers[qIdx] = true;
  saveSession();
  next();
}
function initInfoScrollCheck() {
  const body = document.getElementById('info-scroll-body');
  const btn = document.getElementById('info-read-btn');
  if (!body || !btn) return;
  function check() {
    if (body.scrollHeight - body.scrollTop - body.clientHeight < 8) btn.disabled = false;
  }
  body.addEventListener('scroll', check);
  check(); // caso o texto já caiba inteiro sem precisar rolar
}

// ===== MATCH (arrastar e soltar) =====
function matchPoolItems(q) {
  if (!Array.isArray(q.dragItems)) return [];
  if (!q._dragShuffled) { q._dragShuffled = shuffle(q.dragItems.slice()); }
  const usedIds = new Set(Object.values(pendingMatch).filter(Boolean));
  return q._dragShuffled.filter(function(it) { return !usedIds.has(it.id); });
}
function assignMatch(slotId, itemId) {
  if (answers[order[idx]] !== undefined) return;
  // remove esse item de qualquer outro slot onde já estivesse
  for (const k in pendingMatch) { if (pendingMatch[k] === itemId) delete pendingMatch[k]; }
  pendingMatch[slotId] = itemId;
  saveSession(); render();
}
function unassignMatch(slotId) {
  if (answers[order[idx]] !== undefined) return;
  delete pendingMatch[slotId];
  saveSession(); render();
}
function confirmMatch() {
  const q = QUESTIONS[order[idx]];
  const allDone = q.options.every(function(opt) { return pendingMatch[opt.id]; });
  if (!allDone) return;
  answers[order[idx]] = Object.assign({}, pendingMatch);
  pendingMatch = {}; saveSession(); render();
}
function matchDragStart(e, itemId, fromSlot) {
  if (answers[order[idx]] !== undefined) return;
  e.preventDefault();
  const srcEl = e.currentTarget;
  const rect = srcEl.getBoundingClientRect();
  const ghost = srcEl.cloneNode(true);
  ghost.classList.add('match-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  srcEl.classList.add('dragging-source');
  const startX = e.clientX || (e.touches && e.touches[0].clientX) || rect.left;
  const startY = e.clientY || (e.touches && e.touches[0].clientY) || rect.top;
  dragState = { itemId: itemId, fromSlot: fromSlot, ghost: ghost, offsetX: startX - rect.left, offsetY: startY - rect.top, srcEl: srcEl };
  try { srcEl.setPointerCapture(e.pointerId); } catch (err) {}
  srcEl.addEventListener('pointermove', matchDragMove);
  srcEl.addEventListener('pointerup', matchDragEnd);
  srcEl.addEventListener('pointercancel', matchDragEnd);
}
function matchDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  itAutoScrollUpdate(e.clientY);
  const x = e.clientX, y = e.clientY;
  dragState.ghost.style.left = (x - dragState.offsetX) + 'px';
  dragState.ghost.style.top = (y - dragState.offsetY) + 'px';
  dragState.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  dragState.ghost.style.display = '';
  document.querySelectorAll('.match-slot.drop-hover').forEach(function(el) { el.classList.remove('drop-hover'); });
  const slotEl = under && under.closest ? under.closest('.match-slot') : null;
  if (slotEl) slotEl.classList.add('drop-hover');
}
function matchDragEnd(e) {
  itAutoScrollStop();
  if (!dragState) return;
  const x = e.clientX, y = e.clientY;
  dragState.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  const slotEl = under && under.closest ? under.closest('.match-slot') : null;
  const poolEl = under && under.closest ? under.closest('.match-pool') : null;
  document.body.removeChild(dragState.ghost);
  dragState.srcEl.classList.remove('dragging-source');
  dragState.srcEl.removeEventListener('pointermove', matchDragMove);
  dragState.srcEl.removeEventListener('pointerup', matchDragEnd);
  dragState.srcEl.removeEventListener('pointercancel', matchDragEnd);
  document.querySelectorAll('.match-slot.drop-hover').forEach(function(el) { el.classList.remove('drop-hover'); });
  if (slotEl && slotEl.dataset.slotId) {
    assignMatch(slotEl.dataset.slotId, dragState.itemId);
  } else if (poolEl && dragState.fromSlot) {
    unassignMatch(dragState.fromSlot);
  }
  dragState = null;
}

// ===== COLUMNS (colunas fixas, múltiplos itens por coluna) =====
function columnsPoolItems(q) {
  if (!Array.isArray(q.dragItems)) return [];

  return q._dragShuffled.filter(function(it) { return !pendingColumns[it.id]; });
}
function assignColumn(itemId, colId) {
  if (answers[order[idx]] !== undefined) return;
  pendingColumns[itemId] = colId;
  saveSession(); render();
}
function unassignColumnItem(itemId) {
  if (answers[order[idx]] !== undefined) return;

  saveSession(); render();
}
function confirmColumns() {
  const q = QUESTIONS[order[idx]];
  const required = q.dragItems.filter(function(di) {
    const exp = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
    return exp !== null;
  });
  const allDone = required.every(function(di) { return pendingColumns[di.id]; });
  if (!allDone) return;
  answers[order[idx]] = Object.assign({}, pendingColumns);
  pendingColumns = {}; saveSession(); render();
}

}
function colDragStart(e, itemId, fromColId) {

function colDragMove(e) {

  colDragState.ghost.style.display = '';
  document.querySelectorAll('.col-box.drop-hover').forEach(function(el) { el.classList.remove('drop-hover'); });
  const colEl = under && under.closest ? under.closest('.col-box') : null;
  if (colEl) colEl.classList.add('drop-hover');
}
function colDragEnd(e) {
  itAutoScrollStop();
  if (!colDragState) return;
  const x = e.clientX, y = e.clientY;
  colDragState.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  const colEl = under && under.closest ? under.closest('.col-box') : null;
  const poolEl = under && under.closest ? under.closest('.cols-pool') : null;
  document.body.removeChild(colDragState.ghost);
  colDragState.srcEl.classList.remove('dragging-source');
  colDragState.srcEl.removeEventListener('pointermove', colDragMove);
  colDragState.srcEl.removeEventListener('pointerup', colDragEnd);
  colDragState.srcEl.removeEventListener('pointercancel', colDragEnd);
  document.querySelectorAll('.col-box.drop-hover').forEach(function(el) { el.classList.remove('drop-hover'); });
  if (colEl && colEl.dataset.colId) {
    assignColumn(colDragState.itemId, colEl.dataset.colId);
  } else if (poolEl) {
    unassignColumnItem(colDragState.itemId);
  }
  colDragState = null;
}

document.addEventListener('keydown', function(e) {
  if (currentView !== 'quiz') return;
  if (modalState) return;
  if (idx >= order.length) return;
  if (e.key === 'ArrowRight') {
    e.preventDefault(); next();
  }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'Enter') {
    const q = QUESTIONS[order[idx]];
    if (q.type === 'multi' && answers[order[idx]] === undefined && pendingMulti.length > 0) { e.preventDefault(); confirmMulti(); }
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault(); confirmDelete();
  } else if (/^[a-z]$/i.test(e.key)) {
    const q = QUESTIONS[order[idx]];
    if (answers[order[idx]] !== undefined) return;
    if (q.type === 'columns' || q.type === 'match' || q.type === 'classify' || q.type === 'syntax' || q.type === 'code_lines' || q.type === 'info') return;
    const id = e.key.toLowerCase();
    if (!q.options.some(o => o.id === id)) return;
    if (q.type === 'single') answer(id); else togglePending(id);
  }
});

// START
renderBrowser();
</script>

<!-- ===== BACKUP AUTOMÁTICO DO LOCALSTORAGE (a cada 72h) ===== -->
<div id="backup-aviso" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#fff3cd; color:#664d03; border-bottom:2px solid #ffecb5; padding:12px 16px; font-family:sans-serif; font-size:14px; align-items:center; justify-content:space-between; gap:12px; box-shadow:0 2px 6px rgba(0,0,0,0.15);">
  <span>⚠️ Já se passaram mais de 72h desde o último backup. Recomendado baixar agora.</span>
  <div style="display:flex; gap:8px; flex-shrink:0;">
    <button id="backup-baixar-btn" style="background:#664d03; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:14px;">Baixar backup agora</button>
    <button id="backup-depois-btn" style="background:transparent; color:#664d03; border:1px solid #664d03; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:14px;">Lembrar depois</button>
  </div>
</div>

<script type="text/plain" id="app-backup-src">
(function() {
  const CHAVE_ULTIMO_BACKUP = '__ultimo_backup_timestamp__';
  const INTERVALO_MS = 72 * 60 * 60 * 1000; // 72 horas

  function getUltimoBackup() {
    const v = localStorage.getItem(CHAVE_ULTIMO_BACKUP);
    return v ? parseInt(v, 10) : 0;
  }

  function setUltimoBackup(timestamp) {
    localStorage.setItem(CHAVE_ULTIMO_BACKUP, String(timestamp));
  }

  function baixarBackup() {
    const dados = {};
    for (let i = 0; i < localStorage.length; i++) {
      const chave = localStorage.key(i);
      dados[chave] = localStorage.getItem(chave);
    }

    const json = JSON.stringify(dados, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const agora = new Date();
    const dataFormatada = agora.toISOString().slice(0,19).replace(/[:T]/g, '-');
    const nomeArquivo = `backup-localstorage-${dataFormatada}.json`;

    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    setUltimoBackup(Date.now());
    document.getElementById('backup-aviso').style.display = 'none';
  }

  function verificarBackup() {
    const ultimo = getUltimoBackup();
    const agora = Date.now();

    // Primeira vez que abre o arquivo: já marca como "backup feito agora"
    // pra não pedir backup na primeira abertura
    if (ultimo === 0) {
      setUltimoBackup(agora);
      return;
    }

    if (agora - ultimo >= INTERVALO_MS) {
      document.getElementById('backup-aviso').style.display = 'flex';
    }
  }

  (function() {
    verificarBackup();

    document.getElementById('backup-baixar-btn').addEventListener('click', function() {
      Promise.resolve(window.itBackupDownload()).then(function() { document.getElementById('backup-aviso').style.display = 'none'; });
    });

    document.getElementById('backup-depois-btn').addEventListener('click', function() {
      document.getElementById('backup-aviso').style.display = 'none';
    });
  })();
})();
</script>

<script>
/* ===== v21: backup, restauracao e modo offline ===== */
/* ===== v21: rolagem automatica ao arrastar perto da borda da tela ===== */
var __itScroll = { v: 0, raf: 0 };
window.itAutoScrollUpdate = function (y) {
  var h = window.innerHeight, edge = 90, max = 18, v = 0;
  if (y < edge) v = -Math.ceil((edge - y) / edge * max);
  else if (y > h - edge) v = Math.ceil((y - (h - edge)) / edge * max);
  __itScroll.v = v;
  if (v !== 0 && !__itScroll.raf) {
    var step = function () {
      if (__itScroll.v === 0) { __itScroll.raf = 0; return; }
      window.scrollBy({ top: __itScroll.v, left: 0, behavior: 'instant' });
      __itScroll.raf = requestAnimationFrame(step);
    };
    __itScroll.raf = requestAnimationFrame(step);
  }
};
window.itAutoScrollStop = function () {
  __itScroll.v = 0;
  if (__itScroll.raf) { cancelAnimationFrame(__itScroll.raf); __itScroll.raf = 0; }
};
function itIsMobile() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
window.itBackupDownload = function () {
  var dados = {};
  try { localStorage.setItem('__ultimo_backup_timestamp__', String(Date.now())); } catch (e) {}
  for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); dados[k] = localStorage.getItem(k); }
  var json = JSON.stringify(dados, null, 2);
  var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  var nome = 'backup-localstorage-' + stamp + '.json';
  var file = null;
  try { file = new File([json], nome, { type: 'application/json' }); } catch (e) {}
  if (file && itIsMobile() && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: 'Backup do Quiz' }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      itBaixarBlob(json, nome);
    });
  }
  itBaixarBlob(json, nome);
  return Promise.resolve();
};
function itBaixarBlob(json, nome) {
  var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  var a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
window.itBackupRestore = function () {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var obj;
      try { obj = JSON.parse(r.result); } catch (e) { alert('Arquivo inválido: não é um JSON.'); return; }
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) { alert('Arquivo inválido: não parece um backup deste quiz.'); return; }
      var keys = Object.keys(obj).filter(function (k) { return typeof obj[k] === 'string'; });
      if (!keys.length) { alert('O arquivo não tem dados do quiz.'); return; }
      if (!confirm('Restaurar ' + keys.length + ' itens do backup? Os dados com as mesmas chaves serão substituídos.')) return;
      var ok = 0, falhou = 0;
      keys.forEach(function (k) { try { localStorage.setItem(k, obj[k]); ok++; } catch (e) { falhou++; } });
      try { localStorage.setItem('__ultimo_backup_timestamp__', String(Date.now())); } catch (e) {}
      alert('Restaurados: ' + ok + ' itens' + (falhou ? ' (' + falhou + ' falharam)' : '') + '. O quiz será recarregado.');
      setTimeout(function () { location.reload(); }, 600);
    };
    r.readAsText(f);
  };
  inp.click();
};
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
/* roda os scripts do app so depois que o armazenamento estiver pronto */
(function () {
  function run(id) {
    var el = document.getElementById(id); if (!el) return;
    var s = document.createElement('script'); s.text = el.textContent; document.body.appendChild(s);
  }
  (window.__storageReady || Promise.resolve()).then(function () { run('app-main-src'); run('app-backup-src'); });
})();
</script>
