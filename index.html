const ORDER_KEY = 'quiz_estudos_item_order';
function loadItemOrders() {
  try { const raw = localStorage.getItem(ORDER_KEY); return raw ? JSON.parse(raw) : {}; } catch(e) { return {}; }
}
function saveItemOrders(obj) {
  try { localStorage.setItem(ORDER_KEY, JSON.stringify(obj)); } catch(e) {}
}
// key = JSON.stringify(navStack), value = array of ids in order
let itemOrders = loadItemOrders();

function getOrderKey(stack) { return JSON.stringify(stack); }

function applyOrder(stack, folders, quizzes) {
  const key = getOrderKey(stack);
  const savedOrder = itemOrders[key];
  if (!savedOrder || savedOrder.length === 0) return [...folders, ...quizzes];
  // Build a map id -> item
  const allItems = [...folders, ...quizzes];
  const map = {};
  for (const item of allItems) map[item.id] = item;
  // Items that appear in savedOrder first, then any new items appended at end
  const result = [];
  for (const id of savedOrder) { if (map[id]) { result.push(map[id]); delete map[id]; } }
  for (const item of allItems) { if (map[item.id]) result.push(item); }
  return result;
}

function saveCurrentOrder() {
  const key = getOrderKey(navStack);
  const list = document.querySelectorAll('#item-list-container [data-item-id]');
  const ids = Array.from(list).map(el => el.getAttribute('data-item-id'));
  itemOrders[key] = ids;
  saveItemOrders(itemOrders);
}

// ===== DRAG AND DROP =====
let _dragSrcId = null;
let _dragSrcEl = null;

function initDragDrop() {
  const container = document.getElementById('item-list-container');
  if (!container) return;

  // Só permite arrastar quando o mousedown veio do handle
  container.addEventListener('mousedown', function(e) {
    const handle = e.target.closest('.drag-handle');
    const item = e.target.closest('[data-item-id]');
    if (item) item.draggable = !!handle;
  });

  // Mouse drag
  container.addEventListener('dragstart', onDragStart);
  container.addEventListener('dragover', onDragOver);
  container.addEventListener('dragleave', onDragLeave);
  container.addEventListener('drop', onDrop);
  container.addEventListener('dragend', onDragEnd);

  // Touch drag
  container.addEventListener('touchstart', onTouchStart, { passive: false });
  container.addEventListener('touchmove', onTouchMove, { passive: false });
  container.addEventListener('touchend', onTouchEnd);
}

function getDragItem(el) {
  while (el && !el.hasAttribute('data-item-id')) el = el.parentElement;
  return el;
}
function isDragHandle(el) {
  while (el) { if (el.classList && el.classList.contains('drag-handle')) return true; el = el.parentElement; }
  return false;
}

function onDragStart(e) {
  const item = getDragItem(e.target);
  if (!item) { e.preventDefault(); return; }
  _dragSrcId = item.getAttribute('data-item-id');
  _dragSrcEl = item;
  item.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragSrcId);
}
function clearDragIndicators() {
  document.querySelectorAll('.drag-over-above, .drag-over-below').forEach(el => {
    el.classList.remove('drag-over-above', 'drag-over-below');
  });
}
function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const item = getDragItem(e.target);
  if (!item || item === _dragSrcEl) return;
  clearDragIndicators();
  const rect = item.getBoundingClientRect();
  const mid = rect.top + rect.height / 2;
  if (e.clientY < mid) item.classList.add('drag-over-above');
  else item.classList.add('drag-over-below');
}
function onDragLeave(e) {
  const item = getDragItem(e.target);
  if (item) { item.classList.remove('drag-over-above', 'drag-over-below'); }
}
function onDrop(e) {
  e.preventDefault();
  const target = getDragItem(e.target);
  if (!target || !_dragSrcEl || target === _dragSrcEl) { clearDragIndicators(); return; }
  const container = document.getElementById('item-list-container');
  const above = target.classList.contains('drag-over-above');
  clearDragIndicators();
  if (above) container.insertBefore(_dragSrcEl, target);
  else { target.nextSibling ? container.insertBefore(_dragSrcEl, target.nextSibling) : container.appendChild(_dragSrcEl); }
  saveCurrentOrder();
}
function onDragEnd() {
  clearDragIndicators();
  if (_dragSrcEl) _dragSrcEl.classList.remove('dragging');
  _dragSrcId = null; _dragSrcEl = null;
}

// Touch drag state
let _touch = null;
let _touchClone = null;
let _touchOffX = 0, _touchOffY = 0;

function onTouchStart(e) {
  const handle = isDragHandle(e.target);
  if (!handle) return;
  const item = getDragItem(e.target);
  if (!item) return;
  e.preventDefault();
  const t = e.touches[0];
  _touch = { item, startX: t.clientX, startY: t.clientY, moved: false };
  const rect = item.getBoundingClientRect();
  _touchOffX = t.clientX - rect.left;
  _touchOffY = t.clientY - rect.top;
  _touchClone = item.cloneNode(true);
  _touchClone.style.cssText = 'position:fixed;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;opacity:0.85;pointer-events:none;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.18);border-radius:12px;';
  document.body.appendChild(_touchClone);
  item.style.opacity = '0.3';
  _dragSrcEl = item;
}
function onTouchMove(e) {
  if (!_touch) return;
  e.preventDefault();
  const t = e.touches[0];
  _touch.moved = true;
  _touchClone.style.left = (t.clientX - _touchOffX) + 'px';
  _touchClone.style.top = (t.clientY - _touchOffY) + 'px';
  clearDragIndicators();
  const container = document.getElementById('item-list-container');
  for (const child of container.children) {
    if (child === _touch.item || !child.hasAttribute('data-item-id')) continue;
    const rect = child.getBoundingClientRect();
    if (t.clientY >= rect.top && t.clientY <= rect.bottom) {
      const mid = rect.top + rect.height / 2;
      if (t.clientY < mid) child.classList.add('drag-over-above');
      else child.classList.add('drag-over-below');
      break;
    }
  }
}
function onTouchEnd(e) {
  if (!_touch) return;
  if (_touchClone) { _touchClone.remove(); _touchClone = null; }
  if (_touch.item) _touch.item.style.opacity = '';
  clearDragIndicators();
  if (_touch.moved) {
    const t = e.changedTouches[0];
    const container = document.getElementById('item-list-container');
    for (const child of container.children) {
      if (child === _touch.item || !child.hasAttribute('data-item-id')) continue;
      const rect = child.getBoundingClientRect();
      if (t.clientY >= rect.top && t.clientY <= rect.bottom) {
        const mid = rect.top + rect.height / 2;
        if (t.clientY < mid) container.insertBefore(_touch.item, child);
        else { child.nextSibling ? container.insertBefore(_touch.item, child.nextSibling) : container.appendChild(_touch.item); }
        break;
      }
    }
    saveCurrentOrder();
  }
  _touch = null; _dragSrcEl = null;
}

function migrateCustomQuestion(q) {
  // Migra questões de Análise Sintática importadas com versões anteriores.
  // Detecta pelo correct: se for objeto e os valores NÃO forem DISP/INEX → é sintaxe.
  if (q.type === 'classify' && q.correct && typeof q.correct === 'object' && !Array.isArray(q.correct)) {
    const vals = Object.values(q.correct);
    if (vals.length > 0 && !vals.includes('DISP') && !vals.includes('INEX')) {
      q.type = 'syntax';
    }
  }
  return q;
}
function loadCustomQuestions() {

}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Renderiza o conteúdo de um dragItem (usado em columns/match): se o item tiver um campo
// "svg" com um <svg>...</svg> confiável (vindo do JSON da própria questão, não de input do usuário),
// renderiza o SVG cru; caso contrário, cai no texto normal (escapado).
function renderDragItemContent(item) {
  if (item && typeof item.svg === 'string' && item.svg.trim().startsWith('<svg')) {
    return '<span class="drag-svg-wrap" title="' + escapeHtml(item.label || '') + '">' + item.svg + '</span>';
  }
  return escapeHtml(item ? item.label : '');
}
function formatStatementHtml(str) {
  let escaped = escapeHtml(str);
  escaped = escaped.replace(/^(Texto-base:)/m, '<strong>$1</strong>');
  escaped = escaped.replace(/^(Enunciado:)/m, '<strong>$1</strong>');
  return escaped;
}
function formatInfoBody(str) {
  // Separa o texto de um cartão "info" em título (opcional) + parágrafos.
  // Convenção: se o primeiro bloco (antes de uma linha em branco) for curto
  // e de uma linha só, ele vira o título; o resto vira parágrafos normais.
  const blocks = String(str || '').split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
  let titleHtml = '';
  let bodyBlocks = blocks;
  if (blocks.length > 1 && !blocks[0].includes('\n') && blocks[0].length <= 80) {
    titleHtml = '<div class="info-card-title">' + escapeHtml(blocks[0]) + '</div>';
    bodyBlocks = blocks.slice(1);
  }
  const bodyHtml = '<div class="info-card-body">' +
    bodyBlocks.map(b => '<p>' + escapeHtml(b).replace(/\n/g, '<br>') + '</p>').join('') +
    '</div>';
  return { titleHtml, bodyHtml };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Reordena um array de índices de questão para que os cartões "info" (resumos, sem
// gabarito) venham sempre primeiro, preservando a ordem relativa dentro de cada grupo.
function moveInfoFirst(indices) {
  const infos = [];
  const rest = [];
  for (const i of indices) {
    if (QUESTIONS[i] && QUESTIONS[i].type === 'info') infos.push(i);
    else rest.push(i);
  }
  return [...infos, ...rest];
}
function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort(); const sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function getNodeByPath(stack) {
  // retorna { folders, quizzes } do nível atual
  let level = { folders: STRUCTURE.folders, quizzes: [] };
  for (const fid of stack) {
    const folder = (level.folders || []).find(f => f.id === fid);
    if (!folder) break;
    level = { folders: folder.folders || [], quizzes: folder.quizzes || [], _self: folder };
  }
  return level;
}

function getQuizStats(quiz) {
  let excluded = new Set();
  let customs = [];
  try {
    const rawEx = localStorage.getItem(quiz.storageKey + '_excluded');
    if (rawEx === null) excluded = new Set(quiz.excludedDefault || []);
    else excluded = new Set(JSON.parse(rawEx));
  } catch (e) {}
  try {
    const rawC = localStorage.getItem(quiz.storageKey + '_custom');
    if (rawC) customs = JSON.parse(rawC);
  } catch (e) {}
  const total = quiz.questions.length + customs.length;
  const active = total - excluded.size;
  return { total, active, excluded: excluded.size, custom: customs.length };
}

function countQuizzesInFolder(folder) {
  let n = 0;
  if (folder.quizzes) n += folder.quizzes.length;
  if (folder.folders) for (const f of folder.folders) n += countQuizzesInFolder(f);
  return n;
}

function openQuiz(qid) {
  const quiz = findQuizByIdDynamic(qid);
  if (!quiz) return;
  currentQuiz = quiz;
  excludedIds = loadExcluded();
  QUESTIONS = [...(currentQuiz.questions || []), ...loadCustomQuestions()];
  currentView = 'quiz';

  // Verifica se há sessão salva para este quiz
  const session = loadSession();
  if (session && session.quizId === qid && session.order && session.order.length > 0 && session.idx < session.order.length) {
    const answered = Object.keys(session.answers || {}).length;
    const remaining = session.order.length - session.idx;

        '</div>' +
      '</div>'
    );
  } else {
    init();
  }
}

function resumeSession() {
  const session = loadSession();

  order = session.order;

function promptRename(id, type) {
  let original = '';
  function search(folders) {
    for (const folder of folders) {
      if (folder.id === id) { original = folder.name; return; }
      if (folder.quizzes) { const q = folder.quizzes.find(x => x.id === id); if (q) { original = q.name; return; } }
      if (folder.folders) search(folder.folders);
    }
  }
  search(getRuntimeStructure().folders);
  const current = displayName(id, original);
  openModal(
    '<div class="modal-overlay" onclick="closeModal()">' +
      '<div class="modal" onclick="event.stopPropagation()">' +
        '<div class="modal-header"><h2 class="modal-title">Renomear ' + (type === 'folder' ? 'pasta' : 'quiz') + '</h2></div>' +
        '<div class="modal-body">' +
          '<div class="form-group">' +
            '<input type="text" class="form-input" id="rename-input" value="' + escapeHtml(current) + '" placeholder="Novo nome">' +
            '<div class="form-hint">A renomeação é apenas visual. Seu progresso e suas questões permanecem intactos.</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="modal-btn" onclick="closeModal()">Cancelar</button>' +
          '<button class="modal-btn primary" onclick="doRename(\'' + id + '\')">Salvar</button>' +
        '</div>' +
      '</div></div>'
  );
  setTimeout(() => { const el = document.getElementById('rename-input'); if (el) { el.focus(); el.select(); } }, 50);
}

function doDeleteFolder(fid) {
  // Remove a pasta e subpastas recursivamente
  function collectFolderIds(id, all) {
    const result = [id];
    for (const f of all) {
      if (JSON.stringify(f.parentPath).includes(id)) result.push(f.id);
    }
    return result;
  }
  const allFolders = loadCustomFolders();
  const toRemove = collectFolderIds(fid, allFolders);
  const newFolders = allFolders.filter(f => !toRemove.includes(f.id));
  saveCustomFolders(newFolders);

  // Remove quizzes que estavam nessas pastas
  const allQuizzes = loadCustomQuizzesIndex();
  const newQuizzes = allQuizzes.filter(q => !toRemove.some(rid => JSON.stringify(q.parentPath).includes(rid)));
  saveCustomQuizzesIndex(newQuizzes);

  // Remove do renames
  const r = loadRenames();
  delete r[fid];
  saveRenames(r);

  closeModal();
  renderBrowser();
}

// ===== QUIZ: helpers =====
function isQuestionCorrect(qIdx) {
  const q = QUESTIONS[qIdx]; const ans = answers[qIdx];
  if (ans === undefined) return false;
  if (q.type === 'info') return false; // cartão de leitura não tem gabarito — nunca conta como "acerto"
  if (q.type === 'single') return ans === q.correct;
  if (q.type === 'classify' || q.type === 'syntax' || q.type === 'match') {
    for (const opt of q.options) { if ((ans[opt.id] || '') !== q.correct[opt.id]) return false; }
    return true;
  }
  if (q.type === 'columns') {
    // Compara por MULTISET de rótulos em cada coluna, não por ID fixo —
    // assim, cards com texto idêntico (ex.: "OFDM" aparecendo em 3 colunas
    // diferentes) são tratados como intercambiáveis entre si, evitando
    // ambiguidade artificial quando o mesmo texto é esperado em mais de
    // um lugar.
    const labelOf = {};
    for (const di of q.dragItems) labelOf[di.id] = di.label;

    const expectedBuckets = {};
    const actualBuckets = {};

    for (const di of q.dragItems) {
      const expectedCol = (q.correct[di.id] === undefined) ? null : q.correct[di.id];
      const actualCol = ans[di.id] || null;
      const label = labelOf[di.id];

      if (expectedCol !== null) {
        expectedBuckets[expectedCol] = expectedBuckets[expectedCol] || {};
        expectedBuckets[expectedCol][label] = (expectedBuckets[expectedCol][label] || 0) + 1;
      } else if (actualCol !== null) {
        // Distrator (sem coluna correta) foi posicionado em alguma coluna: errado.
        return false;
      }

      if (actualCol !== null) {
        actualBuckets[actualCol] = actualBuckets[actualCol] || {};
        actualBuckets[actualCol][label] = (actualBuckets[actualCol][label] || 0) + 1;
      }
    }

    const allCols = new Set([...Object.keys(expectedBuckets), ...Object.keys(actualBuckets)]);
    for (const col of allCols) {
      const exp = expectedBuckets[col] || {};
      const act = actualBuckets[col] || {};
      const keys = new Set([...Object.keys(exp), ...Object.keys(act)]);
      for (const k of keys) {
        if ((exp[k] || 0) !== (act[k] || 0)) return false;
      }
    }
    return true;
  }
  if (q.type === 'code_lines') {
    for (const line of q.lines) { if ((ans[line.id] || '') !== line.correct) return false; }
    return true;
  }
  return arraysEqual(ans, q.correct);
}

  const set = window._restoreSet || new Set();

    if (set.has(id)) { item.classList.add('checked'); item.querySelector('.deleted-item-check').textContent = '✓'; }

  for (const id of set) excludedIds.delete(id);

  closeModal(); updateActiveCounter(); init();

// ===== PARSER DE QUESTÕES =====
function parseQuestionText(rawText) {
  if (!rawText || !rawText.trim()) throw new Error("O campo está vazio. Cole o texto da questão.");
  let text = rawText.replace(/\r\n/g, '\n').replace(/\*\*/g, '').replace(/^\*|\*$/gm, '').trim();
  text = text.replace(/^Quest[ãa]o\s+\d+\s*\n/i, '').trim();
  // Remove marcadores de caixa/seleção antes da letra: "( )", "(  )", "( X )", "[ ]", "○", "□" etc.
  text = text.replace(/^[ \t]*(?:[\(\[][ \t]*[xX✓.]?[ \t]*[\)\]]|[○●□■☐☑])[ \t]*(?=[A-Za-z][\).])/gm, '');
  // Aceita letras maiúsculas OU minúsculas, com separador ")" ou "."
  const altRegex = /^\s*([A-Za-z])[\).]\s*(.+?)\s*$/gm;
  // Limite: não procurar alternativas depois do gabarito (evita ler linhas do comentário como alternativas)
  const _gab = text.match(/(?:Respostas?|Gabarito)\s*:/i);
  const _gabIdx = _gab ? text.indexOf(_gab[0]) : text.length;
  const matches = []; let m;
  while ((m = altRegex.exec(text)) !== null) {
    if (m.index >= _gabIdx) break;
    matches.push({ letter: m[1].toUpperCase(), index: m.index, fullMatch: m[0], textStart: m.index + (m[0].length - m[2].length) });
  }
  if (matches.length < 2) throw new Error("Não consegui identificar pelo menos 2 alternativas. Verifique se cada uma está no formato 'A) texto'.");
  let statement = text.substring(0, matches[0].index).trim();
  let hint = '';
  const hintRegex = /\((Marque[^)]+)\)\s*$/i;
  const hintMatch = statement.match(hintRegex);
  if (hintMatch) { hint = hintMatch[1].trim(); statement = statement.replace(hintRegex, '').trim(); }
  statement = statement.replace(/^["'\u201C\u201D]+|["'\u201C\u201D]+$/g, '').trim();
  if (!statement) throw new Error("Enunciado não identificado. Verifique se há texto antes das alternativas.");
  const respostaRegex = /(?:Respostas?|Gabarito)\s*:\s*([^\n]+)/i;
  const respostaMatch = text.match(respostaRegex);
  if (!respostaMatch) throw new Error("Não encontrei a linha 'Resposta:' ou 'Gabarito:'. Verifique o formato.");
  const respostaText = respostaMatch[1].trim();
  const respostaIdx = text.indexOf(respostaMatch[0]);
  const correctLetters = (respostaText.match(/[A-Z]/gi) || []).map(s => s.toUpperCase());
  if (correctLetters.length === 0) throw new Error("Não consegui identificar a(s) letra(s) da resposta correta.");
  const options = matches.map((mt, i) => {
    let endIdx = (i < matches.length - 1) ? matches[i + 1].index : (respostaIdx > mt.index ? respostaIdx : text.length);
    let label = text.substring(mt.textStart, endIdx).trim().replace(/\s*\n\s*/g, ' ').trim();
    return { id: mt.letter.toLowerCase(), label: label };
  });
  const optionLetters = new Set(options.map(o => o.id.toUpperCase()));
  for (const letter of correctLetters) {
    if (!optionLetters.has(letter)) throw new Error("A resposta correta '" + letter + "' não corresponde a nenhuma alternativa.");
  }
  const isMulti = correctLetters.length > 1;
  // Captura "Comentário:" / "Comentários:" (após o gabarito) como explicação automática
  const comentMatch = text.match(/(?:Coment[áa]rios?)\s*:\s*([\s\S]+)$/i);
  const explanation = comentMatch ? comentMatch[1].trim() : '';
  return {
    statement: statement, hint: hint || undefined,
    type: isMulti ? 'multi' : 'single', options: options,
    correct: isMulti ? correctLetters.map(l => l.toLowerCase()) : correctLetters[0].toLowerCase(),
    explanation: explanation || undefined
  };
}

function splitIntoQuestions(rawText) {
  // Estratégia: divide no padrão "Questão N" ou em blocos separados por linha(s) em branco
  // antes de uma linha que começa com alternativa (A) / a) etc.
  const text = rawText.replace(/\r\n/g, '\n').trim();

  // Tenta primeiro dividir por marcadores numéricos explícitos
  // Aceita: "Questão 1", "QUESTÃO 1", "Q1", "1.", "1)" no início de linha
  const numberedRe = /(?:^|\n)(?:Quest[ãa]o\s*\d+|Q\s*\d+|\d+[.)]\s)(?=\s*\S)/gi;
  const splits = [];
  let match;
  const positions = [];
  let re2 = new RegExp(numberedRe.source, 'gi');
  while ((match = re2.exec(text)) !== null) {
    positions.push(match.index === 0 ? 0 : match.index + 1);
  }

  if (positions.length >= 2) {
    for (let i = 0; i < positions.length; i++) {
      const start = positions[i];
      const end = i + 1 < positions.length ? positions[i + 1] : text.length;
      const chunk = text.slice(start, end).trim();
      if (chunk) splits.push(chunk);
    }
    return splits;
  }

  // Fallback: divide por 2+ linhas em branco
  const byBlankLines = text.split(/\n{2,}/);
  if (byBlankLines.length >= 2) {
    // Agrupa blocos: junta linhas que não têm gabarito com o próximo bloco
    const groups = [];
    let current = '';
    for (const block of byBlankLines) {
      current = current ? current + '\n\n' + block : block;
      // Considera bloco completo se tem gabarito
      if (/(?:Respostas?|Gabarito)\s*:/i.test(current)) {
        groups.push(current.trim());
        current = '';
      }
    }
    if (current.trim()) groups.push(current.trim());
    if (groups.length >= 1) return groups;
  }

  // Último recurso: trata como uma questão só
  return [text];
}

          row.style.cssText = 'padding:5px 0;border-bottom:1px solid var(--border)';
          if (r.data.type === 'info') {
            row.innerHTML = '<strong>' + (i+1) + '.</strong> ' + escapeHtml(r.data.statement.substring(0,90)) + (r.data.statement.length>90?'…':'') +
              ' <span style="color:var(--text-secondary)">(cartão de leitura, sem gabarito)</span>';
            prevList.appendChild(row);
            return;
          }
          const correctLabel = r.data.type === 'code_lines'
            ? r.data.lines.map(l => l.correct.toUpperCase()).join(',')
            : (typeof r.data.correct === 'object' && !Array.isArray(r.data.correct)
                ? Object.entries(r.data.correct).map(([k,v])=>k+'→'+v).join(', ')
                : (Array.isArray(r.data.correct) ? r.data.correct.map(l=>l.toUpperCase()).join(',') : r.data.correct.toUpperCase()));
          const countLabel = r.data.type === 'columns'
            ? (r.data.dragItems.length + ' itens, ' + r.data.columns.length + ' colunas')
            : (r.data.type === 'code_lines'
                ? (r.data.lines.length + ' linhas')
                : (r.data.options.length + ' alt.'));
          row.innerHTML = '<strong>' + (i+1) + '.</strong> ' + escapeHtml(r.data.statement.substring(0,90)) + (r.data.statement.length>90?'…':'') +
            ' <span style="color:var(--text-secondary)">(' + countLabel + ', gabarito: ' + correctLabel + ')</span>';
          prevList.appendChild(row);
        });
        body.appendChild(prevList);
      }
    }
  }

  // Footer
  const footer = document.createElement('div');
  footer.className = 'modal-footer';

  const btnCancel = document.createElement('button');
  btnCancel.className = 'modal-btn';
  btnCancel.textContent = 'Cancelar';
  btnCancel.onclick = closeModal;
  footer.appendChild(btnCancel);

  const btnAnalyze = document.createElement('button');
  btnAnalyze.className = 'modal-btn';
  btnAnalyze.textContent = _bulkMode === 'json' ? '🔍 Validar JSON' : '🔍 Analisar';
  btnAnalyze.onclick = analyzeBulk;
  footer.appendChild(btnAnalyze);

  const btnSave = document.createElement('button');
  btnSave.className = 'modal-btn primary';
  btnSave.textContent = '✓ Salvar todas (' + saveCount + ')';
  btnSave.disabled = saveCount === 0;
  btnSave.onclick = saveBulk;
  footer.appendChild(btnSave);

  modal.appendChild(footer);

  // Injeta no modal-root diretamente
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  root.appendChild(overlay);
  modalState = '__bulk__'; // marca que há modal aberto
}

function analyzeBulk() {
  // Lê sempre direto do DOM — não confia em _bulkText sincronizado pelo oninput
  const ta = document.getElementById('bulk-area');
  const bl = document.getElementById('bulk-block');
  const rawVal = ta ? ta.value : '';
  if (bl) _bulkBlock = bl.value;
  // Se o DOM não tem nada mas _bulkText tem, usa _bulkText (fallback)
  _bulkText = rawVal || _bulkText;
  if (!_bulkText.trim()) { alert('Cole o conteúdo no campo de texto antes de analisar.'); return; }

  if (_bulkMode === 'json') {
    // ── JSON mode ────────────────────────────────────────────────────────
    let rawText = _bulkText.trim();
    // Detecta arrays duplicados concatenados (ex: "][") e usa apenas o primeiro
    const dupMatch = rawText.match(/\]\s*\[/);
    let dupWarning = '';
    if (dupMatch) {
      rawText = rawText.slice(0, rawText.indexOf(dupMatch[0]) + 1);
      dupWarning = 'Detectamos o JSON colado em duplicata — apenas o primeiro bloco foi processado. Cole somente um array por vez.';
    }
    let parsed;
    try { parsed = JSON.parse(rawText); }
    catch (e) { _bulkParsed = [{ ok: false, error: 'JSON inválido: ' + e.message }]; renderBulkImportModal(); return; }
    // Detecta formato "Análise Sintática": { meta, classificacoes, questoes }
    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && parsed.questoes && parsed.classificacoes) {
      const classificacoes = parsed.classificacoes;
      const clabels = {};
      const ccolors = {};
      for (const [k, v] of Object.entries(classificacoes)) {
        clabels[k] = v.label || k;
        ccolors[k] = { color: v.color || '', bg: v.bg || '', border: v.border || '' };
      }
      const defaultBlock = (parsed.meta && parsed.meta.title) ? parsed.meta.title : 'Análise Sintática';
      const allCvs = Object.keys(classificacoes);
      parsed = parsed.questoes.map(function(q) {
        // Cada TOKEN individual vira um chip — palavras do mesmo grupo têm a mesma classificação
        var options = [];
        var correct = {};
        var expParts = [];
        for (var gi = 0; gi < q.grupos.length; gi++) {
          var g = q.grupos[gi];
          for (var ti = 0; ti < g.tokens.length; ti++) {
            var wid = g.id + 't' + ti;
            options.push({ id: wid, label: g.tokens[ti] });
            correct[wid] = g.classificacao;
          }
          expParts.push('"' + g.tokens.join(' ') + '" → ' + (clabels[g.classificacao] || g.classificacao) + ':\n' + (g.explicacao || ''));
        }
        const cvs = (q.termos_cobertos && q.termos_cobertos.length) ? q.termos_cobertos : allCvs;
        const res = {
          statement: 'Classifique os termos da oração:\n"' + q.frase + '"',
          type: 'syntax',
          block: defaultBlock,
          options: options,
          correct: correct,
          explanation: expParts.join('\n\n'),
          classify_values: cvs,
          classify_labels: clabels,
          classify_colors: ccolors
        };
        if (q.dica) res.hint = q.dica;
        return res;
      });
    }
    if (!Array.isArray(parsed)) { _bulkParsed = [{ ok: false, error: 'O JSON deve ser um array de questões, ou um objeto no formato Análise Sintática {meta, classificacoes, questoes}.' }]; renderBulkImportModal(); return; }
    if (dupWarning) _bulkParsed = [{ ok: false, error: dupWarning }];
    else _bulkParsed = [];
    const itemResults = parsed.map((item, i) => {
      const _result = (() => {
      try {
        if (!item.statement || typeof item.statement !== 'string') throw new Error('"statement" ausente ou inválido.');

        // Tipo "info" (cartão de leitura, sem gabarito): só precisa de "statement".
        // Não tem options/correct — é só um resumo/texto para ler antes de avançar.
        if (item.type === 'info') {
          return { ok: true, idx: i, data: {
            statement: item.statement,
            hint: item.hint || undefined,
            type: 'info',
            block: item.block || undefined
          } };
        }

        // Tipo "code_lines" (montar código linha a linha): não usa "options" no nível raiz — usa "lines"
        if (item.type === 'code_lines') {
          if (!Array.isArray(item.lines) || item.lines.length < 2) throw new Error('Para tipo "code_lines", "lines" deve ser um array com pelo menos 2 linhas.');
          const linesSaved = [];
          for (const [li, line] of item.lines.entries()) {
            if (!line.id || typeof line.id !== 'string') throw new Error('A linha de índice ' + li + ' precisa ter um "id" (string).');
            if (!Array.isArray(line.options) || line.options.length < 2) throw new Error('A linha "' + line.id + '" precisa ter "options" com pelo menos 2 alternativas.');
            for (const opt of line.options) {
              if (!opt.id || !opt.label) throw new Error('Cada opção da linha "' + line.id + '" precisa ter "id" e "label".');
            }
            if (!line.correct || typeof line.correct !== 'string') throw new Error('A linha "' + line.id + '" precisa ter "correct" (id da opção certa).');
            const optIdsLine = line.options.map(o => String(o.id).toLowerCase());
            if (!optIdsLine.includes(String(line.correct).toLowerCase())) throw new Error('"correct" da linha "' + line.id + '" referencia uma opção que não existe nela.');
            linesSaved.push({
              id: String(line.id).toLowerCase(),
              options: line.options.map(o => ({ id: String(o.id).toLowerCase(), label: String(o.label) })),
              correct: String(line.correct).toLowerCase()
            });
          }
          return { ok: true, idx: i, data: {
            statement: item.statement,
            hint: item.hint || undefined,
            confusion_note: item.confusion_note || undefined,
            type: 'code_lines',
            block: item.block || undefined,
            lines: linesSaved,
            explanation: item.explanation || undefined
          } };
        }

        // Tipo "columns" (colunas fixas, múltiplos itens por coluna): não usa "options" — usa "columns" + "dragItems"
        if (item.type === 'columns') {
          if (!Array.isArray(item.columns) || item.columns.length < 2) throw new Error('Para tipo "columns", "columns" deve ser um array com pelo menos 2 itens ({id,label}).');
          for (const col of item.columns) {
            if (!col.id || !col.label) throw new Error('Cada item de "columns" precisa ter "id" e "label".');
            if (col.svg !== undefined && (typeof col.svg !== 'string' || !col.svg.trim().startsWith('<svg'))) {
              throw new Error('O campo "svg" da coluna "' + col.id + '" precisa ser uma string começando com "<svg".');
            }
          }
          if (!Array.isArray(item.dragItems) || item.dragItems.length < 2) throw new Error('Para tipo "columns", "dragItems" deve ser um array com pelo menos 2 itens ({id,label}).');
          for (const di of item.dragItems) {
            if (!di.id || !di.label) throw new Error('Cada item de "dragItems" precisa ter "id" e "label".');
            if (di.svg !== undefined && (typeof di.svg !== 'string' || !di.svg.trim().startsWith('<svg'))) {
              throw new Error('O campo "svg" do item "' + di.id + '" precisa ser uma string começando com "<svg".');
            }
          }
          if (item.correct === undefined || item.correct === null) throw new Error('"correct" ausente.');
          if (typeof item.correct !== 'object' || Array.isArray(item.correct)) throw new Error('Para tipo "columns", "correct" deve ser um objeto {idDoItem: idDaColuna}.');
          const colIdsC = item.columns.map(c => String(c.id).toLowerCase());
          const dragIdsC = item.dragItems.map(d => String(d.id).toLowerCase());
          for (const [did, colId] of Object.entries(item.correct)) {
            if (!dragIdsC.includes(String(did).toLowerCase())) throw new Error('"correct" referencia item "' + did + '" que não existe em "dragItems".');
            if (colId !== null && !colIdsC.includes(String(colId).toLowerCase())) throw new Error('"correct" referencia coluna "' + colId + '" que não existe em "columns".');
          }
          // Nem todo dragItem precisa aparecer em "correct": um item OMITIDO (ou com valor null)
          // é tratado como distrator — sua resposta certa é permanecer fora de qualquer coluna (no estoque).
          if (!item.dragItems.some(function(di) {
            const key = Object.keys(item.correct).find(function(k) { return String(k).toLowerCase() === String(di.id).toLowerCase(); });
            return key !== undefined && item.correct[key] !== null;
          })) {
            throw new Error('Nenhum item de "dragItems" possui coluna correta definida em "correct" — pelo menos um item precisa ter destino real (os demais podem ser distratores, com valor null ou omitidos).');
          }
          return { ok: true, idx: i, data: {
            statement: item.statement,
            hint: item.hint || undefined,
            confusion_note: item.confusion_note || undefined,
            type: 'columns',
            block: item.block || undefined,
            columns: item.columns.map(c => ({ id: String(c.id).toLowerCase(), label: String(c.label), svg: c.svg || undefined })),
            dragItems: item.dragItems.map(d => ({ id: String(d.id).toLowerCase(), label: String(d.label), svg: d.svg || undefined })),
            correct: Object.fromEntries(Object.entries(item.correct).map(([k,v]) => [String(k).toLowerCase(), v === null ? null : String(v).toLowerCase()])),
            tableLayout: item.tableLayout || undefined,
            explanation: item.explanation || undefined
          } };
        }

        if (!Array.isArray(item.options) || item.options.length < 2) throw new Error('"options" deve ser um array com pelo menos 2 itens.');
        for (const opt of item.options) {
          if (!opt.id || !opt.label) throw new Error('Cada opção precisa ter "id" e "label".');
        }
        if (item.correct === undefined || item.correct === null) throw new Error('"correct" ausente.');

        // Tipo "match" (arrastar e soltar): options = definições (alvos), dragItems = termos arrastáveis
        if (item.type === 'match') {
          if (!Array.isArray(item.dragItems) || item.dragItems.length < 2) throw new Error('Para tipo "match", "dragItems" deve ser um array com pelo menos 2 itens ({id,label}).');
          for (const di of item.dragItems) {
            if (!di.id || !di.label) throw new Error('Cada item de "dragItems" precisa ter "id" e "label".');
          }
          if (typeof item.correct !== 'object' || Array.isArray(item.correct)) throw new Error('Para tipo "match", "correct" deve ser um objeto {idDaDefinicao: idDoTermo}.');
          const optIdsM = item.options.map(o => String(o.id).toLowerCase());
          const dragIdsM = item.dragItems.map(d => String(d.id).toLowerCase());
          for (const [cid, val] of Object.entries(item.correct)) {
            if (!optIdsM.includes(String(cid).toLowerCase())) throw new Error('"correct" referencia id "' + cid + '" que não existe em "options".');
            if (!dragIdsM.includes(String(val).toLowerCase())) throw new Error('"correct" referencia termo "' + val + '" que não existe em "dragItems".');
          }
          return { ok: true, idx: i, data: {
            statement: item.statement,
            hint: item.hint || undefined,
            confusion_note: item.confusion_note || undefined,
            type: 'match',
            options: item.options.map(o => {
              const obj = { id: String(o.id).toLowerCase(), label: String(o.label) };
              if (typeof o.svg === 'string' && o.svg.trim().startsWith('<svg')) obj.svg = o.svg;
              return obj;
            }),
            dragItems: item.dragItems.map(d => {
              const obj = { id: String(d.id).toLowerCase(), label: String(d.label) };
              if (typeof d.svg === 'string' && d.svg.trim().startsWith('<svg')) obj.svg = d.svg;
              return obj;
            }),
            correct: Object.fromEntries(Object.entries(item.correct).map(([k,v]) => [String(k).toLowerCase(), String(v).toLowerCase()])),
            explanation: item.explanation || undefined,
            block: item.block || undefined
          } };
        }

        // Detecta tipo
        const isClassify = item.type === 'classify' || (typeof item.correct === 'object' && !Array.isArray(item.correct));
        const isMulti = !isClassify && Array.isArray(item.correct) && item.correct.length > 1;
        const type = item.type || (isClassify ? 'classify' : isMulti ? 'multi' : 'single');

        const optIds = item.options.map(o => String(o.id).toLowerCase());

        if (isClassify) {
          // correct deve ser objeto {id: valor, ...}
          if (typeof item.correct !== 'object' || Array.isArray(item.correct)) throw new Error('Para tipo "classify", "correct" deve ser um objeto {id: valor}.');
          for (const cid of Object.keys(item.correct)) {
            if (!optIds.includes(String(cid).toLowerCase())) throw new Error('"correct" referencia id "' + cid + '" que não existe em "options".');
          }
          const classifyData = {
            statement: item.statement,
            hint: item.hint || undefined,
            confusion_note: item.confusion_note || undefined,
            type: item.type === 'syntax' ? 'syntax' : 'classify',
            options: item.options.map(o => ({ id: String(o.id).toLowerCase(), label: String(o.label), inciso: o.inciso || undefined })),
            correct: Object.fromEntries(Object.entries(item.correct).map(([k,v]) => [k.toLowerCase(), v])),
            explanation: item.explanation || undefined,
            block: item.block || undefined
          };
          if (item.classify_values) classifyData.classify_values = item.classify_values;
          if (item.classify_labels) classifyData.classify_labels = item.classify_labels;
          if (item.classify_colors) classifyData.classify_colors = item.classify_colors;
          return { ok: true, idx: i, data: classifyData };
        } else {
          const correctArr = Array.isArray(item.correct) ? item.correct : [item.correct];
          for (const c of correctArr) {
            if (!optIds.includes(String(c).toLowerCase())) throw new Error('"correct" contém id "' + c + '" que não existe em "options".');
          }
          return { ok: true, idx: i, data: {
            statement: item.statement,
            hint: item.hint || undefined,
            confusion_note: item.confusion_note || undefined,
            type: type,
            options: item.options.map(o => ({ id: String(o.id).toLowerCase(), label: String(o.label) })),
            correct: isMulti ? item.correct.map(c => String(c).toLowerCase()) : String(item.correct).toLowerCase(),
            explanation: item.explanation || undefined,
            block: item.block || undefined
          }};
        }
      } catch(e) { return { ok: false, idx: i, error: 'Item ' + (i+1) + ': ' + e.message }; }
      })();
      // Suporte a SVG no enunciado: diagrama vetorial exibido acima do texto da questão.
      // Aceito em QUALQUER tipo de questão (single, multi, match, columns, info, etc.).
      if (_result && _result.ok && typeof item.svg === 'string' && item.svg.trim().startsWith('<svg')) {
        _result.data.svg = item.svg;
      }
      return _result;
    });
    _bulkParsed = [..._bulkParsed, ...itemResults];
  } else {
    // ── Text mode ────────────────────────────────────────────────────────
    const chunks = splitIntoQuestions(_bulkText);
    _bulkParsed = chunks.map((chunk, i) => {
      try { return { ok: true, idx: i, data: parseQuestionText(chunk) }; }
      catch (e) { return { ok: false, idx: i, error: e.message, chunk: chunk }; }
    });
  }
  renderBulkImportModal();
}

function saveBulk() {
  const ta = document.getElementById('bulk-area');
  const bl = document.getElementById('bulk-block');
  if (ta) _bulkText = ta.value;
  if (bl) _bulkBlock = bl.value;
  if (!_bulkParsed) return;
  const ok = _bulkParsed.filter(r => r.ok);
  if (ok.length === 0) return;
  const defaultBlock = _bulkBlock.trim() || 'Importada';
  const customs = loadCustomQuestions();
  let added = 0;
  for (const r of ok) {
    const newQ = {
      id: 'custom_' + (Date.now() + added),
      block: r.data.block || defaultBlock,
      type: r.data.type, statement: r.data.statement,
      options: r.data.options, correct: r.data.correct,
      explanation: r.data.explanation || 'Questão importada em lote.'
    };
    if (r.data.hint) newQ.hint = r.data.hint;
    if (r.data.confusion_note) newQ.confusion_note = r.data.confusion_note;
    if (r.data.classify_values) newQ.classify_values = r.data.classify_values;
    if (r.data.classify_labels) newQ.classify_labels = r.data.classify_labels;
    if (r.data.classify_colors) newQ.classify_colors = r.data.classify_colors;
    if (r.data.dragItems) newQ.dragItems = r.data.dragItems;
    if (r.data.columns) newQ.columns = r.data.columns;
    if (r.data.lines) newQ.lines = r.data.lines;
    if (r.data.tableLayout) newQ.tableLayout = r.data.tableLayout;
    if (r.data.svg) newQ.svg = r.data.svg;
    customs.push(newQ);
    QUESTIONS.push(newQ);
    added++;
  }
  saveCustomQuestions(customs);
  _bulkText = ''; _bulkBlock = ''; _bulkParsed = null; _bulkMode = 'text';
  modalState = null; renderModal();
  updateActiveCounter();
  alert('✓ ' + added + ' questão(ões) importada(s) com sucesso!\nTotal de questões ativas: ' + (QUESTIONS.length - excludedIds.size));
}

  pasteInput = ''; pasteBlock = ''; pasteExplanation = ''; lastParseResult = null;
  renderAddQuestionModal();
}

  let resultHtml = '';
  if (lastParseResult) {
    if (lastParseResult.ok) {
      const r = lastParseResult.data;
      const correctDisplay = Array.isArray(r.correct) ? r.correct.map(l => l.toUpperCase()).join(", ") : r.correct.toUpperCase();
      resultHtml = '<div class="parse-result ok">' +
        '<strong>✓ Análise concluída:</strong><br>' +
