<html lang="pt-BR">
<head>

<title>Quiz de Estudos — Concursos v21</title>
<style>
  :root {
    --bg: #ffffff; --bg-secondary: #f5f4ef; --bg-tertiary: #ebeae3;
    --text: #1f1f1d; --text-secondary: #6b6b66;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.25);
    --success-bg: #e6f4ea; --success-text: #1d6e3e; --success-border: #34a853;
    --danger-bg: #fce8e6; --danger-text: #a52714; --danger-border: #d93025;
    --warn-bg: #fef7e0; --warn-text: #b06000; --warn-border: #f29900;
    --info: #1a73e8; --info-bg: #e8f0fe; --info-text: #174ea6;
    --overlay: rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1d; --bg-secondary: #2c2c2a; --bg-tertiary: #3a3a37;
      --text: #f0efe8; --text-secondary: #b0b0a8;
      --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.25);
      --success-bg: #1e3a25; --success-text: #81c995; --success-border: #34a853;
      --danger-bg: #3a1c1a; --danger-text: #f28b82; --danger-border: #d93025;
      --warn-bg: #3a2e15; --warn-text: #fdd663; --warn-border: #f29900;
      --info-bg: #1e2e4a; --info-text: #8ab4f8; --overlay: rgba(0,0,0,0.7);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
  .container { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  .breadcrumb { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .breadcrumb a { color: var(--info); cursor: pointer; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { opacity: 0.5; }
  .nav-header { text-align: center; margin-bottom: 28px; padding-top: 8px; }
  .nav-title { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .nav-subtitle { font-size: 14px; color: var(--text-secondary); margin: 0; }
  .item-list { display: flex; flex-direction: column; gap: 12px; }
  .nav-item { background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; cursor: pointer; transition: all 0.16s;
    display: flex; align-items: center; gap: 16px; text-align: left; width: 100%;
    font-family: inherit; color: var(--text); }
  .nav-item:hover { background: var(--bg-tertiary); border-color: var(--info); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.07); }
  .nav-item-icon { flex-shrink: 0; width: 46px; height: 46px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .nav-item-icon.folder { background: var(--warn-bg); }
  .nav-item-icon.quiz { background: var(--info-bg); color: var(--info-text); font-size: 20px; }
  .nav-item-info { flex: 1; min-width: 0; }
  .nav-item-name { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .nav-item-desc { font-size: 13px; color: var(--text-secondary); margin: 0 0 5px; }
  .nav-item-stats { font-size: 12px; color: var(--text-secondary); display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-item-stat { background: var(--bg-tertiary); padding: 2px 8px; border-radius: 4px; }
  .nav-item-actions { flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
  .rename-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; padding: 6px;
    border-radius: 6px; color: var(--text-secondary); transition: all 0.15s; line-height: 1; }
  .rename-btn:hover { background: var(--bg); color: var(--info); }
  .nav-item-arrow { flex-shrink: 0; font-size: 20px; color: var(--text-secondary); }
  .drag-handle { flex-shrink: 0; width: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--border-strong); cursor: grab; font-size: 16px; border-radius: 4px; padding: 4px 2px;
    transition: color 0.15s; touch-action: none; }
  .drag-handle:hover { color: var(--text-secondary); background: var(--bg-tertiary); }
  .drag-handle:active { cursor: grabbing; }
  .nav-item.drag-over-above { border-top: 2.5px solid var(--info) !important; }
  .nav-item.drag-over-below { border-bottom: 2.5px solid var(--info) !important; }
  .nav-item.dragging { opacity: 0.4; }
  .nav-footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border);
    text-align: center; font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
  .nav-create-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .nav-create-btn { flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 10px; border: 1.5px dashed var(--border-strong);
    background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.16s; }
  .nav-create-btn:hover { background: var(--bg-secondary); color: var(--text); border-color: var(--info); }
  .nav-item-custom { border-left: 3px solid var(--success-border); }
  .parse-result { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .parse-result.ok { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .parse-result.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
  /* QUIZ */
  .header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .header-text { flex: 1; min-width: 240px; }
  .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px;
    color: var(--info); cursor: pointer; margin-bottom: 8px; background: none; border: none;
    font-family: inherit; padding: 0; }
  .back-link:hover { text-decoration: underline; }
  .title { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .header-btn { padding: 8px 14px; background: var(--bg-secondary); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .header-btn:hover:not(:disabled) { background: var(--bg-tertiary); }
  .header-btn.primary { background: var(--info); color: white; border-color: var(--info); }
  .header-btn.primary:hover:not(:disabled) { opacity: 0.9; }
  .active-counter { font-size: 12px; color: var(--text-secondary); padding: 6px 10px;
    background: var(--bg-secondary); border-radius: 6px; white-space: nowrap; text-align: center; }
  .active-counter strong { color: var(--text); font-size: 14px; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  .progress-bar { height: 4px; background: var(--bg-secondary); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: var(--info); transition: width 0.3s ease; }
  .top-actions { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
  .delete-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .delete-btn:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
  .prompt-tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 4px; background: var(--bg-tertiary); color: var(--text-secondary); margin-bottom: 10px; }
  .block-tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 4px; background: var(--info-bg); color: var(--info-text);
    margin-bottom: 10px; margin-left: 6px; }
  .custom-tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 8px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-text);
    margin-bottom: 10px; margin-left: 6px; }
  .topic { font-size: 16px; font-weight: 500; padding: 22px 26px; background: var(--info-bg);
    color: var(--info-text); border-radius: 12px; margin-bottom: 20px; line-height: 1.9;
    white-space: pre-line; letter-spacing: 0.1px; }
  .topic em { font-style: normal; opacity: 0.75; font-size: 14px; display: block; margin-top: 6px; }
  .info-card { background: var(--bg-secondary); border: 1px solid var(--border);
    border-left: 4px solid var(--info-text); border-radius: 12px; padding: 26px 30px 24px;
    margin-bottom: 20px; }
  .info-card-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .info-card-icon { font-size: 20px; line-height: 1; }
  .info-card-label { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    font-weight: 700; color: var(--info-text); background: var(--info-bg); padding: 4px 11px; border-radius: 20px; }
  .info-card-title { font-size: 19px; font-weight: 700; color: var(--text); margin: 0 0 14px 0; letter-spacing: 0.1px; }
  .info-card-body p { font-size: 15.5px; line-height: 1.85; color: var(--text); margin: 0 0 16px 0; letter-spacing: 0.1px; }
  .info-card-body p:last-child { margin-bottom: 0; }
  .info-card-tip { margin-top: 18px; padding: 12px 16px; background: var(--info-bg); color: var(--info-text);
    border-radius: 8px; font-size: 13.5px; line-height: 1.6; }
  .statement-svg { margin-bottom: 18px; text-align: center; background: var(--bg-secondary);
    border-radius: 12px; padding: 16px; overflow-x: auto; }
  .statement-svg svg { max-width: 100%; height: auto; display: inline-block; }
  .info-card-body-scroll { max-height: 380px; overflow-y: auto; padding-right: 8px; }
  .info-confirm-row { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .info-read-badge { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
    text-align: center; font-size: 13.5px; color: var(--info-text); font-weight: 600; }
  .confusion-note { flex: 0 1 auto; min-width: 0; }
  .confusion-note summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--warn-text);
    user-select: none; list-style: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--warn-border);
    background: var(--warn-bg); white-space: nowrap; transition: filter 0.15s; }
  .confusion-note summary::-webkit-details-marker { display: none; }
  .confusion-note summary:hover { filter: brightness(0.95); }
  .confusion-note[open] summary { border-radius: 12px 12px 0 0; }
  .confusion-note-body { margin-top: -1px; padding: 14px 16px; background: var(--warn-bg);
    color: var(--warn-text); border-radius: 0 12px 12px 12px; font-size: 13.5px; line-height: 1.7;
    border: 1px solid var(--warn-border); max-width: 520px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .option { padding: 14px 18px; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 8px; text-align: left; cursor: pointer; font-size: 15px; color: var(--text);
    font-family: inherit; transition: all 0.15s; width: 100%; display: flex; align-items: flex-start;
    gap: 10px; line-height: 1.5; }
  .option:hover:not(:disabled) { background: var(--bg-tertiary); border-color: var(--border-strong); }
  .option:disabled { cursor: default; }
  .option.selected { background: var(--info-bg); border-color: var(--info); color: var(--info-text); }
  .option.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); font-weight: 500; }
  .option.incorrect { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); font-weight: 500; }
  .option.missed { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); font-weight: 500; }
  .option.dim { opacity: 0.5; }
  .opt-letter { font-weight: 600; flex-shrink: 0; min-width: 28px; }
  .opt-label { flex: 1; white-space: pre-wrap; }
  .opt-label.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; }
  .feedback { padding: 16px 18px; background: var(--bg-secondary); border-radius: 8px;
    font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .feedback-header { font-weight: 500; margin-bottom: 6px; }
  .feedback-header.ok { color: var(--success-text); }
  .feedback-header.bad { color: var(--danger-text); }
  .legend { font-size: 12px; color: var(--text-secondary); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .legend-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-swatch.green { background: var(--success-border); }
  .legend-swatch.red { background: var(--danger-border); }
  .legend-swatch.yellow { background: var(--warn-border); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .nav-btn { padding: 12px 20px; background: var(--text); color: var(--bg); border: none;
    border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .nav-btn:hover:not(:disabled) { opacity: 0.85; }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav-btn.secondary { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border); }
  .confirm-row { display: flex; justify-content: center; margin-bottom: 16px; }
  .confirm-btn { padding: 12px 28px; background: var(--info); color: white; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .confirm-btn:hover:not(:disabled) { opacity: 0.9; }
  .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 20px; }
  .kbd { display: inline-block; padding: 2px 6px; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 4px; font-family: monospace; font-size: 11px; }
  .end-screen { text-align: center; padding: 32px 16px; }
  .end-label { font-size: 12px; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; }
  .end-score { font-size: 56px; font-weight: 500; margin: 12px 0 4px; }
  .end-pct { font-size: 18px; color: var(--text-secondary); margin-bottom: 16px; }
  .end-msg { font-size: 15px; margin-bottom: 28px; line-height: 1.6; max-width: 480px; margin-left: auto; margin-right: auto; }
  .end-buttons { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto; }
  .end-btn { padding: 14px 24px; background: var(--info); color: white; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .end-btn:hover:not(:disabled) { opacity: 0.9; }
  .end-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .end-btn.secondary { background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border-strong); }
  .end-btn.warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
  .modal-overlay { position: fixed; inset: 0; background: var(--overlay); display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal { background: var(--bg); border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh;
    overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .modal-large { max-width: 720px; }
  .modal-header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 18px; font-weight: 500; margin: 0; }
  .modal-subtitle { font-size: 13px; color: var(--text-secondary); margin: 4px 0 0; }
  .modal-body { padding: 16px 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 24px 20px; border-top: 1px solid var(--border); display: flex;
    justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .modal-btn { padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text); transition: opacity 0.15s; }
  .modal-btn:hover:not(:disabled) { opacity: 0.85; }
  .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-btn.primary { background: var(--info); color: white; border-color: var(--info); }
  .modal-btn.danger { background: var(--danger-border); color: white; border-color: var(--danger-border); }
  .confirm-text { font-size: 15px; line-height: 1.5; margin: 0; }
  .deleted-item { padding: 12px 14px; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px;
    cursor: pointer; transition: background 0.15s; }
  .deleted-item:hover { background: var(--bg-tertiary); }
  .deleted-item.checked { background: var(--info-bg); border-color: var(--info); }
  .deleted-item-check { flex-shrink: 0; width: 18px; height: 18px; border: 1px solid var(--border-strong);
    border-radius: 4px; margin-top: 2px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; background: var(--bg); }
  .deleted-item.checked .deleted-item-check { background: var(--info); border-color: var(--info); color: white; }
  .deleted-item-body { flex: 1; min-width: 0; }
  .deleted-item-block { font-size: 11px; color: var(--info-text); background: var(--info-bg);
    padding: 2px 6px; border-radius: 3px; display: inline-block; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.3px; }
  .deleted-item-text { font-size: 14px; line-height: 1.4; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 14px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  .form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
    transition: border-color 0.15s; }
  .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--info); }
  .form-textarea { resize: vertical; min-height: 60px; font-family: monospace; line-height: 1.5; }
  .form-textarea.large { min-height: 240px; }
  .form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
  .parse-result { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .parse-result.ok { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .parse-result.error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
  .parse-result strong { font-weight: 600; }
  .example-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-family: monospace; font-size: 12px; line-height: 1.6; margin-top: 8px;
    color: var(--text-secondary); white-space: pre-wrap; }
  .classify-row { display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px; padding:12px 14px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
  .classify-row.cr-ok { background:var(--success-bg); border-color:var(--success-border); }
  .classify-row.cr-err { background:var(--danger-bg); border-color:var(--danger-border); }
  .cr-letter { font-weight:600; flex-shrink:0; min-width:26px; font-size:15px; color:var(--text); }
  .cr-text { flex:1 1 100%; min-width:0; font-size:14px; line-height:1.5; color:var(--text); }
  .cr-inciso { display:inline-block; font-size:11px; color:var(--text-secondary); margin-top:3px; margin-left:6px; }
  .cr-btns { display:flex; gap:6px; flex:1 1 100%; flex-wrap:wrap; justify-content:flex-start; margin-left:26px; width:calc(100% - 26px); }
  .cr-btn { padding:5px 10px; border:1px solid var(--border-strong); border-radius:5px; font-size:11px; font-weight:600; cursor:pointer; background:var(--bg); color:var(--text-secondary); font-family:inherit; transition:all .12s; white-space:nowrap; }
  .cr-btn:disabled { cursor:default; }

   Motivo: o localStorage do iPhone tem limite pequeno; o IndexedDB comporta bem mais.

(function () {

      if (!window.indexedDB) { rej(new Error('sem indexedDB')); return; }

      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };

      var out = {}, req = d.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
      req.onsuccess = function () { var c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = function () { rej(req.error); };

  function del(k) { if (!db) return; try { db.transaction(STORE, 'readwrite').objectStore(STORE).delete(k); } catch (e) {} }
  function clearAll() { if (!db) return; try { db.transaction(STORE, 'readwrite').objectStore(STORE).clear(); } catch (e) {} }

  var shim = {
    __isIdbShim: true,
    getItem: function (k) { k = String(k); return (k in mem) ? mem[k] : null; },
    setItem: function (k, v) { k = String(k); v = String(v); mem[k] = v; keysCache = null; put(k, v); },
    removeItem: function (k) { k = String(k); if (k in mem) { delete mem[k]; keysCache = null; del(k); } },

blico. Diferença clássica em relação à SEM, onde o capital é misto."}, {"id": "q5", "block": "Definições de EP", "type": "single", "statement": "No capital da empresa pública, é admitida a participação de outras pessoas jurídicas de direito público interno e de entidades da administração indireta, desde que...", "options": [{"id": "a", "label": "a participação de terceiros não ultrapasse 25% do capital total"}, {"id": "b", "label": "haja autorização expressa do Congresso Nacional"}, {"id": "c", "label": "a maioria do capital votante permaneça em propriedade do ente público"}, {"id": "d", "label": "o objeto social do participante seja idêntico ao da empresa pública"}, {"id": "e", "label": "a participação seja aprovada pelo Conselho de Administração"}, {"id": "f", "label": "o valor da participação não supere 49% do capital social"}], "correct": "c", "explanation": "Art. 3º, parágrafo único — a maioria do capital VOTANTE deve permanecer com o ente público controlador (União, Estado, DF ou Município)."}, {"id": "q6", "block": "Definições de SEM", "type": "single", "statement": "Sociedade de economia mista é a entidade dotada de personalidade jurídica de direito privado, com criação autorizada por lei, sob a forma de sociedade anônima, cujas ações com direito a voto pertencem em sua maioria...", "options": [{"id": "a", "label": "à União, exclusivamente"}, {"id": "b", "label": "à União, aos Estados, ao DF, aos Municípios ou a entidade da administração indireta"}, {"id": "c", "label": "ao ente federativo que autorizou sua criação, vedada a participação de outros entes"}, {"id": "d", "label": "à União e aos Estados, em conjunto, vedada a participação municipal"}, {"id": "e", "label": "ao Poder Executivo federal, mediante delegação ao Ministério supervisor"}, {"id": "f", "label": "à União, aos Estados e ao DF, excluídos os Municípios"}], "correct": "b", "explanation": "Art. 4º — SEM: maioria das ações VOTANTES com qualquer ente federativo OU entidade da administração indireta."}, {"id": "q7", "block": "Autorização Legislativa", "type": "multi", "statement": "A constituição de empresa pública ou de sociedade de economia mista dependerá de prévia autorização legal que indique, de forma clara...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "relevante interesse coletivo"}, {"id": "b", "label": "conveniência e oportunidade administrativa"}, {"id": "c", "label": "imperativo de segurança nacional"}, {"id": "d", "label": "necessidade de complementação da iniciativa privada"}, {"id": "e", "label": "déficit de mercado identificado por estudo técnico"}, {"id": "f", "label": "autorização do Tribunal de Contas competente"}], "correct": ["a", "c"], "explanation": "Art. 2º — autorização legal deve indicar 'relevante interesse coletivo' OU 'imperativo de segurança nacional'. Mesma fórmula do art. 173 da CF."}, {"id": "q8", "block": "Autorização Legislativa", "type": "single", "statement": "Depende de autorização legislativa a criação de subsidiárias de empresa pública e de sociedade de economia mista, assim como a participação de qualquer delas em empresa privada. O objeto social da empresa privada investida deve estar...", "options": [{"id": "a", "label": "aprovado pelo Conselho de Administração da estatal"}, {"id": "b", "label": "relacionado ao da investidora"}, {"id": "c", "label": "previamente autorizado pelo Ministério supervisor"}, {"id": "d", "label": "compatível com as diretrizes do plano de negócios vigente"}, {"id": "e", "label": "idêntico ao objeto social da estatal investidora"}, {"id": "f", "label": "alinhado com as políticas públicas do setor de atuação"}], "correct": "b", "explanation": "Art. 2º, §2º — objeto social relacionado (não idêntico) ao da investidora. Permite expansão correlata, mas não permite que a estatal invista em qualquer ramo."}, {"id": "q9", "block": "Forma Societária", "type": "single", "statement": "A sociedade de economia mista será constituída sob a forma de...", "options": [{"id": "a", "label": "sociedade limitada, com capital majoritariamente público"}, {"id": "b", "label": "fundação pública de direito privado"}, {"id": "c", "label": "sociedade anônima"}, {"id": "d", "label": "cooperativa de interesse público"}, {"id": "e", "label": "sociedade em comandita por ações"}, {"id": "f", "label": "associação civil sem fins lucrativos"}], "correct": "c", "explanation": "Art. 4º — SEM = obrigatoriamente Sociedade Anônima (S.A.). Sujeita-se também à Lei 6.404/76."}, {"id": "q10", "block": "Transparência", "type": "multi", "statement": "O estatuto da empresa pública, da sociedade de economia mista e de suas subsidiárias deverá observar regras de governança corporativa, de transparência e de estruturas, práticas de gestão de riscos e de controle interno. São requisitos mínimos de transparência exigidos pela Lei...", "hint": "Marque as 4 corretas.", "options": [{"id": "a", "label": "elaboração de carta anual subscrita pelos membros do Conselho de Administração"}, {"id": "b", "label": "divulgação tempestiva de informações relevantes, incluindo fatores de risco e dados econômico-financeiros"}, {"id": "c", "label": "aprovação prévia pelo Ministério supervisor de toda decisão de impacto econômico relevante"}, {"id": "d", "label": "elaboração e divulgação de política de transações com partes relacionadas"}, {"id": "e", "label": "divulgação anual de relatório integrado ou de sustentabilidade"}, {"id": "f", "label": "comunicação prévia ao TCU de todo contrato acima de determinado valor"}], "correct": ["a", "b", "d", "e"], "explanation": "Art. 8º — pilares: carta anual + divulgação tempestiva + política de partes relacionadas + relatório integrado/sustentabilidade. Aprovação prévia pelo Ministério e comunicação ao TCU NÃO são requisitos do art. 8º."}, {"id": "q11", "block": "Carta Anual", "type": "single", "statement": "A carta anual de que trata o art. 8º deverá ser subscrita pelos membros do...", "options": [{"id": "a", "label": "Conselho Fiscal"}, {"id": "b", "label": "Comitê de Auditoria Estatutário"}, {"id": "c", "label": "Conselho de Administração"}, {"id": "d", "label": "Ministério supervisor competente"}, {"id": "e", "label": "órgão de controle interno da entidade"}, {"id": "f", "label": "diretoria executiva da estatal"}], "correct": "c", "explanation": "Art. 8º — carta anual subscrita pelo CONSELHO DE ADMINISTRAÇÃO. Documento que materializa a vinculação dos administradores aos compromissos da estatal."}, {"id": "q12", "block": "Transparência", "type": "single", "statement": "A política de transações com partes relacionadas deverá ser aprovada pelo Conselho de Administração e revisada no mínimo...", "options": [{"id": "a", "label": "a cada dois anos"}, {"id": "b", "label": "semestralmente"}, {"id": "c", "label": "trimestralmente"}, {"id": "d", "label": "anualmente"}, {"id": "e", "label": "a cada três anos"}, {"id": "f", "label": "bienalmente, salvo deliberação em contrário"}], "correct": "d", "explanation": "Art. 8º, VII — revisão ANUAL no mínimo. Partes relacionadas é tema sensível: requer revisão frequente para evitar conflitos de interesse."}, {"id": "q13", "block": "Política de Igualdade", "type": "multi", "statement": "A divulgação anual da política de igualdade entre homens e mulheres deverá conter, entre outras informações...", "hint": "Marque as 4 corretas.", "options": [{"id": "a", "label": "a quantidade e a proporção de mulheres empregadas, por níveis hierárquicos"}, {"id": "b", "label": "o cronograma de metas para equidade de gênero nos próximos 5 anos"}, {"id": "c", "label": "a quantidade e a proporção de mulheres que ocupam cargos na administração"}, {"id": "d", "label": "o demonstrativo da remuneração fixa, variável e eventual, segregada por sexo, relativa a cargos ou funções similares"}, {"id": "e", "label": "a evolução comparativa dos indicadores entre o exercício findo e o exercício anterior, especialmente na alta gestão"}, {"id": "f", "label": "o plano de ação afirmativa aprovado pelo Conselho de Administração"}], "correct": ["a", "c", "d", "e"], "explanation": "Art. 8º-A — quatro elementos diagnósticos: (1) proporção por níveis; (2) proporção na administração; (3) remuneração segregada por sexo; (4) evolução comparativa. Cronograma e plano de ação não são exigidos pelo texto."}, {"id": "q14", "block": "Transparência", "type": "single", "statement": "Os documentos resultantes do cumprimento dos requisitos de transparência dos incisos I a IX do art. 8º deverão ser publicamente divulgados na internet de forma...", "options": [{"id": "a", "label": "anual, com acesso restrito a acionistas e órgãos de controle"}, {"id": "b", "label": "permanente e cumulativa"}, {"id": "c", "label": "periódica, conforme regulamento do Poder Executivo"}, {"id": "d", "label": "semestral, com resumo executivo acessível ao público geral"}, {"id": "e", "label": "temporária, pelo prazo mínimo de 5 anos"}, {"id": "f", "label": "imediata apenas para informações que impactem cotação de ações"}], "correct": "b", "explanation": "Art. 8º, §3º — divulgação PERMANENTE e CUMULATIVA. Não há prazo de validade — a informação fica sempre disponível e nova informação se soma à anterior."}, {"id": "q15", "block": "Compliance", "type": "single", "statement": "A área responsável pela verificação de cumprimento de obrigações e de gestão de riscos (compliance) deverá ser vinculada ao...", "options": [{"id": "a", "label": "Conselho de Administração, com reporte direto ao presidente do Conselho"}, {"id": "b", "label": "Conselho Fiscal, como órgão de fiscalização independente"}, {"id": "c", "label": "diretor-presidente e liderada por diretor estatutário"}, {"id": "d", "label": "Comitê de Auditoria Estatutário, com autonomia funcional plena"}, {"id": "e", "label": "Ministério supervisor, como instância de controle externo"}, {"id": "f", "label": "acionista controlador, por meio de representante indicado"}], "correct": "c", "explanation": "Art. 9º, §4º — compliance vinculada ao DIRETOR-PRESIDENTE e liderada por DIRETOR ESTATUTÁRIO. Garante senioridade da função."}, {"id": "q16", "block": "Auditoria Interna", "type": "single", "statement": "A auditoria interna da empresa pública e da sociedade de economia mista deverá ser vinculada ao...", "options": [{"id": "a", "label": "diretor-presidente, com reporte semestral ao Conselho de Administração"}, {"id": "b", "label": "Conselho Fiscal, como órgão de controle independente"}, {"id": "c", "label": "Ministério supervisor, mediante acordo de cooperação"}, {"id": "d", "label": "Conselho de Administração, diretamente ou por meio do Comitê de Auditoria Estatutário"}, {"id": "e", "label": "Comitê de indicação estatutário, para garantia de imparcialidade"}, {"id": "f", "label": "diretoria executiva, com acesso irrestrito ao Conselho de Administração"}], "correct": "d", "explanation": "Art. 9º, §3º — AUDITORIA INTERNA vinculada ao CONSELHO DE ADMINISTRAÇÃO (não à diretoria). Cuidado: compliance vai ao diretor-presidente; auditoria interna vai ao CA. Independências diferentes."}, {"id": "q17", "block": "Código de Conduta", "type": "multi", "statement": "O Código de Conduta e Integridade deverá dispor sobre...", "hint": "Marque as 4 corretas.", "options": [{"id": "a", "label": "princípios, valores e missão da entidade, bem como orientações sobre prevenção de conflito de interesses"}, {"id": "b", "label": "instâncias internas responsáveis pela atualização e aplicação do Código"}, {"id": "c", "label": "fixação dos subsídios e benefícios dos administradores"}, {"id": "d", "label": "canal de denúncias que possibilite o recebimento de denúncias internas e externas"}, {"id": "e", "label": "mecanismos de proteção que impeçam retaliação a pessoa que utilize o canal de denúncias"}, {"id": "f", "label": "cronograma de auditorias externas obrigatórias"}], "correct": ["a", "b", "d", "e"], "explanation": "Art. 9º, §1º — Código deve trazer: princípios/valores; instâncias internas; canal de denúncias (interno e externo); proteção antirretaliação. Subsídios e auditorias externas têm regime próprio."}, {"id": "q18", "block": "Código de Conduta", "type": "single", "statement": "O treinamento sobre o Código de Conduta e Integridade deverá ocorrer periodicamente, no mínimo...", "options": [{"id": "a", "label": "semestralmente, para administradores e empregados"}, {"id": "b", "label": "anualmente, para empregados e administradores; sobre política de gestão de riscos, apenas para administradores"}, {"id": "c", "label": "trimestralmente, para administradores; anualmente, para empregados"}, {"id": "d", "label": "anualmente, apenas para administradores de nível superior"}, {"id": "e", "label": "bienalmente, para todos os integrantes da entidade"}, {"id": "f", "label": "anualmente, para administradores; a cada dois anos, para empregados"}], "correct": "b", "explanation": "Art. 9º, §2º — Código: anual para todos (empregados E administradores). Gestão de riscos: anual SÓ para administradores."}, {"id": "q19", "block": "Compliance", "type": "multi", "statement": "O estatuto social deverá prever a possibilidade de que a área de compliance se reporte diretamente ao Conselho de Administração nas situações em que...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "houver suspeita de envolvimento do diretor-presidente em irregularidades"}, {"id": "b", "label": "o Comitê de Auditoria solicitar avocação do tema"}, {"id": "c", "label": "o diretor-presidente se furtar à obrigação de adotar medidas necessárias em relação à situação a ele relatada"}, {"id": "d", "label": "o Ministério supervisor determinar investigação interna"}, {"id": "e", "label": "houver conflito de interesse entre acionistas controladores e minoritários"}, {"id": "f", "label": "a auditoria externa identificar inconsistências nas demonstrações financeiras"}], "correct": ["a", "c"], "explanation": "Art. 9º, §4º — bypass do diretor-presidente em duas situações: (1) suspeita contra ele; (2) omissão dele em adotar medidas. Garantia anti-encobrimento."}, {"id": "q20", "block": "Vedações à EP", "type": "multi", "statement": "A empresa pública NÃO poderá...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "constituir subsidiárias sem autorização legislativa prévia"}, {"id": "b", "label": "lançar debêntures ou outros títulos conversíveis em ações"}, {"id": "c", "label": "firmar contratos com fornecedores sem processo licitatório"}, {"id": "d", "label": "emitir partes beneficiárias"}, {"id": "e", "label": "participar de consórcio na condição de operadora"}, {"id": "f", "label": "celebrar contratos de patrocínio com pessoa jurídica privada"}], "correct": ["b", "d"], "explanation": "Art. 11 — EP NÃO pode emitir partes beneficiárias NEM lançar debêntures/títulos conversíveis em ações. Faz sentido: capital é integralmente público, não há como converter títulos em ações."}, {"id": "q21", "block": "Conselho de Administração", "type": "single", "statement": "O número de membros do Conselho de Administração da empresa pública e da sociedade de economia mista deverá observar...", "options": [{"id": "a", "label": "mínimo de 5 e máximo de 9 membros"}, {"id": "b", "label": "mínimo de 7 e máximo de 15 membros"}, {"id": "c", "label": "mínimo de 5 e máximo de 11 membros"}, {"id": "d", "label": "mínimo de 7 e máximo de 11 membros"}, {"id": "e", "label": "mínimo de 3 e máximo de 9 membros"}, {"id": "f", "label": "mínimo de 9 e máximo de 13 membros"}], "correct": "d", "explanation": "Art. 13, I — CA: 7 a 11 membros. Macete: 'sete a onze'."}, {"id": "q22", "block": "Diretoria", "type": "single", "statement": "O número mínimo de diretores da empresa pública e da sociedade de economia mista é de...", "options": [{"id": "a", "label": "2 diretores"}, {"id": "b", "label": "5 diretores"}, {"id": "c", "label": "3 diretores"}, {"id": "d", "label": "4 diretores"}, {"id": "e", "label": "6 diretores"}, {"id": "f", "label": "7 diretores"}], "correct": "c", "explanation": "Art. 13, IV — mínimo de 3 diretores. Não há limite máximo expresso na Lei."}, {"id": "q23", "block": "Mandatos", "type": "single", "statement": "O prazo de gestão dos membros do Conselho de Administração e dos diretores será unificado e não superior a 2 anos, sendo permitidas, no máximo...", "options": [{"id": "a", "label": "2 reconduções consecutivas"}, {"id": "b", "label": "4 reconduções consecutivas"}, {"id": "c", "label": "1 recondução consecutiva"}, {"id": "d", "label": "3 reconduções consecutivas"}, {"id": "e", "label": "5 reconduções consecutivas"}, {"id": "f", "label": "reconduções ilimitadas, a critério do acionista controlador"}], "correct": "d", "explanation": "Art. 13, III — 2 anos, com até 3 RECONDUÇÕES consecutivas (total: 8 anos no máximo)."}, {"id": "q24", "block": "Mandatos", "type": "single", "statement": "O prazo de gestão dos membros do Conselho Fiscal não será superior a 2 anos, sendo permitidas...", "options": [{"id": "a", "label": "3 reconduções consecutivas"}, {"id": "b", "label": "1 recondução consecutiva"}, {"id": "c", "label": "4 reconduções consecutivas"}, {"id": "d", "label": "2 reconduções consecutivas"}, {"id": "e", "label": "5 reconduções consecutivas"}, {"id": "f", "label": "reconduções ilimitadas, a critério do acionista controlador"}], "correct": "d", "explanation": "Art. 13, parágrafo único — Conselho Fiscal: 2 anos com 2 RECONDUÇÕES (total: 6 anos). Cuidado: CA e diretoria = 3 reconduções; CF = 2 reconduções."}, {"id": "q25", "block": "Avaliação", "type": "single", "statement": "A avaliação de desempenho de administradores e membros de comitês deverá ser de periodicidade...", "options": [{"id": "a", "label": "semestral, individual e coletiva"}, {"id": "b", "label": "anual, individual e coletiva"}, {"id": "c", "label": "bienal, apenas coletiva"}, {"id": "d", "label": "trimestral, apenas individual"}, {"id": "e", "label": "anual, apenas individual"}, {"id": "f", "label": "semestral, apenas coletiva"}], "correct": "b", "explanation": "Art. 13, III — avaliação ANUAL, INDIVIDUAL e COLETIVA. Cobertura dupla: o desempenho de cada membro e o do colegiado como um todo."}, {"id": "q26", "block": "Acionista Controlador", "type": "single", "statement": "A ação de reparação por atos praticados com abuso de poder pelo acionista controlador prescreve em...", "options": [{"id": "a", "label": "3 anos contados da data da prática do ato abusivo"}, {"id": "b", "label": "10 anos contados da data da prática do ato abusivo"}, {"id": "c", "label": "5 anos contados da data da prática do ato abusivo"}, {"id": "d", "label": "4 anos contados da data da prática do ato abusivo"}, {"id": "e", "label": "6 anos contados da data da prática do ato abusivo"}, {"id": "f", "label": "2 anos contados da data da prática do ato abusivo"}], "correct": "e", "explanation": "Art. 15, §4º — prescreve em 6 ANOS. Prazo específico da Lei das Estatais para abuso do controlador."}, {"id": "q27", "block": "Requisitos do Administrador", "type": "multi", "statement": "Os membros do Conselho de Administração e os indicados para cargos de diretor devem ser escolhidos entre cidadãos de reputação ilibada e notório conhecimento. Um dos requisitos alternativos de experiência é ter, no mínimo, 10 anos de experiência no setor público ou privado na área de atuação. Outro requisito alternativo é ter, no mínimo, 4 anos ocupando pelo menos um dos seguintes cargos...", "hint": "Marque as 3 corretas.", "options": [{"id": "a", "label": "cargo de direção ou chefia superior em empresa de porte ou objeto social semelhante ao da estatal"}, {"id": "b", "label": "cargo eletivo no Poder Legislativo de qualquer ente da federação"}, {"id": "c", "label": "cargo em comissão ou função de confiança equivalente a DAS-4 ou superior no setor público"}, {"id": "d", "label": "cargo de Ministro de Estado ou Secretário de Estado"}, {"id": "e", "label": "cargo de docente ou pesquisador em áreas de atuação da empresa pública ou SEM"}, {"id": "f", "label": "cargo de ouvidor ou controlador interno de órgão público federal"}], "correct": ["a", "c", "e"], "explanation": "Art. 17, §2º — 4 anos em: (1) direção/chefia em empresa de porte semelhante; (2) cargo em comissão DAS-4 ou superior; (3) docente/pesquisador em área de atuação. Cargos eletivos e de Ministro têm justamente vedação (próxima questão)."}, {"id": "q28", "block": "Vedações", "type": "single", "statement": "É vedada a indicação para o Conselho de Administração e para a diretoria de pessoa que atuou, nos últimos 36 meses, como participante de estrutura decisória de partido político ou em trabalho vinculado a organização, estruturação e realização de...", "options": [{"id": "a", "label": "movimentos sociais organizados"}, {"id": "b", "label": "sindicatos de trabalhadores do setor regulado"}, {"id": "c", "label": "campanha eleitoral"}, {"id": "d", "label": "entidades de classe de natureza profissional"}, {"id": "e", "label": "organizações não governamentais de interesse público"}, {"id": "f", "label": "associações de defesa do consumidor"}], "correct": "c", "explanation": "Art. 17, §2º, I — vedação por 36 meses para quem participou de estrutura decisória de partido OU campanha eleitoral. Visa despolitizar a indicação."}, {"id": "q29", "block": "Vedações", "type": "single", "statement": "É vedada a indicação para o Conselho de Administração e para a diretoria de pessoa que tenha firmado contrato ou parceria com a pessoa político-administrativa controladora ou com a própria estatal em período inferior a...", "options": [{"id": "a", "label": "12 meses antes da data de nomeação"}, {"id": "b", "label": "5 anos antes da data de nomeação"}, {"id": "c", "label": "24 meses antes da data de nomeação"}, {"id": "d", "label": "3 anos antes da data de nomeação"}, {"id": "e", "label": "18 meses antes da data de nomeação"}, {"id": "f", "label": "4 anos antes da data de nomeação"}], "correct": "d", "explanation": "Art. 17, §2º, III — vedação de 3 ANOS para quem firmou contrato/parceria com o controlador ou a estatal. Cuidado: política = 36 meses (3 anos); contrato = 3 anos. Coincidência."}, {"id": "q30", "block": "Vedações", "type": "single", "statement": "A vedação à indicação de representante do órgão regulador, Ministros de Estado, Secretários e titulares de cargos de direção e assessoramento superior estende-se também aos...", "options": [{"id": "a", "label": "cônjuges e companheiros dessas pessoas"}, {"id": "b", "label": "parentes consanguíneos ou afins até o segundo grau das pessoas mencionadas"}, {"id": "c", "label": "parentes consanguíneos ou afins até o terceiro grau das pessoas mencionadas"}, {"id": "d", "label": "sócios e parceiros comerciais dessas pessoas"}, {"id": "e", "label": "parentes consanguíneos até o quarto grau das pessoas mencionadas"}, {"id": "f", "label": "parentes afins até o segundo grau das pessoas mencionadas, excluídos os consanguíneos"}], "correct": "c", "explanation": "Art. 17, §2º, II — vedação se estende a parentes consanguíneos ou afins até o 3º GRAU. Tio, sobrinho, primo (4º grau não entra)."}, {"id": "q31", "block": "Dispensa de Requisitos", "type": "multi", "statement": "Os requisitos de experiência profissional para administrador poderão ser dispensados no caso de indicação de empregado da própria estatal, desde que atendidos cumulativamente os seguintes quesitos...", "hint": "Marque as 3 corretas.", "options": [{"id": "a", "label": "o empregado tenha ingressado na estatal por meio de concurso público"}, {"id": "b", "label": "o empregado tenha mais de 10 anos de trabalho efetivo na estatal"}, {"id": "c", "label": "o empregado tenha formação acadêmica em nível de pós-graduação stricto sensu"}, {"id": "d", "label": "o empregado tenha ocupado cargo na gestão superior da estatal"}, {"id": "e", "label": "o empregado tenha participado de treinamentos específicos sobre legislação societária"}, {"id": "f", "label": "o empregado não tenha histórico de penalidades disciplinares nos últimos 5 anos"}], "correct": ["a", "b", "d"], "explanation": "Art. 17, §5º — 3 requisitos cumulativos: (1) concurso público; (2) +10 anos na estatal; (3) já ocupou cargo na gestão superior. Pós-graduação e ausência de PAD não são exigidos."}, {"id": "q32", "block": "Membros Independentes", "type": "single", "statement": "O Conselho de Administração deve ser composto por, no mínimo, 25% de membros independentes ou por pelo menos 1 membro independente, caso haja decisão pelo exercício da faculdade do...", "options": [{"id": "a", "label": "voto plural pelos acionistas majoritários"}, {"id": "b", "label": "voto múltiplo pelos acionistas minoritários"}, {"id": "c", "label": "voto separado pelo Conselho Fiscal"}, {"id": "d", "label": "voto qualificado pelos empregados eleitos"}, {"id": "e", "label": "voto por procuração pelos acionistas preferenciais"}, {"id": "f", "label": "voto cumulativo pelos membros do Comitê de Auditoria"}], "correct": "b", "explanation": "Art. 22 — 25% de independentes OU pelo menos 1, se houver voto múltiplo (mecanismo de proteção a minoritários da Lei das S.A.)."}, {"id": "q33", "block": "Conselheiro Independente", "type": "single", "statement": "O conselheiro independente caracteriza-se, entre outros requisitos, por não ter mantido, nos últimos 3 anos, vínculo de qualquer natureza com a empresa pública, a SEM ou seus controladores. Também não pode ser ou ter sido, nos últimos 3 anos, empregado ou diretor da estatal ou de sociedade controlada, coligada ou subsidiária, exceto se o vínculo for exclusivamente com...", "options": [{"id": "a", "label": "fundações de previdência complementar patrocinadas pela estatal"}, {"id": "b", "label": "entidades sindicais representativas dos empregados"}, {"id": "c", "label": "órgãos de controle externo como TCU e CGU"}, {"id": "d", "label": "instituições públicas de ensino ou pesquisa"}, {"id": "e", "label": "associações de acionistas minoritários da estatal"}, {"id": "f", "label": "entidades do terceiro setor conveniadas com a estatal"}], "correct": "d", "explanation": "Art. 22, §1º — exceção para vínculo com instituições públicas de ensino/pesquisa. Pesquisador/docente público pode ser conselheiro independente sem que o vínculo o desqualifique."}, {"id": "q34", "block": "Membros Independentes", "type": "multi", "statement": "Para o cômputo das vagas destinadas a membros independentes do Conselho de Administração...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "são consideradas as vagas ocupadas por conselheiros eleitos por acionistas minoritários"}, {"id": "b", "label": "são consideradas as vagas ocupadas por conselheiros eleitos por empregados"}, {"id": "c", "label": "não são consideradas as vagas ocupadas por conselheiros eleitos por empregados"}, {"id": "d", "label": "não são consideradas as vagas ocupadas por conselheiros eleitos por acionistas minoritários"}, {"id": "e", "label": "são consideradas todas as vagas, independentemente da forma de eleição"}, {"id": "f", "label": "não são consideradas as vagas de membros indicados pelo acionista controlador"}], "correct": ["a", "c"], "explanation": "Art. 22, §3º — minoritários CONTAM (são independentes por natureza); empregados NÃO contam (têm vínculo trabalhista com a estatal)."}, {"id": "q35", "block": "Diversidade", "type": "single", "statement": "Nos conselhos de administração das estatais abrangidas por esta Lei, pelo menos...", "options": [{"id": "a", "label": "20% dos membros titulares serão mulheres"}, {"id": "b", "label": "40% dos membros titulares serão mulheres"}, {"id": "c", "label": "25% dos membros titulares serão mulheres"}, {"id": "d", "label": "35% dos membros titulares serão mulheres"}, {"id": "e", "label": "30% dos membros titulares serão mulheres"}, {"id": "f", "label": "50% dos membros titulares serão mulheres"}], "correct": "e", "explanation": "Art. 22-A — pelo menos 30% MULHERES nos CAs das estatais. Cota de gênero introduzida em alterações recentes da Lei."}, {"id": "q36", "block": "Acumulação", "type": "single", "statement": "É vedada a participação remunerada de membros da administração pública, direta ou indireta, em mais de...", "options": [{"id": "a", "label": "1 conselho, de administração ou fiscal, de empresa pública, SEM ou subsidiária"}, {"id": "b", "label": "3 conselhos, de administração ou fiscal, de empresa pública, SEM ou subsidiária"}, {"id": "c", "label": "2 conselhos, de administração ou fiscal, de empresa pública, SEM ou subsidiária"}, {"id": "d", "label": "4 conselhos, de administração ou fiscal, de empresa pública, SEM ou subsidiária"}, {"id": "e", "label": "5 conselhos, de administração ou fiscal, de empresa pública, SEM ou subsidiária"}, {"id": "f", "label": "sem limite, desde que haja autorização do Ministério supervisor"}], "correct": "c", "explanation": "Art. 20 — máximo de 2 conselhos. Evita que servidor 'colecione' conselhos e receba múltiplas remunerações."}, {"id": "q37", "block": "Diretoria", "type": "single", "statement": "É condição para investidura em cargo de diretoria da empresa pública e da SEM a assunção de compromisso com metas e resultados específicos, que deverá ser aprovado pelo...", "options": [{"id": "a", "label": "Ministério supervisor, como instância de controle finalístico"}, {"id": "b", "label": "Conselho Fiscal, em reunião ordinária"}, {"id": "c", "label": "acionista controlador, mediante resolução formal"}, {"id": "d", "label": "Conselho de Administração, a quem incumbe também fiscalizar seu cumprimento"}, {"id": "e", "label": "Comitê de Auditoria Estatutário, após análise de viabilidade"}, {"id": "f", "label": "assembleia geral de acionistas, por maioria absoluta"}], "correct": "d", "explanation": "Art. 23 — compromisso de metas aprovado pelo CA, que também o fiscaliza. Vincula diretor a resultados objetivos."}, {"id": "q38", "block": "Plano de Negócios", "type": "multi", "statement": "A diretoria deverá apresentar ao Conselho de Administração, até a última reunião ordinária do ano anterior...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "plano de negócios para o exercício anual seguinte"}, {"id": "b", "label": "relatório de gestão de riscos do exercício em curso"}, {"id": "c", "label": "proposta de distribuição de dividendos para o próximo exercício"}, {"id": "d", "label": "estratégia de longo prazo atualizada com análise de riscos e oportunidades para, no mínimo, os próximos 5 anos"}, {"id": "e", "label": "avaliação de desempenho individual de todos os diretores"}, {"id": "f", "label": "orçamento detalhado de investimentos para os próximos 3 anos"}], "correct": ["a", "d"], "explanation": "Art. 23, §1º — entregar: (1) plano de negócios anual; (2) estratégia de longo prazo (mínimo 5 anos). Curto + longo prazo."}, {"id": "q39", "block": "Comitê de Auditoria", "type": "single", "statement": "O Comitê de Auditoria Estatutário é órgão auxiliar do...", "options": [{"id": "a", "label": "diretor-presidente, a quem se reporta diretamente"}, {"id": "b", "label": "Conselho Fiscal, como instância de controle interno"}, {"id": "c", "label": "Ministério supervisor, por delegação normativa"}, {"id": "d", "label": "Conselho de Administração, ao qual se reportará diretamente"}, {"id": "e", "label": "assembleia geral de acionistas, como órgão soberano"}, {"id": "f", "label": "área de compliance, como instância de supervisão técnica"}], "correct": "d", "explanation": "Art. 24 — Comitê de Auditoria é órgão AUXILIAR do CA, com reporte direto a ele."}, {"id": "q40", "block": "Comitê de Auditoria", "type": "multi", "statement": "Competirá ao Comitê de Auditoria Estatutário, entre outras atribuições...", "hint": "Marque as 4 corretas.", "options": [{"id": "a", "label": "opinar sobre a contratação e destituição de auditor independente"}, {"id": "b", "label": "fixar a remuneração dos membros da diretoria executiva"}, {"id": "c", "label": "supervisionar as atividades dos auditores independentes, avaliando sua independência e qualidade"}, {"id": "d", "label": "monitorar a qualidade e a integridade dos mecanismos de controle interno e das demonstrações financeiras"}, {"id": "e", "label": "avaliar e monitorar exposições de risco da empresa pública ou da SEM"}, {"id": "f", "label": "deliberar sobre a política de distribuição de dividendos da estatal"}], "correct": ["a", "c", "d", "e"], "explanation": "Art. 24, §1º — Comitê de Auditoria: opina sobre auditor independente, supervisiona auditores, monitora controles internos/demonstrações e monitora riscos. Remuneração e dividendos são de outros órgãos."}, {"id": "q41", "block": "Comitê de Auditoria", "type": "single", "statement": "O Comitê de Auditoria Estatutário deverá se reunir quando necessário, no mínimo...", "options": [{"id": "a", "label": "mensalmente"}, {"id": "b", "label": "trimestralmente"}, {"id": "c", "label": "anualmente"}, {"id": "d", "label": "semestralmente"}, {"id": "e", "label": "bimestralmente"}, {"id": "f", "label": "semanalmente"}], "correct": "e", "explanation": "Art. 24, §3º — reunião BIMESTRAL no mínimo. A cada 2 meses."}, {"id": "q42", "block": "Comitê de Auditoria", "type": "single", "statement": "Caso o Conselho de Administração considere que a divulgação da ata do Comitê de Auditoria possa pôr em risco interesse legítimo da estatal, será divulgado apenas o extrato das atas. Essa restrição, porém...", "options": [{"id": "a", "label": "aplica-se também ao TCU, que deverá solicitar formalmente acesso ao conteúdo integral"}, {"id": "b", "label": "não será oponível aos órgãos de controle, que terão total e irrestrito acesso ao conteúdo das atas"}, {"id": "c", "label": "aplica-se a todos os órgãos externos, inclusive os de controle, pelo prazo de 2 anos"}, {"id": "d", "label": "poderá ser afastada por decisão judicial, mediante requerimento fundamentado"}, {"id": "e", "label": "não será oponível ao Conselho Fiscal, mas aplica-se aos demais órgãos externos"}, {"id": "f", "label": "aplica-se inclusive ao Ministério supervisor, salvo em caso de intervenção"}], "correct": "b", "explanation": "Art. 24, §3º — sigilo NÃO É OPONÍVEL aos órgãos de controle (TCU, CGU). Eles têm acesso total e irrestrito. Sigilo só vale para o público externo."}, {"id": "q43", "block": "Comitê de Auditoria", "type": "single", "statement": "A documentação comprobatória do atendimento às condições de elegibilidade para o Comitê de Auditoria Estatutário deve ser mantida na sede da empresa pelo prazo mínimo de...", "options": [{"id": "a", "label": "3 anos contados do último dia de mandato do membro"}, {"id": "b", "label": "10 anos contados da data de nomeação do membro"}, {"id": "c", "label": "2 anos contados do último dia de mandato do membro"}, {"id": "d", "label": "7 anos contados da data de nomeação do membro"}, {"id": "e", "label": "5 anos contados do último dia de mandato do membro"}, {"id": "f", "label": "8 anos contados da data de encerramento do exercício social"}], "correct": "e", "explanation": "Art. 25, §3º — 5 anos contados do ÚLTIMO DIA DE MANDATO. Garante prova de elegibilidade por período razoável após o término da função."}, {"id": "q44", "block": "Comitê de Auditoria", "type": "single", "statement": "O Comitê de Auditoria Estatutário será integrado por, no mínimo, 3 e, no máximo, 5 membros, em sua maioria independentes. Ao menos 1 dos membros deve ter reconhecida experiência em...", "options": [{"id": "a", "label": "gestão de riscos corporativos e compliance regulatório"}, {"id": "b", "label": "assuntos de contabilidade societária"}, {"id": "c", "label": "direito empresarial e societário"}, {"id": "d", "label": "auditoria governamental e controle externo"}, {"id": "e", "label": "políticas públicas e governança corporativa"}, {"id": "f", "label": "finanças corporativas e mercado de capitais"}], "correct": "b", "explanation": "Art. 25, §1º — ao menos 1 membro com experiência em CONTABILIDADE SOCIETÁRIA. Faz sentido: comitê fiscaliza demonstrações financeiras."}, {"id": "q45", "block": "Comitê de Auditoria", "type": "multi", "statement": "São condições mínimas para integrar o Comitê de Auditoria Estatutário — não ser ou ter sido, nos 12 meses anteriores à nomeação...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "diretor, empregado ou membro do conselho fiscal da estatal ou de sua controladora, controlada ou coligada"}, {"id": "b", "label": "acionista minoritário com participação superior a 5% do capital votante"}, {"id": "c", "label": "responsável técnico, diretor, gerente ou supervisor em equipe de auditoria na estatal"}, {"id": "d", "label": "membro de conselho consultivo sem poder deliberativo"}, {"id": "e", "label": "representante de entidade reguladora do setor de atuação da estatal"}, {"id": "f", "label": "servidor público do ente controlador, ainda que sem cargo de direção"}], "correct": ["a", "c"], "explanation": "Art. 25 — vedações por 12 meses: (1) diretor/empregado/CF da estatal ou afiliadas; (2) responsável por equipe de auditoria na estatal. Garante 'distância' temporal para independência."}, {"id": "q46", "block": "Conselho Fiscal", "type": "single", "statement": "O Conselho Fiscal contará com pelo menos 1 membro indicado pelo ente controlador, que deverá ser...", "options": [{"id": "a", "label": "advogado com notório saber em direito societário"}, {"id": "b", "label": "servidor público com vínculo permanente com a administração pública"}, {"id": "c", "label": "contador ou auditor registrado no CRC competente"}, {"id": "d", "label": "membro independente sem vínculo com a administração pública"}, {"id": "e", "label": "representante da CGU indicado pelo Ministro de Estado competente"}, {"id": "f", "label": "economista com experiência mínima de 5 anos em finanças públicas"}], "correct": "b", "explanation": "Art. 26 — pelo menos 1 membro do CF deve ser SERVIDOR PÚBLICO efetivo. Garante 'olho' da administração no Conselho Fiscal."}, {"id": "q47", "block": "Conselho Fiscal", "type": "single", "statement": "Podem ser membros do Conselho Fiscal pessoas naturais, residentes no País, com formação acadêmica compatível com a função, que tenham exercido por prazo mínimo de 3 anos...", "options": [{"id": "a", "label": "cargo de direção ou assessoramento na administração pública, ou cargo de conselheiro fiscal ou administrador em empresa"}, {"id": "b", "label": "cargo de auditor independente registrado na CVM ou no CRC"}, {"id": "c", "label": "mandato eletivo em qualquer esfera da federação"}, {"id": "d", "label": "cargo técnico em órgão de controle externo como TCU ou CGU"}, {"id": "e", "label": "função de compliance officer em empresa de porte semelhante"}, {"id": "f", "label": "cargo de diretor jurídico ou financeiro em empresa privada de grande porte"}], "correct": "a", "explanation": "Art. 26 — 3 anos em cargo de direção/assessoramento na administração pública OU como conselheiro fiscal/administrador em empresa. Bagagem de gestão pública ou societária."}, {"id": "q48", "block": "Função Social", "type": "single", "statement": "A empresa pública e a sociedade de economia mista terão a função social de realização do interesse coletivo ou de atendimento a imperativo da segurança nacional expressa no...", "options": [{"id": "a", "label": "estatuto social aprovado pela assembleia geral de acionistas"}, {"id": "b", "label": "instrumento de autorização legal para a sua criação"}, {"id": "c", "label": "contrato de gestão firmado com o Ministério supervisor"}, {"id": "d", "label": "plano de negócios aprovado pelo Conselho de Administração"}, {"id": "e", "label": "carta anual subscrita pelos membros do Conselho de Administração"}, {"id": "f", "label": "regulamento editado pelo Poder Executivo após a criação da entidade"}], "correct": "b", "explanation": "Art. 27 — função social expressa no INSTRUMENTO DE AUTORIZAÇÃO LEGAL. A lei que cria a estatal já define para que ela serve."}, {"id": "q49", "block": "Função Social", "type": "multi", "statement": "A realização do interesse coletivo pela empresa pública e pela SEM deverá ser orientada para...", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "maximização do lucro para reinvestimento em políticas públicas"}, {"id": "b", "label": "ampliação economicamente sustentada do acesso de consumidores aos produtos e serviços da estatal"}, {"id": "c", "label": "redução do quadro de pessoal para fins de eficiência orçamentária"}, {"id": "d", "label": "desenvolvimento ou emprego de tecnologia brasileira para produção e oferta de produtos e serviços, sempre de maneira economicamente justificada"}, {"id": "e", "label": "transferência de tecnologia estrangeira para redução de custos operacionais"}, {"id": "f", "label": "expansão da participação de mercado em detrimento de empresas privadas concorrentes"}], "correct": ["b", "d"], "explanation": "Art. 27, §1º — interesse coletivo: (1) ampliação sustentada do acesso de consumidores; (2) tecnologia brasileira economicamente justificada. Não é maximização de lucro nem expansão a qualquer custo."}, {"id": "q50", "block": "Função Social", "type": "single", "statement": "A empresa pública e a sociedade de economia mista poderão celebrar convênio ou contrato de patrocínio com pessoa física ou jurídica para promoção de atividades culturais, sociais, esportivas, educacionais e de inovação tecnológica, desde que...", "options": [{"id": "a", "label": "haja autorização prévia do Ministério supervisor competente"}, {"id": "b", "label": "o valor do patrocínio não ultrapasse limite fixado em regulamento"}, {"id": "c", "label": "comprovadamente vinculadas ao fortalecimento de sua marca"}, {"id": "d", "label": "aprovadas pelo Conselho de Administração por maioria qualificada"}, {"id": "e", "label": "a entidade beneficiária não tenha fins lucrativos"}, {"id": "f", "label": "os recursos sejam oriundos de receitas próprias, excluídos aportes do Tesouro"}], "correct": "c", "explanation": "Art. 27, §3º — patrocínios DEVEM estar comprovadamente vinculados ao fortalecimento da MARCA da estatal. Vinculação institucional, não política."}, {"id": "custom_1779150666941", "block": "Questão adicionada manualmente", "type": "single", "statement": "Sobre as regras de gestão de riscos e controle interno da empresa pública e da sociedade de economia mista, previstas na Lei nº 13.303/2016, analise as afirmativas e marque a correta. (Marque a 1 correta)", "options": [{"id": "a", "label": "A auditoria interna deverá ser vinculada ao diretor-presidente, podendo, excepcionalmente e mediante justificativa idônea, ser vinculada ao Conselho de Administração diretamente ou por meio do Comitê de Auditoria Estatutário."}, {"id": "b", "label": "O estatuto social deverá prever a possibilidade de que a área de compliance se reporte diretamente ao Conselho de Administração quando se suspeite do envolvimento do diretor-presidente em irregularidades ou quando este se furtar à obrigação de adotar as medidas necessárias em relação à situação a ele relatada."}, {"id": "c", "label": "A auditoria interna deverá ser vinculada ao Conselho de Administração, diretamente ou por meio do Comitê de Auditoria Estatutário, sendo essa vinculação facultativa nos casos em que a estatal possua receita operacional bruta inferior a R$ 90.000.000,00."}, {"id": "d", "label": "A área de compliance deverá ser vinculada ao Conselho de Administração e liderada por diretor estatutário, com reporte direto ao diretor-presidente apenas nas situações em que se suspeite de irregularidades envolvendo membros do próprio Conselho."}, {"id": "e", "label": "O estatuto social poderá prever, a critério do Conselho de Administração, que a área de compliance se reporte diretamente ao Ministério supervisor em situações que envolvam suspeita de irregularidades praticadas pelo diretor-presidente."}, {"id": "f", "label": "A auditoria interna será responsável por aferir a adequação do controle interno e a efetividade do gerenciamento dos riscos, podendo ser vinculada ao diretor-presidente ou ao Conselho de Administração, conforme dispuser o estatuto social de cada estatal."}], "correct": "b", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779150718751", "block": "Questão adicionada manualmente", "type": "single", "statement": "Sobre o regime societário da empresa pública e da SEM previsto na Lei nº 13.303/2016, marque a alternativa correta. (Marque a 1 correta)", "options": [{"id": "a", "label": "A sociedade de economia mista será constituída sob a forma de sociedade anônima, e as normas da CVM sobre demonstrações financeiras aplicam-se apenas às de capital aberto com registro na CVM."}, {"id": "b", "label": "O estatuto da empresa pública e da SEM deverá observar regras de governança corporativa, transparência e gestão de riscos, sendo os mecanismos de proteção aos acionistas exigidos apenas quando houver participação privada superior a 25%."}, {"id": "c", "label": "A obrigatoriedade de auditoria independente por auditor registrado na CVM aplica-se a todas as empresas públicas, às SEM de capital fechado e às suas subsidiárias, independentemente de registro na CVM."}, {"id": "d", "label": "O estatuto da empresa pública e da SEM deverá observar regras de governança corporativa e transparência, sendo as práticas de gestão de riscos e controle interno facultativas para subsidiárias de capital fechado."}, {"id": "e", "label": "A sociedade de economia mista será constituída sob a forma de sociedade anônima apenas quando houver acionistas privados; caso o capital seja integralmente público, poderá adotar outra forma societária."}, {"id": "f", "label": "As normas da CVM sobre escrituração e demonstrações financeiras aplicam-se às SEM de capital aberto e fechado, mas não às empresas públicas, que seguem exclusivamente as normas do Conselho Federal de Contabilidade."}], "correct": "c", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779150745231", "block": "Questão adicionada manualmente", "type": "single", "statement": "Sobre a composição e as regras do Conselho de Administração da empresa pública e da sociedade de economia mista, previstas na Lei nº 13.303/2016, marque a alternativa correta. (Marque a 1 correta)", "options": [{"id": "a", "label": "É garantida a participação de representante dos empregados no Conselho de Administração, mas a participação de acionistas minoritários depende de previsão expressa no estatuto social da estatal."}, {"id": "b", "label": "É vedada a participação remunerada de membros da administração pública em mais de três conselhos, de administração ou fiscal, de empresa pública, sociedade de economia mista ou suas subsidiárias."}, {"id": "c", "label": "Nos conselhos de administração das estatais abrangidas por esta Lei, pelo menos vinte por cento dos membros titulares serão mulheres, sendo este o percentual mínimo exigido desde a edição original da Lei nº 13.303/2016."}, {"id": "d", "label": "É garantida a participação, no Conselho de Administração, de representante dos empregados e dos acionistas minoritários, sendo vedada a participação remunerada de membros da administração pública em mais de dois conselhos."}, {"id": "e", "label": "Nos conselhos de administração das estatais, pelo menos trinta por cento dos membros titulares serão mulheres, e é admitida a participação remunerada de membros da administração pública em até três conselhos."}, {"id": "f", "label": "A participação de acionistas minoritários no Conselho de Administração é garantida pela lei, assegurando-lhes o direito de eleger no mínimo dois conselheiros, salvo se maior número lhes couber pelo processo de voto múltiplo."}], "correct": "d", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779152141530", "block": "Questão adicionada manualmente", "type": "single", "statement": "**Questão 4** *Sobre os requisitos e vedações para indicação de membros do Conselho de Administração de empresa pública e sociedade de economia mista, previstos no art. 17 da Lei nº 13.303/2016, marque a alternativa correta.* **(Marque a 1 correta)**", "options": [{"id": "a", "label": "É vedada a indicação de pessoa que exerça cargo em organização sindical, mas tal vedação não se aplica quando o candidato possui mais de 10 anos de experiência no setor de atuação da estatal."}, {"id": "b", "label": "A vedação à indicação de Secretário de Estado aplica-se apenas quando o cargo exercido for diretamente relacionado ao setor de atuação da estatal, sendo admitida a indicação quando se tratar de pasta não correlata."}, {"id": "c", "label": "O requisito de experiência como profissional liberal exige no mínimo 4 anos em atividade direta ou indiretamente vinculada à área de atuação da estatal, sendo vedada a indicação de pessoa que tenha firmado contrato com a própria estatal nos últimos 3 anos."}, {"id": "d", "label": "A vedação à indicação por vínculo contratual com a estatal aplica-se apenas a contratos vigentes na data da nomeação, não alcançando contratos já encerrados no momento da indicação."}, {"id": "e", "label": "É vedada a indicação de Secretário de Estado apenas quando este estiver no exercício efetivo do cargo, sendo admitida sua indicação caso esteja licenciado no momento da nomeação."}, {"id": "f", "label": "O requisito de experiência como profissional liberal exige no mínimo 2 anos em atividade vinculada à área de atuação da estatal, podendo esse prazo ser reduzido pela metade quando houver formação acadêmica específica na área."}], "correct": "c", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779152212486", "block": "Questão adicionada manualmente", "type": "single", "statement": "Sobre os requisitos e impedimentos para indicação de diretor de empresa pública ou sociedade de economia mista, previstos no art. 17 da Lei nº 13.303/2016 c/c a Lei Complementar nº 64/1990, marque a alternativa correta. (Marque a 1 correta)", "options": [{"id": "a", "label": "A condenação por ato doloso de improbidade administrativa que cause prejuízo ao erário impede a indicação para diretor de estatal apenas enquanto perdurarem os efeitos da suspensão dos direitos políticos, cessando o impedimento com o término do prazo da sanção."}, {"id": "b", "label": "A norma exige formação acadêmica específica na área de atuação da estatal, de modo que candidato com graduação em direito e mestrado em políticas públicas não atende ao requisito de compatibilidade para cargo de diretor em empresa de saneamento básico."}, {"id": "c", "label": "A condenação por ato doloso de improbidade administrativa que importe lesão ao patrimônio público e enriquecimento ilícito, proferida por órgão colegiado, impede a indicação para diretor de estatal desde a condenação até o transcurso do prazo de oito anos após o cumprimento da pena."}, {"id": "d", "label": "A experiência de quinze anos no setor público como Secretário Municipal supre qualquer outro requisito ou impedimento, sendo suficiente para autorizar a indicação para cargo de diretor de empresa pública estadual."}, {"id": "e", "label": "O impedimento decorrente de condenação por improbidade administrativa aplica-se apenas quando a decisão condenatória tiver transitado em julgado, não sendo suficiente a decisão proferida por órgão colegiado para configurar a inelegibilidade."}, {"id": "f", "label": "A condenação por improbidade administrativa que resulte em suspensão dos direitos políticos impede a indicação para diretor de estatal somente quando a penalidade aplicada for superior a oito anos, sendo admitida a indicação nos casos de suspensão por prazo inferior."}], "correct": "c", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779152307027", "block": "Questão adicionada manualmente", "type": "single", "statement": "Sobre os requisitos e vedações para ocupação de cargos de diretoria e assentos no Conselho de Administração de estatais, previstos no art. 17 da Lei nº 13.303/2016, marque a alternativa correta. (Marque a 1 correta)", "options": [{"id": "a", "label": "A lei exige formação acadêmica específica na mesma ispensáveis quando um deles for plenamente satisfeito."}, {"id": "c", "label": "o requisito de experiência profissional deve ser atendido em uma das modalidades previstas, enquanto os requisitos de formação acadêmica compatível e de não enquadramento em inelegibilidade devem ser atendidos obrigatoriamente e ao mesmo tempo."}, {"id": "d", "label": "o requisito de formação acadêmica é alternativo ao de experiência profissional, sendo o não enquadramento em inelegibilidade o único exigido de forma absoluta."}, {"id": "e", "label": "os requisitos de experiência profissional e formação acadêmica são alternativos entre si, sendo o não enquadramento em inelegibilidade dispensável quando os dois primeiros forem atendidos."}, {"id": "f", "label": "o requisito de experiência profissional é cumulativo com os demais, podendo qualquer de suas modalidades ser substituída pela comprovação de formação acadêmica específica."}], "correct": "c", "explanation": "Questão adicionada manualmente.", "noCorrectMarked": false}, {"id": "custom_1779153044833", "block": "Questão adicionada manualmente", "type": "single", "statement": "Uma das formas de atender ao requisito de experiência profissional é ter, no mínimo, 10 anos de atuação. Essa experiência deve ser... (Marque a 1 correta)", "options": [{"id": "a", "label": "exclusivamente no setor privado, em empresa de porte semelhante ao da estatal."}, {"id": "b", "label": "no setor público ou privado, na área de atuação da estatal ou em área conexa àquela para a qual o candidato for indicado em função de direção superior."}, {"id": "c", "label": "no setor público ou privado, desde que exclusivamente na mesma área de atuação da estatal, vedada a contagem de experiência em área apenas conexa."}, {"id": "d", "label": "exclusivamente no setor público, em cargo de direção ou assessoramento superior."}, {"id": "e", "label": "no setor privado, com pelo menos metade do período na área específica de atuação da estatal."}, {"id": "f", "label": "no setor
