 da Petrobras como SEM / Delegação → serviço de telefonia prestado por empresa privada / Territorial → território federal"}, {"id": "c", "label": "Outorga → território federal / Delegação → criação do INSS / Territorial → serviço de telefonia prestado por empresa privada"}, {"id": "d", "label": "Outorga → serviço de telefonia prestado por empresa privada / Delegação → território federal / Territorial → criação da Petrobras"}, {"id": "e", "label": "Outorga → território federal / Delegação → serviço de telefonia / Territorial → criação do INSS"}], "correct": "b", "explanation": "Questão personalizada — adicionada pelo usuário.", "hint": "Marque a 1 correta"}, {"id": "custom_1779318253920", "block": "Personalizada", "type": "multi", "statement": "Sinônimos de descentralização por outorga\n\"A descentralização por outorga também é conhecida por outros nomes. Assinale os que correspondem ao mesmo fenômeno... (Marque as 3 corretas)", "options": [{"id": "a", "label": "descentralização por colaboração"}, {"id": "b", "label": "descentralização por serviços"}, {"id": "c", "label": "descentralização por delegação"}, {"id": "d", "label": "descentralização técnica"}, {"id": "e", "label": "descentralização funcional"}, {"id": "f", "label": "descentralização por hierarquia"}], "correct": ["b", "d", "e"], "explanation": "Questão personalizada — adicionada pelo usuário."}]}]}, {"id": "licitacoes", "name": "Licitações", "quizzes": [{"id": "art6", "name": "Art. 6º — Definições", "subtitle": "Lei 14.133/2021", "storageKey": "quiz_lei14133_art6", "excludedDefault": [], "questions": [{"id": "lic6_1", "block": "Bens e Serviços", "type": "single", "statement": "...bens e serviços _______, aqueles cujos padrões de desempenho e qualidade podem ser objetivamente definidos pelo edital, por meio de especificações usuais de mercado.", "options": [{"id": "a", "label": "especiais, pois exigem justificativa prévia do contratante em razão da complexidade"}, {"id": "b", "label": "comuns, pois seus padrões de desempenho e qualidade são definidos por especificações usuais de mercado"}, {"id": "c", "label": "contínuos, pois decorrem de necessidades permanentes ou prolongadas da Administração"}, {"id": "d", "label": "técnicos especializados, pois envolvem conhecimento predominantemente intelectual"}, {"id": "e", "label": "de grande vulto, pois superam o valor de referência estabelecido em lei"}, {"id": "f", "label": "por escopo, pois impõem ao contratado a entrega de resultado específico em prazo predeterminado"}], "correct": "b", "explanation": "A expressão-chave é \"especificações usuais de mercado\" — ela define bens e serviços comuns. A distratora mais atraente é a A, que descreve corretamente os bens e serviços especiais (heterogeneidade/complexidade + justificativa prévia), mas aplica esse conceito à pergunta errada. A diferença entre comuns e especiais está exatamente na possibilidade de definição objetiva pelo edital.", "hint": "Marque a 1 correta"}, {"id": "lic6_2", "block": "Bens e Serviços", "type": "single", "statement": "...bens e serviços especiais: aqueles que, por sua alta heterogeneidade ou complexidade, não podem ser descritos na forma [de bens e serviços comuns], _______.", "options": [{"id": "a", "label": "dispensada qualquer motivação adicional do contratante"}, {"id": "b", "label": "exigida justificativa prévia do contratante"}, {"id": "c", "label": "exigida autorização prévia do órgão de controle interno"}, {"id": "d", "label": "exigida justificativa prévia do contratado antes da assinatura"}, {"id": "e", "label": "dispensada licitação, por força da natureza especial do objeto"}, {"id": "f", "label": "exigida publicação em diário oficial com antecedência mínima de 30 dias"}], "correct": "b", "explanation": "A lei exige \"justificativa prévia do contratante\" — ou seja, de quem contrata, não de quem é contratado. A distratora D inverte o sujeito (contratado), que é a pegadinha principal. A distratora C inventa exigência de autorização de controle interno, que não existe nesse dispositivo.", "hint": "Marque a 1 correta"}, {"id": "lic6_3", "block": "Bens e Serviços", "type": "single", "statement": "...serviços e fornecimentos contínuos: serviços contratados e compras realizadas pela Administração Pública para a manutenção da atividade administrativa, decorrentes de necessidades _______.", "options": [{"id": "a", "label": "eventuais ou sazonais"}, {"id": "b", "label": "urgentes ou emergenciais"}, {"id": "c", "label": "permanentes ou prolongadas"}, {"id": "d", "label": "técnicas ou especializadas"}, {"id": "e", "label": "discricionárias ou facultativas"}, {"id": "f", "label": "específicas ou pontuais"}], "correct": "c", "explanation": "A expressão literal é \"necessidades permanentes ou prolongadas\". As distratoras A, B e F usam adjetivos plausíveis mas que não constam do dispositivo. A distinção entre \"permanentes ou prolongadas\" (serviços contínuos) e \"específico em período predeterminado\" (serviços por escopo) é ponto recorrente em provas.", "hint": "Marque a 1 correta"}, {"id": "lic6_4", "block": "Bens e Serviços", "type": "multi", "statement": "Sobre os serviços contínuos com regime de dedicação exclusiva de mão de obra, o modelo de execução contratual exige, entre outros requisitos, que o contratado:", "options": [{"id": "a", "label": "disponha os seus empregados nas dependências do contratante para a prestação dos serviços"}, {"id": "b", "label": "compartilhe os recursos humanos entre diferentes contratos para otimizar custos operacionais"}, {"id": "c", "label": "não compartilhe os recursos humanos e materiais disponíveis para execução simultânea de outros contratos"}, {"id": "d", "label": "possibilite a fiscalização pelo contratante quanto à distribuição, controle e supervisão dos recursos humanos alocados"}, {"id": "e", "label": "apresente relatório mensal de produtividade ao Tribunal de Contas competente"}, {"id": "f", "label": "substitua os empregados alocados sempre que solicitado pelo contratante, sem necessidade de justificativa"}], "correct": ["a", "c", "d"], "explanation": "Os três requisitos literais da lei são: empregados à disposição nas dependências do contratante (A), não compartilhamento de recursos humanos e materiais (C), e possibilidade de fiscalização pelo contratante (D). A distratora B é o oposto exato de C — a lei proíbe o compartilhamento. As distratoras E e F inventam obrigações que não existem no dispositivo.", "hint": "Marque as 3 corretas"}, {"id": "lic6_5", "block": "Bens e Serviços", "type": "single", "statement": "...serviços não contínuos ou contratados por escopo: aqueles que impõem ao contratado o dever de realizar a prestação de um serviço específico em período predeterminado, podendo ser prorrogado, desde que _______, pelo prazo necessário à conclusão do objeto.", "options": [{"id": "a", "label": "autorizado pelo órgão de controle interno"}, {"id": "b", "label": "aprovado pelo ordenador de despesas com anuência do fiscal do contrato"}, {"id": "c", "label": "justificadamente"}, {"id": "d", "label": "previamente publicado no diário oficial"}, {"id": "e", "label": "solicitado pelo contratado com antecedência mínima de 60 dias"}, {"id": "f", "label": "homologado pela autoridade máxima do órgão contratante"}], "correct": "c", "explanation": "A lei usa apenas \"justificadamente\" — sem mencionar prazo de antecedência, publicação ou aprovação de órgão específico. As distratoras inventam formalidades que não constam do dispositivo. É uma questão de precisão terminológica: a prorrogação é permitida, mas condicionada a justificativa.", "hint": "Marque a 1 correta"}, {"id": "lic6_6", "block": "Serviços Técnicos Intelectuais", "type": "single", "statement": "Assinale a alternativa que apresenta atividade NÃO enquadrada como serviço técnico especializado de natureza predominantemente intelectual, conforme a Lei 14.133/2021:", "options": [{"id": "a", "label": "elaboração de pareceres, perícias e avaliações em geral"}, {"id": "b", "label": "treinamento e aperfeiçoamento de pessoal"}, {"id": "c", "label": "restauração de obras de arte e de bens de valor histórico"}, {"id": "d", "label": "execução de obras de construção civil com fornecimento de materiais e mão de obra"}, {"id": "e", "label": "patrocínio ou defesa de causas judiciais e administrativas"}, {"id": "f", "label": "fiscalização, supervisão e gerenciamento de obras e serviços"}], "correct": "d", "explanation": "A execução de obras de construção civil é enquadrada como obra ou serviço de engenharia comum/especial, não como serviço técnico de natureza predominantemente intelectual. Todos os demais (A, B, C, E, F) constam expressamente do rol legal. A pegadinha está em D, que envolve engenharia mas é execução material, não atividade intelectual.", "hint": "Marque a 1 correta"}, {"id": "lic6_7", "block": "Serviços Técnicos Intelectuais", "type": "single", "statement": "São exemplos de serviços técnicos especializados de natureza predominantemente intelectual, EXCETO:", "options": [{"id": "a", "label": "assessorias e consultorias técnicas e auditorias financeiras e tributárias"}, {"id": "b", "label": "estudos técnicos, planejamentos, projetos básicos e projetos executivos"}, {"id": "c", "label": "controles de qualidade e tecnológico, análises, testes e ensaios de campo e laboratoriais"}, {"id": "d", "label": "fornecimento de bens e equipamentos padronizados para uso da Administração"}, {"id": "e", "label": "fiscalização, supervisão e gerenciamento de obras e serviços"}, {"id": "f", "label": "patrocínio ou defesa de causas judiciais e administrativas"}], "correct": "d", "explanation": "Fornecimento de bens e equipamentos padronizados é aquisição de material, não serviço técnico de natureza intelectual. As demais alternativas constam literalmente do rol do dispositivo. A distratora C pode confundir por envolver análises laboratoriais, mas a lei expressamente a inclui no rol dos serviços predominantemente intelectuais.", "hint": "Marque a 1 correta"}, {"id": "lic6_8", "block": "Engenharia e Grande Vulto", "type": "single", "statement": "...serviço comum de engenharia: todo serviço de engenharia que tem por objeto ações, objetivamente padronizáveis em termos de desempenho e qualidade, de manutenção, de adequação e de adaptação de bens móveis e imóveis, _______.", "options": [{"id": "a", "label": "com modificação das características originais dos bens, quando tecnicamente necessária"}, {"id": "b", "label": "com preservação das características originais dos bens"}, {"id": "c", "label": "com substituição integral dos componentes estruturais dos bens"}, {"id": "d", "label": "com ampliação das características originais dos bens para atender novo padrão de mercado"}, {"id": "e", "label": "com adaptação das características originais dos bens a novas normas regulatórias"}, {"id": "f", "label": "independentemente de preservação ou alteração das características originais dos bens"}], "correct": "b", "explanation": "A expressão literal é \"com preservação das características originais dos bens\". As distratoras A, C, D e E substituem \"preservação\" por verbos que implicam alteração (modificação, substituição, ampliação, adaptação) — exatamente o oposto do que a lei exige para enquadrar como serviço comum. Serviços que alteram as características originais tendem a ser serviços especiais de engenharia.", "hint": "Marque a 1 correta"}, {"id": "lic6_9", "block": "Engenharia e Grande Vulto", "type": "single", "statement": "...serviço especial de engenharia: aquele que, por sua alta _______ ou complexidade, não pode se enquadrar na definição de serviço comum de engenharia.", "options": [{"id": "a", "label": "especialização técnica"}, {"id": "b", "label": "relevância orçamentária"}, {"id": "c", "label": "heterogeneidade"}, {"id": "d", "label": "abrangência territorial"}, {"id": "e", "label": "sensibilidade ambiental"}, {"id": "f", "label": "criticidade operacional"}], "correct": "c", "explanation": "A lei usa \"alta heterogeneidade ou complexidade\" — o mesmo binômio usado para bens e serviços especiais. A pegadinha está em A (especialização técnica), que parece coerente com o nome \"serviço especial\", mas não é o termo legal. Heterogeneidade significa impossibilidade de padronização objetiva.", "hint": "Marque a 1 correta"}, {"id": "lic6_10", "block": "Engenharia e Grande Vulto", "type": "single", "statement": "Consideram-se obras, serviços e fornecimentos de grande vulto aqueles cujo valor estimado:", "options": [{"id": "a", "label": "seja igual ou superior a R$ 200.000.000,00 (duzentos milhões de reais)"}, {"id": "b", "label": "supere R$ 200.000.000,00 (duzentos milhões de reais)"}, {"id": "c", "label": "seja superior a R$ 100.000.000,00 (cem milhões de reais)"}, {"id": "d", "label": "seja igual ou superior a R$ 100.000.000,00 (cem milhões de reais)"}, {"id": "e", "label": "ultrapasse R$ 500.000.000,00 (quinhentos milhões de reais)"}, {"id": "f", "label": "seja igual ou superior a R$ 50.000.000,00 (cinquenta milhões de reais)"}], "correct": "b", "explanation": "A lei diz \"supera R$ 200.000.000,00\" — o verbo \"superar\" exclui o valor exato (limiar aberto, não fechado). A distratora A usa \"igual ou superior\", o que incluiria o valor exato de R$ 200 milhões, o que contradiz o texto legal. Essa distinção entre \"supera\" e \"igual ou superior\" é pegadinha clássica de prova.", "hint": "Marque a 1 correta"}, {"id": "lic6_11", "block": "Documentos e Projetos", "type": "single", "statement": "O termo de referência é o documento necessário para a contratação de bens e serviços. Assinale a alternativa que apresenta elemento que NÃO integra obrigatoriamente o termo de referência:", "options": [{"id": "a", "label": "definição do objeto, incluídos sua natureza, os quantitativos e o prazo do contrato"}, {"id": "b", "label": "modelo de execução do objeto e modelo de gestão do contrato"}, {"id": "c", "label": "critérios de medição e de pagamento"}, {"id": "d", "label": "estudo de impacto ambiental detalhado do objeto a ser contratado"}, {"id": "e", "label": "estimativas do valor da contratação acompanhadas dos preços unitários referenciais"}, {"id": "f", "label": "forma e critérios de seleção do fornecedor"}], "correct": "d", "explanation": "O estudo de impacto ambiental detalhado não consta do rol legal do termo de referência. Os demais elementos (A, B, C, E, F) estão expressamente listados no dispositivo. A lei menciona \"adequação orçamentária\" e \"estimativas de valor\", mas não exige estudo ambiental como parte do TR — esse requisito pode aparecer em outros documentos do processo licitatório.", "hint": "Marque a 1 correta"}, {"id": "lic6_12", "block": "Documentos e Projetos", "type": "single", "statement": "Qual a distinção correta entre projeto básico e projeto executivo na Lei 14.133/2021?", "options": [{"id": "a", "label": "O projeto básico contém elementos suficientes à execução completa da obra; o projeto executivo define e dimensiona a obra com nível de precisão adequado"}, {"id": "b", "label": "O projeto executivo define e dimensiona a obra; o projeto básico detalha as soluções do projeto executivo para permitir a execução completa"}, {"id": "c", "label": "O projeto básico define e dimensiona a obra com nível de precisão adequado; o projeto executivo contém o detalhamento das soluções para a execução completa"}, {"id": "d", "label": "O projeto básico e o projeto executivo têm conteúdo equivalente, diferindo apenas na fase de elaboração durante o contrato"}, {"id": "e", "label": "O projeto executivo é elaborado antes do projeto básico, servindo de subsídio para as definições de dimensionamento da obra"}, {"id": "f", "label": "O projeto básico é dispensável quando houver anteprojeto aprovado; o projeto executivo substitui ambos nos regimes de contratação integrada"}], "correct": "c", "explanation": "O projeto básico define e dimensiona (precisão adequada para definir o objeto e avaliar custos); o projeto executivo contém os elementos suficientes à execução completa, com detalhamento das soluções do projeto básico. A distratora A inverte os conceitos. A distratora E inverte a sequência lógica — o projeto executivo é sempre posterior ao básico.", "hint": "Marque a 1 correta"}, {"id": "lic6_13", "block": "Documentos e Projetos", "type": "single", "statement": "O anteprojeto, como peça técnica, tem por finalidade:", "options": [{"id": "a", "label": "conter os elementos necessários e suficientes à execução completa da obra"}, {"id": "b", "label": "fornecer todos os subsídios necessários à elaboração do projeto básico"}, {"id": "c", "label": "detalhar as soluções previstas no projeto básico para viabilizar a licitação"}, {"id": "d", "label": "definir e dimensionar a obra com nível de precisão suficiente para o orçamento final"}, {"id": "e", "label": "substituir o projeto básico nos contratos de empreitada por preço global"}, {"id": "f", "label": "conter os elementos mínimos para a assinatura do contrato sem necessidade de projeto básico"}], "correct": "b", "explanation": "A lei define o anteprojeto como \"peça técnica com todos os subsídios necessários à elaboração do projeto básico\" — ou seja, é documento anterior e preparatório ao projeto básico. As distratoras A e C descrevem o projeto executivo e o projeto básico, respectivamente. A ordem correta na lei é: anteprojeto → projeto básico → projeto executivo.", "hint": "Marque a 1 correta"}, {"id": "lic6_14", "block": "Regimes de Execução", "type": "single", "statement": "Assinale a alternativa que define corretamente a empreitada por preço unitário:", "options": [{"id": "a", "label": "contratação da execução da obra ou serviço por preço certo e total, independentemente das quantidades executadas"}, {"id": "b", "label": "contratação de empreendimento em sua integralidade, sob responsabilidade do contratado até a entrega em condições de operação"}, {"id": "c", "label": "contratação da execução da obra ou serviço por preço certo de unidades determinadas"}, {"id": "d", "label": "regime de contratação de mão de obra para pequenos trabalhos por preço certo, com ou sem fornecimento de materiais"}, {"id": "e", "label": "contratação por preço fixo para cada etapa da obra, com medição ao término de cada fase predeterminada"}, {"id": "f", "label": "contratação em que o contratado define as unidades e os preços correspondentes após a assinatura do contrato"}], "correct": "c", "explanation": "A empreitada por preço unitário é \"por preço certo de unidades determinadas\" — o pagamento é feito por unidade medida. A distratora A descreve a empreitada por preço global (\"preço certo e total\"). A distratora D descreve a contratação por tarefa. A diferença entre unitária (por unidade medida) e global (preço total fixo) é ponto central em provas.", "hint": "Marque a 1 correta"}, {"id": "lic6_15", "block": "Regimes de Execução", "type": "single", "statement": "Na empreitada integral, o contratado assume responsabilidade:", "options": [{"id": "a", "label": "apenas pela execução das obras civis, ficando as instalações a cargo do contratante"}, {"id": "b", "label": "por todas as etapas de obras, serviços e instalações, entregando o empreendimento em condições de entrada em operação"}, {"id": "c", "label": "pela execução das obras e serviços, mas não pelo fornecimento de equipamentos e instalações operacionais"}, {"id": "d", "label": "pela elaboração do projeto executivo e execução das obras, ficando o projeto básico a cargo do contratante"}, {"id": "e", "label": "pela execução integral das obras, com responsabilidade limitada às etapas previstas no projeto básico"}, {"id": "f", "label": "pela totalidade das etapas, podendo subcontratar a operação inicial sem necessidade de autorização"}], "correct": "b", "explanation": "A empreitada integral abrange \"a totalidade das etapas de obras, serviços e instalações necessárias, sob inteira responsabilidade do contratado até sua entrega ao contratante em condições de entrada em operação\". As distratoras A, C e E fragmentam indevidamente essa responsabilidade. A expressão \"condições de entrada em operação\" é o elemento distintivo da empreitada integral.", "hint": "Marque a 1 correta"}, {"id": "lic6_16", "block": "Regimes de Execução", "type": "single", "statement": "Qual a diferença entre contratação integrada e contratação semi-integrada?", "options": [{"id": "a", "label": "Na integrada, o contratado elabora apenas o projeto executivo; na semi-integrada, elabora os projetos básico e executivo"}, {"id": "b", "label": "Na integrada, o contratado elabora os projetos básico e executivo; na semi-integrada, o contratado elabora apenas o projeto executivo"}, {"id": "c", "label": "Na integrada e na semi-integrada, o contratado elabora ambos os projetos, diferindo apenas no prazo de entrega"}, {"id": "d", "label": "Na semi-integrada, o contratado elabora apenas o projeto básico; na integrada, elabora apenas o projeto executivo"}, {"id": "e", "label": "Na integrada, o projeto básico é fornecido pelo contratante; na semi-integrada, é fornecido pelo contratado"}, {"id": "f", "label": "Na integrada e na semi-integrada, o projeto básico é sempre fornecido pelo contratante, cabendo ao contratado apenas a execução"}], "correct": "b", "explanation": "Na contratação integrada, o contratado elabora e desenvolve os projetos básico e executivo. Na semi-integrada, o contratado elabora e desenvolve apenas o projeto executivo (o projeto básico já existe e é fornecido pelo contratante). A distratora A inverte completamente os conceitos. Essa distinção é das mais cobradas em provas sobre a Lei 14.133/2021.", "hint": "Marque a 1 correta"}, {"id": "lic6_17", "block": "Regimes de Execução", "type": "single", "statement": "A contratação por tarefa é definida como:", "options": [{"id": "a", "label": "regime de contratação de obras de grande vulto por preço certo, com fornecimento obrigatório de materiais pelo contratado"}, {"id": "b", "label": "regime de contratação de mão de obra para pequenos trabalhos por preço certo, com ou sem fornecimento de materiais"}, {"id": "c", "label": "regime de contratação de serviços contínuos com dedicação exclusiva de mão de obra, por preço fixo mensal"}, {"id": "d", "label": "regime de contratação de empreendimento integral por preço certo, com responsabilidade total do contratado"}, {"id": "e", "label": "regime de contratação de mão de obra especializada para obras de médio porte, com fornecimento obrigatório de materiais"}, {"id": "f", "label": "regime de contratação de serviços técnicos de natureza intelectual por preço certo e escopo definido"}], "correct": "b", "explanation": "A lei define contratação por tarefa como \"mão de obra para pequenos trabalhos por preço certo, com ou sem fornecimento de materiais\". As distratoras A e E alteram o porte dos trabalhos (grande vulto / médio porte). A distratora C mistura o conceito com serviços contínuos. O detalhe \"com ou sem fornecimento de materiais\" costuma ser explorado em provas.", "hint": "Marque a 1 correta"}, {"id": "lic6_18", "block": "Regimes de Execução", "type": "single", "statement": "A matriz de riscos é definida na Lei 14.133/2021 como:", "options": [{"id": "a", "label": "documento autônomo elaborado pelo contratante antes da licitação, que define os riscos do projeto sem vincular o contrato"}, {"id": "b", "label": "cláusula contratual definidora de riscos e de responsabilidades entre as partes, caracterizadora do equilíbrio econômico-financeiro inicial do contrato"}, {"id": "c", "label": "anexo obrigatório ao edital que distribui os riscos exclusivamente ao contratado, protegendo o patrimônio público"}, {"id": "d", "label": "instrumento externo ao contrato que permite revisão dos preços sempre que ocorrer evento superveniente"}, {"id": "e", "label": "cláusula contratual que distribui riscos apenas entre o contratante e o órgão de controle externo"}, {"id": "f", "label": "documento elaborado pelo contratado após a assinatura do contrato, listando os eventos que podem afetar o equilíbrio financeiro"}], "correct": "b", "explanation": "A matriz de riscos é uma cláusula contratual (não documento autônomo nem anexo) que define riscos e responsabilidades entre as partes (não apenas ao contratado) e caracteriza o equilíbrio econômico-financeiro inicial. A distratora A erra ao dizer \"documento autônomo\" e \"sem vincular o contrato\". A distratora C erra ao dizer \"exclusivamente ao contratado\". A distratora F erra o momento de elaboração.", "hint": "Marque a 1 correta"}, {"id": "lic6_19", "block": "Pregão", "type": "single", "statement": "...pregão: modalidade de licitação _______ para aquisição de bens e serviços comuns, cujo critério de julgamento poderá ser o de menor preço ou o de maior desconto.", "options": [{"id": "a", "label": "facultativa"}, {"id": "b", "label": "preferencial"}, {"id": "c", "label": "obrigatória"}, {"id": "d", "label": "subsidiária"}, {"id": "e", "label": "recomendada"}, {"id": "f", "label": "prioritária"}], "correct": "c", "explanation": "A lei é expressa: o pregão é modalidade \"obrigatória\" para bens e serviços comuns. As distratoras A, B, D, E e F suavizam essa obrigatoriedade, o que contraria o texto legal. Também é importante notar que o critério de julgamento pode ser menor preço OU maior desconto — são alternativos, não cumulativos.", "hint": "Marque a 1 correta"}, {"id": "lic6_20", "block": "Pregão", "type": "single", "statement": "Quanto ao critério de julgamento no pregão, é correto afirmar que:", "options": [{"id": "a", "label": "o único critério admitido é o de menor preço, vedado o critério de maior desconto"}, {"id": "b", "label": "o único critério admitido é o de maior desconto, vedado o critério de menor preço"}, {"id": "c", "label": "os critérios de menor preço e maior desconto são cumulativos e devem ser aplicados simultaneamente"}, {"id": "d", "label": "o critério de julgamento poderá ser o de menor preço ou o de maior desconto"}, {"id": "e", "label": "o critério de julgamento é definido exclusivamente pelo TCU para cada modalidade de licitação"}, {"id": "f", "label": "os critérios de menor preço e maior desconto são vedados no pregão, aplicando-se apenas o de melhor técnica"}], "correct": "d", "explanation": "A lei diz \"poderá ser o de menor preço ou o de maior desconto\" — são critérios alternativos, não cumulativos. As distratoras A e B admitem apenas um dos dois. A distratora C trata os critérios como cumulativos. A distratora F inventa vedação inexistente.", "hint": "Marque a 1 correta"}, {"id": "lic6_21", "block": "Sobrepreço e Superfaturamento", "type": "single", "statement": "Sobrepreço, nos termos da Lei 14.133/2021, é:", "options": [{"id": "a", "label": "dano efetivo ao patrimônio público decorrente de medição de quantidades superiores às executadas"}, {"id": "b", "label": "preço orçado para licitação ou contratado em valor expressivamente superior aos preços referenciais de mercado"}, {"id": "c", "label": "diferença entre o valor contratado e o valor efetivamente pago ao contratado ao final da execução"}, {"id": "d", "label": "irregularidade verificada apenas quando a distorção afetar o valor global do contrato, nunca por item unitário"}, {"id": "e", "label": "dano provocado ao patrimônio da Administração por alterações no cronograma físico-financeiro do contrato"}, {"id": "f", "label": "valor pago em excesso ao contratado em razão de medição incorreta de serviços executados"}], "correct": "b", "explanation": "Sobrepreço é o preço orçado ou contratado em valor expressivamente superior ao mercado — ainda não é dano efetivo, mas um indicativo de irregularidade no preço. As distratoras A, E e F descrevem hipóteses de superfaturamento, não sobrepreço. A distinção fundamental: sobrepreço é problema no preço fixado; superfaturamento é dano efetivo ao patrimônio.", "hint": "Marque a 1 correta"}, {"id": "lic6_22", "block": "Sobrepreço e Superfaturamento", "type": "single", "statement": "O superfaturamento caracteriza dano ao patrimônio da Administração. Assinale a alternativa que apresenta hipótese NÃO prevista expressamente como caracterizadora de superfaturamento:", "options": [{"id": "a", "label": "medição de quantidades superiores às efetivamente executadas ou fornecidas"}, {"id": "b", "label": "deficiência na execução de obras que resulte em diminuição da qualidade, vida útil ou segurança"}, {"id": "c", "label": "alterações no orçamento de obras que causem desequilíbrio econômico-financeiro em favor do contratado"}, {"id": "d", "label": "pagamento de sobrepreço em item isolado quando o valor global do contrato estiver dentro da média de mercado"}, {"id": "e", "label": "recebimentos contratuais antecipados decorrentes de alterações de cláusulas financeiras"}, {"id": "f", "label": "reajuste irregular de preços decorrente de alterações de cláusulas financeiras"}], "correct": "d", "explanation": "A lei admite que o sobrepreço de um único item configure superfaturamento quando a licitação for por preços unitários — não há ressalva que afaste a irregularidade pelo fato de o valor global estar dentro da média. As hipóteses A, B, C, E e F constam expressamente do rol legal de superfaturamento. A distratora D inventa uma excludente que não existe.", "hint": "Marque a 1 correta"}, {"id": "lic6_23", "block": "Reajuste e Repactuação", "type": "single", "statement": "O reajustamento em sentido estrito consiste em:", "options": [{"id": "a", "label": "forma de manutenção do equilíbrio contratual utilizada exclusivamente em contratos de serviços contínuos com mão de obra"}, {"id": "b", "label": "análise da variação dos custos contratuais para serviços com predominância de mão de obra, com data vinculada ao dissídio coletivo"}, {"id": "c", "label": "aplicação do índice de correção monetária previsto no contrato, que deve retratar a variação efetiva do custo de produção"}, {"id": "d", "label": "renegociação integral dos preços contratuais sempre que ocorrer variação de custos acima de 10% em 12 meses"}, {"id": "e", "label": "mecanismo de revisão contratual aplicável apenas quando houver fato superveniente imprevisível que altere o equilíbrio inicial"}, {"id": "f", "label": "aplicação de índice de correção definido pelo TCU após análise dos custos reais incorridos pelo contratado"}], "correct": "c", "explanation": "O reajustamento em sentido estrito é a \"aplicação do índice de correção monetária previsto no contrato\" — automático, baseado em índice pré-acordado. As distratoras A e B descrevem a repactuação. A distratora E descreve a revisão/reequilíbrio por fato superveniente, que é instituto diferente. O reajustamento não depende de análise caso a caso, apenas da aplicação do índice contratual.", "hint": "Marque a 1 correta"}, {"id": "lic6_24", "block": "Reajuste e Repactuação", "type": "single", "statement": "A repactuação se distingue do reajustamento em sentido estrito porque:", "options": [{"id": "a", "label": "é utilizada para qualquer tipo de contrato administrativo, enquanto o reajustamento se limita a contratos de obras"}, {"id": "b", "label": "é utilizada para serviços contínuos com regime de dedicação exclusiva ou predominância de mão de obra, mediante análise da variação dos custos contratuais"}, {"id": "c", "label": "é calculada com base em índice de correção monetária previsto no contrato, sem necessidade de negociação entre as partes"}, {"id": "d", "label": "é aplicada automaticamente ao término de cada período anual do contrato, independentemente de requerimento do contratado"}, {"id": "e", "label": "é utilizada apenas para contratos de grande vulto, enquanto o reajustamento se aplica aos demais contratos"}, {"id": "f", "label": "é determinada unilateralmente pelo contratante com base nos índices oficiais de inflação publicados pelo IBGE"}], "correct": "b", "explanation": "A repactuação é específica para serviços contínuos com dedicação exclusiva ou predominância de mão de obra, e se baseia na análise da variação dos custos (não em índice automático). A distratora C descreve o reajustamento em sentido estrito. A distratora D inventa automatismo que não existe — a repactuação depende de análise e está vinculada a datas específicas (propostas e acordos/convenções coletivas).", "hint": "Marque a 1 correta"}, {"id": "lic6_25", "block": "Reajuste e Repactuação", "type": "multi", "statement": "A repactuação deve estar prevista no edital com data vinculada:", "options": [{"id": "a", "label": "à data de publicação do extrato do contrato no Diário Oficial, para todos os custos"}, {"id": "b", "label": "à apresentação das propostas, para os custos decorrentes do mercado"}, {"id": "c", "label": "ao acordo, convenção coletiva ou dissídio coletivo ao qual o orçamento esteja vinculado, para os custos decorrentes da mão de obra"}, {"id": "d", "label": "à data de assinatura do contrato, para os custos decorrentes do mercado"}, {"id": "e", "label": "ao laudo pericial do TCU, para os custos decorrentes da mão de obra"}, {"id": "f", "label": "ao índice IPCA acumulado nos 12 meses anteriores, para todos os custos"}], "correct": ["b", "c"], "explanation": "A lei define duas datas de vinculação distintas: à apresentação das propostas (para custos de mercado) e ao acordo/convenção/dissídio coletivo (para custos de mão de obra). As distratoras D e A substituem incorretamente as datas. As distratoras E e F inventam mecanismos que não constam do dispositivo. Essa dualidade de datas é o ponto mais cobrado sobre repactuação.", "hint": "Marque as 2 corretas"}, {"id": "licdoc_1", "block": "Documentos Técnicos", "type": "single", "statement": "O termo de referência é definido na Lei 14.133/2021 como:", "options": [{"id": "a", "label": "conjunto de elementos necessários e suficientes para definir e dimensionar a obra ou o serviço, com nível de precisão adequado para avaliação do custo"}, {"id": "b", "label": "peça técnica com todos os subsídios necessários à elaboração do projeto básico, contendo a proposta de concepção da obra ou do serviço"}, {"id": "c", "label": "documento necessário para a contratação de bens e serviços, que deve conter os parâmetros e elementos descritivos da contratação"}, {"id": "d", "label": "conjunto de elementos necessários e suficientes à execução completa da obra, com detalhamento das soluções do projeto básico"}, {"id": "e", "label": "cláusula contratual que define riscos e responsabilidades entre as partes para fins de equilíbrio econômico-financeiro"}, {"id": "f", "label": "documento que demonstra a viabilidade técnica e econômica do empreendimento antes da abertura do processo licitatório"}], "correct": "c", "explanation": "O termo de referência é definido como \"documento necessário para a contratação de bens e serviços\" — seu campo de aplicação é bens e serviços (não obras). As distratoras A e D descrevem o projeto básico e o projeto executivo, respectivamente. A distratora B descreve o anteprojeto. O TR é o instrumento de planejamento da contratação, não de projeto de engenharia.", "hint": "Marque a 1 correta"}, {"id": "licdoc_2", "block": "Documentos Técnicos", "type": "single", "statement": "Para qual objeto o termo de referência é o documento exigido?", "options": [{"id": "a", "label": "exclusivamente para obras de engenharia de qualquer porte"}, {"id": "b", "label": "para a contratação de bens e serviços"}, {"id": "c", "label": "exclusivamente para serviços técnicos de natureza predominantemente intelectual"}, {"id": "d", "label": "para obras, serviços e fornecimentos de grande vulto"}, {"id": "e", "label": "para qualquer contratação pública, incluindo obras de engenharia"}, {"id": "f", "label": "exclusivamente para serviços contínuos com regime de dedicação exclusiva de mão de obra"}], "correct": "b", "explanation": "A lei é precisa: o TR é o documento necessário para a \"contratação de bens e serviços\". Para obras, o instrumento correspondente é o projeto básico. As distratoras A, D e E incluem obras, o que está errado. As distratoras C e F restringem indevidamente o escopo do TR a categorias específicas de serviços.", "hint": "Marque a 1 correta"}, {"id": "licdoc_3", "block": "Documentos Técnicos", "type": "single", "statement": "O anteprojeto é definido como:", "options": [{"id": "a", "label": "conjunto de elementos necessários e suficientes à execução completa da obra, com detalhamento das soluções técnicas"}, {"id": "b", "label": "documento necessário para a contratação de bens e serviços, contendo os parâmetros descritivos da contratação"}, {"id": "c", "label": "peça técnica com todos os subsídios necessários à elaboração do projeto básico"}, {"id": "d", "label": "conjunto de elementos necessários e suficientes para definir e dimensionar a obra, com nível de precisão adequado"}, {"id": "e", "label": "instrumento que assegura a viabilidade técnica e o adequado tratamento do impacto ambiental do empreendimento"}, {"id": "f", "label": "documento elaborado pelo contratado após a assinatura do contrato, detalhando a metodologia de execução"}], "correct": "c", "explanation": "O anteprojeto é a \"peça técnica com todos os subsídios necessários à elaboração do projeto básico\" — é o documento que antecede e subsidia o projeto básico. A distratora D descreve o projeto básico. A distratora A descreve o projeto executivo. A palavra \"subsídios\" é o elemento central: o anteprojeto fornece insumos para que o projeto básico seja elaborado.", "hint": "Marque a 1 correta"}, {"id": "licdoc_4", "block": "Documentos Técnicos", "type": "single", "statement": "Qual é a relação hierárquica correta entre anteprojeto, projeto básico e projeto executivo?", "options": [{"id": "a", "label": "projeto básico → anteprojeto → projeto executivo"}, {"id": "b", "label": "projeto executivo → projeto básico → anteprojeto"}, {"id": "c", "label": "anteprojeto → projeto executivo → projeto básico"}, {"id": "d", "label": "anteprojeto → projeto básico → projeto executivo"}, {"id": "e", "label": "projeto básico → projeto executivo → anteprojeto"}, {"id": "f", "label": "os três documentos são elaborados simultaneamente, sem ordem hierárquica definida em lei"}], "correct": "d", "explanation": "A sequência lógica e legal é: anteprojeto (subsidia a elaboração do projeto básico) → projeto básico (define e dimensiona a obra) → projeto executivo (detalha as soluções do projeto básico para execução completa). Essa sequência decorre das próprias definições legais: o anteprojeto fornece subsídios ao básico; o executivo detalha o básico.", "hint": "Marque a 1 correta"}, {"id": "licdoc_5", "block": "Documentos Técnicos", "type": "single", "statement": "O projeto básico é definido como:", "options": [{"id": "a", "label": "peça técnica com todos os subsídios necessários à elaboração do projeto executivo, contendo proposta de concepção da obra"}, {"id": "b", "label": "documento necessário para a contratação de serviços, que deve conter os parâmetros e elementos descritivos da contratação"}, {"id": "c", "label": "conjunto de elementos necessários e suficientes à execução completa da obra, com detalhamento das soluções técnicas previstas"}, {"id": "d", "label": "conjunto de elementos necessários e suficientes, com nível de precisão adequado para definir e dimensionar a obra ou o serviço"}, {"id": "e", "label": "cláusula contratual que define riscos, responsabilidades e equilíbrio econômico-financeiro inicial entre as partes"}, {"id": "f", "label": "levantamento topográfico e cadastral elaborado antes da licitação para subsidiar a estimativa de custo da obra"}], "correct": "d", "explanation": "O projeto básico é o \"conjunto de elementos necessários e suficientes, com nível de precisão adequado para definir e dimensionar a obra ou o serviço\". As expressões-chave são \"definir e dimensionar\" e \"nível de precisão adequado\". A distratora C descreve o projeto executivo (\"execução completa\" e \"detalhamento\"). A distratora A descreve o anteprojeto, mas com o sujeito trocado.", "hint": "Marque a 1 correta"}, {"id": "licdoc_6", "block": "Documentos Técnicos", "type": "multi", "statement": "O projeto básico deve assegurar, entre outros elementos:", "options": [{"id": "a", "label": "a viabilidade técnica e o adequado tratamento do impacto ambiental do empreendimento"}, {"id": "b", "label": "a possibilidade de avaliação do custo da obra"}, {"id": "c", "label": "a definição dos métodos e do prazo de execução"}, {"id": "d", "label": "a entrega do empreendimento em condições de entrada em operação pelo contratado"}, {"id": "e", "label": "a aprovação prévia pelo Tribunal de Contas competente antes da licitação"}, {"id": "f", "label": "a substituição do termo de referência nos contratos de obras de pequeno porte"}], "correct": ["a", "b", "c"], "explanation": "A lei diz que o projeto básico deve \"assegurar a viabilidade técnica e o adequado tratamento do impacto ambiental\" (A), \"possibilitar a avaliação do custo da obra\" (B) e permitir \"a definição dos métodos e do prazo de execução\" (C). A distratora D descreve elemento da empreitada integral, não do projeto básico. As distratoras E e F inventam exigências que não constam do dispositivo.", "hint": "Marque as 3 corretas"}, {"id": "licdoc_7", "block": "Documentos Técnicos", "type": "single", "statement": "O projeto executivo é definido como:", "options": [{"id": "a", "label": "conjunto de elementos necessários e suficientes, com nível de precisão adequado para definir e dimensionar a obra ou o serviço"}, {"id": "b", "label": "peça técnica com todos os subsídios necessários à elaboração do projeto básico, incluindo pareceres de sondagem"}, {"id": "c", "label": "conjunto de elementos necessários e suficientes à execução completa da obra, com o detalhamento das soluções previstas no projeto básico"}, {"id": "d", "label": "documento necessário para a contratação de bens e serviços, contendo os critérios de medição e seleção do fornecedor"}, {"id": "e", "label": "conjunto de estudos técnicos que assegura a viabilidade do empreendimento e possibilita a avaliação do custo global"}, {"id": "f", "label": "instrumento contratual que detalha os métodos e o prazo de execução acordados entre contratante e contratado"}], "correct": "c", "explanation": "O projeto executivo é o \"conjunto de elementos necessários e suficientes à execução completa da obra, com o detalhamento das soluções previstas no projeto básico\". As expressões distintivas são \"execução completa\" e \"detalhamento das soluções do projeto básico\". A distratora A descreve o projeto básico (\"definir e dimensionar\"). A distratora B descreve o anteprojeto.", "hint": "Marque a 1 correta"}, {"id": "licdoc_8", "block": "Documentos Técnicos", "type": "single", "statement": "O projeto executivo distingue-se do projeto básico principalmente porque:", "options": [{"id": "a", "label": "o projeto básico é elaborado pelo contratado, enquanto o projeto executivo é sempre elaborado pelo contratante"}, {"id": "b", "label": "o projeto executivo contém o detalhamento das soluções para a execução completa da obra; o projeto básico define e dimensiona o objeto com nível de precisão adequado"}, {"id": "c", "label": "o projeto básico contém o detalhamento das soluções construtivas; o projeto executivo apenas define o dimensionamento geral da obra"}, {"id": "d", "label": "o projeto executivo é elaborado antes do início da licitação; o projeto básico é elaborado somente após a assinatura do contrato"}, {"id": "e", "label": "o projeto básico é obrigatório em todos os regimes de execução; o projeto executivo é dispensável nos contratos de empreitada global"}, {"id": "f", "label": "o projeto executivo e o projeto básico têm o mesmo conteúdo, diferindo apenas no momento de aprovação pelo contratante"}], "correct": "b", "explanation": "O projeto básico \"define e dimensiona\" (precisão adequada para licitar e orçar); o projeto executivo \"detalha as soluções\" para permitir a execução completa da obra. A distratora C inverte os conceitos. A distratora D inverte a sequência temporal — o projeto básico precede a licitação; o executivo pode ser elaborado durante a execução do contrato em alguns regimes.", "hint": "Marque a 1 correta"}, {"id": "licdoc_9", "block": "Documentos Técnicos", "type": "single", "statement": "Sobre o anteprojeto e o projeto básico, é correto afirmar que:", "options": [{"id": "a", "label": "o anteprojeto substitui o projeto básico nos contratos de empreitada por preço global de pequeno porte"}, {"id": "b", "label": "o anteprojeto contém os subsídios necessários à elaboração do projeto básico, sendo, portanto, documento que o antecede"}, {"id": "c", "label": "o projeto básico contém os subsídios necessários à elaboração do anteprojeto, sendo elaborado em etapa anterior"}, {"id": "d", "label": "o anteprojeto e o projeto básico têm conteúdo equivalente, diferindo apenas na denominação adotada pelo contratante"}, {"id": "e", "label": "o anteprojeto é dispensável quando o contratante já possuir estudos técnicos preliminares suficientes para a licitação"}, {"id": "f", "label": "o projeto básico é elaborado pelo contratado após a assinatura do contrato, com base no anteprojeto fornecido pelo contratante"}], "correct": "b", "explanation": "O anteprojeto é \"peça técnica com todos os subsídios necessários à elaboração do projeto básico\" — logo, o antecede. A distratora C inverte a relação. A distratora F inverte a responsabilidade pela elaboração (o projeto básico em regra é elaborado antes da licitação pelo contratante, salvo nos regimes de contratação integrada e semi-integrada).", "hint": "Marque a 1 correta"}, {"id": "licdoc_10", "block": "Documentos Técnicos", "type": "single", "statement": "Nos regimes de contratação integrada e semi-integrada, a responsabilidade pela elaboração dos projetos é distribuída da seguinte forma:", "options": [{"id": "a", "label": "na integrada, o contratante fornece os projetos básico e executivo; na semi-integrada, o contratado elabora ambos"}, {"id": "b", "label": "na integrada, o contratado elabora os projetos básico e executivo; na semi-integrada, o contratado elabora apenas o projeto executivo"}, {"id": "c", "label": "em ambos os regimes, o contratante fornece o projeto básico e o contratado elabora apenas o projeto executivo"}, {"id": "d", "label": "em ambos os regimes, o contratado elabora os projetos básico e executivo, diferindo apenas no prazo de entrega"}, {"id": "e", "label": "na integrada, o contratado elabora apenas o projeto básico; na semi-integrada, elabora apenas o projeto executivo"}, {"id": "f", "label": "na semi-integrada, o contratado elabora os projetos básico e executivo; na integrada, o contratante fornece ambos"}], "correct": "b", "explanation": "Na contratação integrada, o contratado é responsável por elaborar e desenvolver os projetos básico e executivo. Na semi-integrada, o contratado elabora e desenvolve apenas o projeto executivo (o projeto básico é fornecido pelo contratante). A distratora A inverte completamente. A distratora F também inverte. Esse ponto distingue os dois regimes e é muito cobrado em provas.", "hint": "Marque a 1 correta"}]}, {"id": "art1ao10", "name": "Arts. 1º ao 4º e 7º ao 10 — Disposições Gerais e Agentes", "subtitle": "Lei 14.133/2021", "storageKey": "quiz_lei14133_art1ao10", "excludedDefault": [], "questions": [{"id": "a10_q1", "block": "Art. 1º — Abrangência", "type": "single", "statement": "(Certo/Errado) Quando atuam no exercício de sua função típica, os órgãos dos Poderes Legislativo e Judiciário não se sujeitam à Lei 14.133/2021; a submissão à Lei ocorre apenas no desempenho de função administrativa.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. O que prende Legislativo e Judiciário à lei é estarem 'no desempenho de função administrativa' (inciso I)."}, {"id": "a10_q2", "block": "Art. 1º — Abrangência", "type": "single", "statement": "(Certo/Errado) Os órgãos do Poder Judiciário dos Municípios submetem-se à Lei 14.133/2021 ralmente a esta Lei, sem exceções."}, {"id": "b", "label": "Às peculiaridades locais e aos princípios básicos desta Lei, na forma de regulamentação específica editada por ministro de Estado."}, {"id": "c", "label": "Às peculiaridades locais e a todas as regras desta Lei, mediante decreto presidencial."}, {"id": "d", "label": "Exclusivamente à legislação do país onde sediadas."}, {"id": "e", "label": "Aos princípios básicos desta Lei, na forma de regulamentação editada pelo chefe da repartição."}], "correct": "b", "explanation": "Os trocadilhos clássicos: trocar 'ministro de Estado' por presidente/chefe da repartição, ou dizer 'todas as regras' em vez de 'princípios básicos'."}, {"id": "a10_q7", "block": "Art. 1º — Repartições no Exterior", "type": "single", "statement": "(Certo/Errado) A regulamentação específica das contratações nas repartições sediadas no exterior será editada por decreto do Presidente da República.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. É por ministro de Estado, não por decreto presidencial."}, {"id": "a10_q8", "block": "Art. 1º — Recursos Estrangeiros", "type": "single", "statement": "(Certo/Errado) Nas licitações com recursos de empréstimo ou doação oriundos de agência oficial de cooperação estrangeira ou de organismo financeiro de que o Brasil seja parte, podem ser admitidas condições decorrentes de acordos internacionais aprovados pelo Congresso Nacional e ratificados pelo Presidente da República.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do inciso I do §3º. Atenção: quem aprova é o Congresso, quem ratifica é o Presidente."}, {"id": "a10_q9", "block": "Art. 1º — Recursos Estrangeiros", "type": "single", "statement": "Para serem admitidas as condições peculiares constantes das normas das agências/organismos (inciso II do §3º), exige-se, cumulativamente, que:", "options": [{"id": "a", "label": "Sejam exigidas para a obtenção do recurso; não conflitem com os princípios constitucionais; sejam indicadas no contrato e objeto de parecer jurídico favorável prévio."}, {"id": "b", "label": "Sejam exigidas para a obtenção do recurso; sejam ratificadas pelo Congresso; constem do edital."}, {"id": "c", "label": "Não conflitem com os princípios constitucionais; tenham parecer favorável do Tribunal de Contas; constem do edital."}, {"id": "d", "label": "Sejam aprovadas por decreto; não conflitem com a lei local; sejam indicadas no contrato."}, {"id": "e", "label": "Sejam exigidas para a obtenção do recurso; tenham parecer favorável do controle interno; sejam posteriores à celebração do contrato."}], "correct": "a", "explanation": "As três alíneas (a, b, c) do inciso II do §3º: exigidas para obter o recurso + não conflitar com princípios constitucionais + indicadas no contrato com parecer jurídico favorável prévio."}, {"id": "a10_q10", "block": "Art. 1º — Recursos Estrangeiros", "type": "single", "statement": "(Certo/Errado) O parecer favorável necessário para admitir as condições peculiares das agências internacionais deve ser emitido pelo Tribunal de Contas, após a celebração do contrato.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. Dois erros: é o órgão jurídico do contratante do financiamento (não o TCU) e previamente à celebração (não depois)."}, {"id": "a10_q11", "block": "Art. 1º — §§4º e 5º", "type": "single", "statement": "Assinale a correta quanto aos §§4º e 5º do art. 1º:", "options": [{"id": "a", "label": "A documentação para autorização do empréstimo é encaminhada à Câmara dos Deputados."}, {"id": "b", "label": "As contratações relativas à gestão das reservas internacionais serão disciplinadas pelo Ministério da Fazenda."}, {"id": "c", "label": "As contratações relativas à gestão das reservas internacionais serão disciplinadas em ato normativo próprio do Banco Central do Brasil, observado o art. 37, caput, da CF."}, {"id": "d", "label": "A documentação encaminhada ao Senado Federal dispensa referência às condições contratuais."}, {"id": "e", "label": "A gestão das reservas internacionais não se submete a qualquer princípio constitucional."}], "correct": "c", "explanation": "§5º — Banco Central + art. 37, caput. O §4º (Senado Federal, não Câmara) aparece nos distratores."}, {"id": "a10_q12", "block": "Art. 2º — Hipóteses de Aplicação", "type": "multi", "statement": "Das hipóteses abaixo, marque aquelas a que esta Lei se aplica (Art. 2º — marque as 7 corretas):", "hint": "Marque as 7 corretas.", "options": [{"id": "a", "label": "Compra, inclusive por encomenda"}, {"id": "b", "label": "Concessão e permissão de uso de bens públicos"}, {"id": "c", "label": "Locação"}, {"id": "d", "label": "Obras e serviços de arquitetura e engenharia"}, {"id": "e", "label": "Prestação de serviços, inclusive os técnico-profissionais especializados"}, {"id": "f", "label": "Contratações de tecnologia da informação e de comunicação"}, {"id": "g", "label": "Alienação e concessão de direito real de uso de bens"}, {"id": "h", "label": "Operação de crédito, interno ou externo"}, {"id": "i", "label": "Parceria público-privada (PPP)"}, {"id": "j", "label": "Gestão de dívida pública"}], "correct": ["a", "b", "c", "d", "e", "f", "g"], "explanation": "Os sete incisos do Art. 2º: alienação/direito real de uso (I); compra (II); locação (III); concessão e permissão de uso de bens (IV); prestação de serviços (V); obras e engenharia (VI); TIC (VII). PPP, operação de crédito e gestão de dívida ficam de fora por lei específica ou pelo Art. 3º."}, {"id": "a10_q13", "block": "Art. 3º — Não Subordinação", "type": "multi", "statement": "Marque as DUAS hipóteses que o Art. 3º elenca como NÃO subordinadas ao regime desta Lei:", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "Operação de crédito, interno ou externo, e gestão de dívida pública, incluídas as contratações de agente financeiro e a concessão de garantia relacionadas a esses contratos."}, {"id": "b", "label": "Contratações sujeitas a normas previstas em legislação própria."}, {"id": "c", "label": "Empresas públicas, sociedades de economia mista e suas subsidiárias."}, {"id": "d", "label": "Contratações realizadas por repartições públicas sediadas no exterior."}, {"id": "e", "label": "Contratações relativas à gestão das reservas internacionais do País."}], "correct": ["a", "b"], "explanation": "O Art. 3º lista apenas dois incisos: I — operação de crédito e gestão de dívida; II — contratações com legislação própria. Estatais ficam fora pelo Art. 1º, §1º. Repartições no exterior seguem esta Lei adaptada (Art. 1º, §2º). Reservas internacionais ficam fora pelo Art. 1º, §5º."}, {"id": "a10_q14", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "(Certo/Errado) Não se subordinam ao regime da Lei 14.133/2021 os contratos que tenham por objeto operação de crédito, interno ou externo, e gestão de dívida pública, incluídas as contratações de agente financeiro e a concessão de garantia relacionadas a esses contratos.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do inciso I do Art. 3º."}, {"id": "a10_q15", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "(Certo/Errado) A não subordinação prevista no inciso I do Art. 3º alcança somente as operações de crédito interno, mantendo-se as de crédito externo sob o regime desta Lei.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. É operação de crédito interno OU externo — ambas excluídas."}, {"id": "a10_q16", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "(Certo/Errado) As contratações de agente financeiro e a concessão de garantia só ficam fora do regime desta Lei quando relacionadas aos contratos de operação de crédito e de gestão da dívida pública.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. A expressão 'relacionadas a esses contratos' condiciona a exclusão."}, {"id": "a10_q17", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "Assinale a alternativa que reproduz corretamente o inciso I do Art. 3º:", "options": [{"id": "a", "label": "Operação de crédito apenas externo e gestão de dívida pública, incluídas as contratações de agente financeiro."}, {"id": "b", "label": "Operação de crédito, interno ou externo, e gestão de dívida pública, incluídas as contratações de agente financeiro e a concessão de garantia relacionadas a esses contratos."}, {"id": "c", "label": "Operação de crédito, interno ou externo, e gestão de dívida pública, excluídas as contratações de agente financeiro."}, {"id": "d", "label": "Operação de crédito e gestão de dívida pública, incluída a contratação obrigatória de seguro-garantia."}, {"id": "e", "label": "Gestão de dívida pública somente, sem abranger operações de crédito."}], "correct": "b", "explanation": "Os distratores trocam 'apenas externo', 'excluídas', 'seguro-garantia' e 'somente dívida'."}, {"id": "a10_q18", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "(Certo/Errado) Não se subordinam ao regime desta Lei as contratações sujeitas a normas previstas em legislação própria.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do inciso II do Art. 3º."}, {"id": "a10_q19", "block": "Art. 3º — Não Subordinação", "type": "single", "statement": "(Certo/Errado) Ainda que exista legislação própria disciplinando determinada contratação, esta permanece subordinada ao regime geral da Lei 14.133/2021.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. O inciso II faz justamente o contrário: havendo legislação própria, a contratação não se subordina a esta Lei."}, {"id": "a10_q20", "block": "Art. 4º — ME e EPP", "type": "multi", "statement": "Assinale as DUAS hipóteses em que os benefícios da LC 123/2006 NÃO se aplicam (Art. 4º, §1º):", "hint": "Marque as 2 corretas.", "options": [{"id": "a", "label": "No caso de aquisição de bens ou contratação de serviços em geral, ao item cujo valor estimado for superior à receita bruta máxima admitida para enquadramento como EPP."}, {"id": "b", "label": "No caso de aquisição de bens ou contratação de serviços em geral, à licitação cujo valor estimado for superior ao teto da EPP."}, {"id": "c", "label": "No caso de contratação de obras e serviços de engenharia, às licitações cujo valor estimado for superior à receita bruta máxima admitida para enquadramento como EPP."}, {"id": "d", "label": "No caso de contratação de obras e serviços de engenharia, ao item cujo valor estimado for superior ao teto da EPP."}, {"id": "e", "label": "No caso de aquisição de bens, ao item cujo valor estimado for superior à receita bruta máxima da microempresa."}], "correct": ["a", "c"], "explanation": "Bens/serviços: limite por ITEM; obras/engenharia: limite pela LICITAÇÃO. B e D invertem a unidade de medida. E troca o referencial (é o teto da EPP, não da ME)."}, {"id": "a10_q21", "block": "Art. 4º — ME e EPP", "type": "single", "statement": "(Certo/Errado) A obtenção dos benefícios fica limitada às ME e EPP que, no ano-calendário de realização da licitação, ainda não tenham celebrado contratos com a Administração Pública cujos valores somados extrapolem a receita bruta máxima admitida para enquadramento como EPP.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §2º do Art. 4º."}, {"id": "a10_q22", "block": "Art. 4º — ME e EPP", "type": "single", "statement": "(Certo/Errado) Cabe ao órgão ou entidade, a seu critério, decidir se exige ou não do licitante a declaração de observância do limite anual de contratos.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. Não é facultativo — o órgão deve exigir a declaração."}, {"id": "a10_q23", "block": "Art. 4º — ME e EPP", "type": "single", "statement": "(Certo/Errado) Nas contratações com prazo de vigência superior a 1 (um) ano, será considerado o valor anual do contrato na aplicação dos limites previstos nos §§1º e 2º.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §3º do Art. 4º."}, {"id": "a10_q24", "block": "Art. 4º — ME e EPP", "type": "single", "statement": "(Certo/Errado) Nas contratações com vigência superior a 1 ano, considera-se o valor global do contrato para a aplicação dos limites dos §§1º e 2º.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. É o valor ANUAL do contrato, não o global."}, {"id": "a10_q25", "block": "Art. 7º — Designação de Agentes", "type": "single", "statement": "(Certo/Errado) Cabe à autoridade máxima do órgão ou da entidade, ou a quem as normas de organização administrativa indicarem, promover gestão por competências e designar agentes públicos para o desempenho das funções essenciais à execução desta Lei.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do caput do Art. 7º."}, {"id": "a10_q26", "block": "Art. 7º — Designação de Agentes", "type": "single", "statement": "(Certo/Errado) Cabe exclusivamente à autoridade máxima do órgão ou da entidade promover a gestão por competências e designar os agentes públicos para as funções essenciais à execução desta Lei.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. O 'exclusivamente' derruba a assertiva — pode ser a autoridade máxima OU a quem as normas de organização administrativa indicarem."}, {"id": "a10_q27", "block": "Art. 7º — Requisitos dos Agentes", "type": "multi", "statement": "O caput do Art. 7º exige que os agentes designados preencham TRÊS requisitos. Marque as três alternativas que correspondem exatamente a esses requisitos:", "hint": "Marque as 3 corretas.", "options": [{"id": "a", "label": "Sejam, preferencialmente, servidor efetivo ou empregado público dos quadros permanentes da Administração Pública."}, {"id": "b", "label": "Tenham, no mínimo, 3 anos de experiência comprovada em licitações e contratos."}, {"id": "c", "label": "Não sejam cônjuge ou companheiro de licitantes ou contratados habituais da Administração, nem tenham com eles vínculo de parentesco, colateral ou por afinidade, até o terceiro grau, ou de natureza técnica, comercial, econômica, financeira, trabalhista e civil."}, {"id": "d", "label": "Sejam, obrigatoriamente, servidores efetivos ou empregados públicos dos quadros permanentes da Administração Pública."}, {"id": "e", "label": "Tenham atribuições relacionadas a licitações e contratos ou possuam formação compatível ou qualificação atestada por certificação profissional emitida por escola de governo criada e mantida pelo poder público."}, {"id": "f", "label": "Possuam nível superior completo em Direito ou em Administração Pública."}, {"id": "g", "label": "Não tenham com licitantes ou contratados habituais da Administração vínculo de parentesco, colateral ou por afinidade, até o quarto grau."}], "correct": ["a", "c", "e"], "explanation": "Os três requisitos (incisos I, II e III do Art. 7º): (A) preferencialmente servidor efetivo; (C) sem parentesco até 3º grau com licitantes; (E) atribuições/formação/certificação de escola de governo. D erra ao dizer 'obrigatoriamente'. G erra o grau (é até o 3º, não o 4º)."}, {"id": "a10_q28", "block": "Art. 7º — Segregação de Funções", "type": "single", "statement": "(Certo/Errado) A autoridade deverá observar o princípio da segregação de funções, vedada a designação do mesmo agente público para atuação simultânea em funções mais suscetíveis a riscos.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §1º do Art. 7º."}, {"id": "a10_q29", "block": "Art. 7º — Segregação de Funções", "type": "single", "statement": "(Certo/Errado) A segregação de funções veda a atuação simultânea do mesmo agente em funções suscetíveis a riscos com o objetivo único de acelerar o procedimento licitatório.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. A finalidade é reduzir a possibilidade de ocultação de erros e de ocorrência de fraudes — nada a ver com acelerar o procedimento."}, {"id": "a10_q30", "block": "Art. 7º — Assessoramento Jurídico", "type": "single", "statement": "(Certo/Errado) O disposto no caput e no §1º, inclusive os requisitos estabelecidos, aplica-se também aos órgãos de assessoramento jurídico e de controle interno da Administração.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §2º do Art. 7º."}, {"id": "a10_q31", "block": "Art. 7º — Assessoramento Jurídico", "type": "single", "statement": "(Certo/Errado) Os órgãos de assessoramento jurídico e de controle interno estão dispensados dos requisitos previstos no caput do Art. 7º.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. O §2º estende a eles o caput, o §1º e os requisitos."}, {"id": "a10_q32", "block": "Art. 8º — Agente de Contratação", "type": "single", "statement": "(Certo/Errado) A licitação será conduzida por agente de contratação, pessoa designada pela autoridade competente, entre servidores efetivos ou empregados públicos dos quadros permanentes da Administração Pública, cabendo-lhe tomar decisões, acompanhar o trâmite, dar impulso ao procedimento e executar atividades necessárias ao bom andamento do certame até a homologação.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do caput. Pontos de atenção: escolhido entre servidores efetivos/empregados permanentes; atuação até a homologação."}, {"id": "a10_q33", "block": "Art. 8º — Agente de Contratação", "type": "single", "statement": "(Certo/Errado) Cabe ao agente de contratação conduzir o certame e acompanhá-lo até o encerramento da execução do contrato.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. A atuação vai até a homologação, não até a execução contratual."}, {"id": "a10_q34", "block": "Art. 8º — Agente de Contratação", "type": "single", "statement": "(Certo/Errado) O agente de contratação será auxiliado por equipe de apoio e responderá individualmente pelos atos que praticar, salvo quando induzido a erro pela atuação da equipe.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §1º."}, {"id": "a10_q35", "block": "Art. 8º — Agente de Contratação", "type": "single", "statement": "(Certo/Errado) O agente de contratação responde solidariamente com a equipe de apoio por todos os atos praticados no certame.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. O agente responde individualmente (salvo indução a erro). A responsabilidade solidária é da comissão de contratação."}, {"id": "a10_q36", "block": "Art. 8º — Comissão de Contratação", "type": "single", "statement": "Sobre a comissão de contratação (Art. 8º, §2º), assinale a correta:", "options": [{"id": "a", "label": "Substitui o agente de contratação em qualquer licitação, a critério da autoridade."}, {"id": "b", "label": "Cabe apenas em licitações de bens e serviços comuns."}, {"id": "c", "label": "É formada por, no mínimo, 3 membros, que respondem solidariamente por todos os atos da comissão, ressalvado o membro que expressar posição divergente fundamentada e registrada em ata."}, {"id": "d", "label": "É formada por, no mínimo, 5 membros, que respondem individualmente pelos atos praticados."}, {"id": "e", "label": "Seus membros não respondem pelos atos da comissão."}], "correct": "c", "explanation": "Cabe em bens/serviços especiais (não comuns); mínimo 3 membros; responsabilidade solidária; a única saída é registrar divergência fundamentada em ata."}, {"id": "a10_q37", "block": "Art. 8º — Comissão de Contratação", "type": "single", "statement": "(Certo/Errado) As regras relativas à atuação do agente de contratação e da equipe de apoio, ao funcionamento da comissão de contratação e à atuação de fiscais e gestores de contratos serão estabelecidas em regulamento, prevista a possibilidade de apoio dos órgãos de assessoramento jurídico e de controle interno.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §3º."}, {"id": "a10_q38", "block": "Art. 8º — Assessoria Especializada", "type": "single", "statement": "(Certo/Errado) Em licitação que envolva bens ou serviços especiais cujo objeto não seja rotineiramente contratado pela Administração, poderá ser contratado, por prazo determinado, serviço de empresa ou de profissional especializado para assessorar os agentes responsáveis pela condução da licitação.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §4º."}, {"id": "a10_q39", "block": "Art. 8º — Assessoria Especializada", "type": "single", "statement": "(Certo/Errado) A contratação de empresa ou profissional especializado para assessorar a condução da licitação pode se dar em qualquer licitação e por prazo indeterminado.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. Dois erros — só cabe em bens/serviços especiais não rotineiramente contratados, e por prazo DETERMINADO."}, {"id": "a10_q40", "block": "Art. 8º — Pregoeiro", "type": "single", "statement": "(Certo/Errado) Em licitação na modalidade pregão, o agente responsável pela condução do certame será designado pregoeiro.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do §5º — no pregão, o agente de contratação atende pelo nome de pregoeiro."}, {"id": "a10_q41", "block": "Art. 9º — Vedações ao Agente Público", "type": "single", "statement": "(Certo/Errado) As vedações do art. 9º ao agente público são absolutas, não admitindo qualquer exceção.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. O caput diz 'ressalvados os casos previstos em lei' — há exceções legalmente previstas."}, {"id": "a10_q42", "block": "Art. 9º — Vedações ao Agente Público", "type": "multi", "statement": "O inciso I do Art. 9º veda admitir, prever, incluir ou tolerar situações que se enquadrem nas suas alíneas. Marque as TRÊS situações efetivamente vedadas:", "hint": "Marque as 3 corretas.", "options": [{"id": "a", "label": "Comprometam, restrinjam ou frustrem o caráter competitivo do processo licitatório, inclusive na participação de sociedades cooperativas."}, {"id": "b", "label": "Estabeleçam margem de preferência para produtos manufaturados nacionais."}, {"id": "c", "label": "Estabeleçam preferências ou distinções em razão da naturalidade, da sede ou do domicílio dos licitantes."}, {"id": "d", "label": "Exijam qualificação técnica pertinente e compatível com o objeto."}, {"id": "e", "label": "Sejam impertinentes ou irrelevantes para o objeto específico do contrato."}, {"id": "f", "label": "Concedam tratamento favorecido a microempresas e empresas de pequeno porte."}], "correct": ["a", "c", "e"], "explanation": "São vedadas: (A) frustrar o caráter competitivo; (C) distinções por naturalidade/sede/domicílio; (E) exigências impertinentes ou irrelevantes. B: margem de preferência para produtos nacionais é permitida. D: habilitação pertinente é lícita. F: tratamento favorecido a ME/EPP é exigência constitucional."}, {"id": "a10_q43", "block": "Art. 9º — Vedações ao Agente Público", "type": "single", "statement": "(Certo/Errado) É vedado ao agente estabelecer tratamento diferenciado de natureza comercial, legal, trabalhista ou previdenciária entre empresas brasileiras e estrangeiras, inclusive quanto a moeda, modalidade e local de pagamento, mesmo quando envolvido financiamento de agência internacional.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do inciso II. O 'mesmo quando' reforça a proibição, não é exceção."}, {"id": "a10_q44", "block": "Art. 9º — Vedações ao Agente Público", "type": "single", "statement": "(Certo/Errado) Admite-se tratamento diferenciado entre empresas brasileiras e estrangeiras quando houver financiamento de agência internacional.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "b", "explanation": "ERRADO. É vedado MESMO quando envolvido financiamento de agência internacional."}, {"id": "a10_q45", "block": "Art. 9º — Vedações ao Agente Público", "type": "single", "statement": "(Certo/Errado) É vedado ao agente opor resistência injustificada ao andamento dos processos e, indevidamente, retardar ou deixar de praticar ato de ofício, ou praticá-lo contra disposição expressa em lei.", "options": [{"id": "a", "label": "Certo"}, {"id": "b", "label": "Errado"}], "correct": "a", "explanation": "CERTO. Literalidade do inciso III."}, {"id": "a10_q46", "block": "Art. 9º — Conflito de Interesses", "type": "single", "statement": "(Certo/Errado) Não poderá participar, direta ou indiretamente, da licitação ou da execução do contrato o agente púb const CUSTOM_FOLDERS_KEY = "quiz_estudos_custom_folders";
const CUSTOM_QUIZZES_KEY = "quiz_estudos_custom_quizzes";

function loadCustomFolders() {
  try { const raw = localStorage.getItem(CUSTOM_FOLDERS_KEY); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
function saveCustomFolders(arr) {
  try { localStorage.setItem(CUSTOM_FOLDERS_KEY, JSON.stringify(arr)); } catch (e) {}
}
function loadCustomQuizzesIndex() {
  try { const raw = localStorage.getItem(CUSTOM_QUIZZES_KEY); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
function saveCustomQuizzesIndex(arr) {
  try { localStorage.setItem(CUSTOM_QUIZZES_KEY, JSON.stringify(arr)); } catch (e) {}
}

// Injeta pastas e quizzes customizados na STRUCTURE em runtime
function buildStructureWithCustom() {
  const customFolders = loadCustomFolders();
  const customQuizzes = loadCustomQuizzesIndex();

  // Injeta pastas e quizzes customizados no nível correto da estrutura
  function injectInto(level, path) {
    const pathKey = JSON.stringify(path);
    const foldersCopy = (level.folders || []).map(f => ({
      ...f,
      folders: injectInto({ folders: f.folders || [], quizzes: f.quizzes || [] }, [...path, f.id]).folders,
      quizzes: injectInto({ folders: f.folders || [], quizzes: f.quizzes || [] }, [...path, f.id]).quizzes
    }));
    const quizzesCopy = [...(level.quizzes || [])];

    // Adiciona pastas customizadas criadas neste nível
    for (const cf of customFolders) {
      if (JSON.stringify(cf.parentPath) === pathKey) {
        const subFolders = injectInto({ folders: [], quizzes: [] }, [...path, cf.id]);
        foldersCopy.push({ id: cf.id, name: cf.name, folders: subFolders.folders, quizzes: subFolders.quizzes, _custom: true });
      }
    }
    // Adiciona quizzes customizados criados neste nível
    for (const cq of customQuizzes) {
      if (JSON.stringify(cq.parentPath) === pathKey) {
        quizzesCopy.push({
          id: cq.id, name: cq.name, subtitle: cq.subtitle || '',
          storageKey: cq.storageKey, excludedDefault: [], questions: [], _custom: true
        });
      }
    }
    return { folders: foldersCopy, quizzes: quizzesCopy };
  }

  const injected = injectInto({ folders: STRUCTURE.folders, quizzes: [] }, []);
  return { folders: injected.folders };
}

let _runtimeStructure = null;
function getRuntimeStructure() {
  _runtimeStructure = buildStructureWithCustom();
  return _runtimeStructure;
}

function getNodeByPathDynamic(stack) {
  let level = { folders: getRuntimeStructure().folders, quizzes: [] };
  for (const fid of stack) {
    const folder = (level.folders || []).find(f => f.id === fid);
    if (!folder) break;
    level = { folders: folder.folders || [], quizzes: folder.quizzes || [], _self: folder };
  }
  return level;
}

function findQuizByIdDynamic(qid, folders) {
  for (const folder of (folders || getRuntimeStructure().folders)) {
    if (folder.quizzes) {
      const q = folder.quizzes.find(x => x.id === qid);
      if (q) return q;
    }
    if (folder.folders) {
      const found = findQuizByIdDynamic(qid, folder.folders);
      if (found) return found;
    }
  }
  return null;
}
